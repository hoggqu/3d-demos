<style>

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10181e;color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}

[hidden]{display:none!important}
#view{display:block;width:100%;height:100%;outline:none;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none}
button{pointer-events:auto}
.title{position:absolute;inset:0;background:linear-gradient(90deg,#070d15e8,#070d15a3 26%,#070d1510 65%),linear-gradient(0deg,#060c14b0,transparent 23%)}
.title-content{position:absolute;left:clamp(25px,8vw,138px);top:50%;width:min(470px,83vw);transform:translateY(-48%)}

<body>
<canvas id="view" tabindex="0" aria-label="东汐雨夜三维街区"></canvas>
<div class="overlay">

<script id="shaders" type="text/wgsl">
struct Frame {
  view: mat4x4f, floorMirror: mat4x4f, shopMirror: mat4x4f,
  eye: vec4f, forward: vec4f, right: vec4f, up: vec4f,
  train: vec4f, options: vec4f, patrol: vec4f, dog: vec4f, walk: vec4f, wipers: vec4f,
  cars: array<vec4f,3>, couplers: array<vec4f,2>, couplerScale: vec4f,
  traffic: array<RoadVehicle,TRAFFIC_COUNT>,
  robotBones: array<RigidJoint,ROBOT_JOINT_COUNT>,
  leash: array<vec4f,LEASH_POINT_COUNT>,
}
struct RoadVehicle { pose: vec4f, surface: vec4f, wheels: vec4f }
struct RigidJoint { translation: vec4f, rotation: vec4f }
struct Lamp { position: vec4f, color: vec4f, axis: vec4f }
@group(0) @binding(0) var<uniform> frame: Frame;
@group(1) @binding(0) var signage: texture_2d_array<f32>;
@group(1) @binding(1) var linearSampler: sampler;
@group(1) @binding(2) var<uniform> lights: array<Lamp,LIGHT_COUNT>;
@group(2) @binding(0) var floorMirrorTex: texture_2d<f32>;
@group(2) @binding(1) var shopMirrorTex: texture_2d<f32>;
@group(2) @binding(2) var sceneTex: texture_2d<f32>;
@group(2) @binding(3) var sceneDepth: texture_depth_2d;
@group(2) @binding(4) var fogTex: texture_2d<f32>;
@group(2) @binding(5) var glowTex: texture_2d<f32>;
const PI = 3.14159265;
const TAU = 6.28318531;

fn hash(p: vec2f) -> f32 {
  let q = fract(vec3f(p.xyx)*vec3f(0.1031,0.1030,0.0973));
  let n = q+dot(q,q.yzx+vec3f(33.33));
  return fract((n.x+n.y)*n.z);
}
fn noise(p: vec2f) -> f32 {
  let cell=floor(p);
  let f=fract(p);
  let u=f*f*(3.0-2.0*f);
  return mix(mix(hash(cell),hash(cell+vec2f(1,0)),u.x),
             mix(hash(cell+vec2f(0,1)),hash(cell+vec2f(1,1)),u.x),u.y);
}
fn noise3(p: vec3f) -> f32 {
  let z=floor(p.z);
  let u=fract(p.z);
  return mix(noise(p.xy+z*vec2f(8.13,17.19)),noise(p.xy+(z+1.0)*vec2f(8.13,17.19)),u*u*(3.0-2.0*u));
}
fn project(matrix: mat4x4f, p: vec3f) -> vec2f {
  let clip=matrix*vec4f(p,1);
  return vec2f(0.5)+vec2f(0.5,-0.5)*clip.xy/max(clip.w,0.0001);
}
fn screenEdge(uv: vec2f) -> f32 {
  let margin=min(uv,1.0-uv);
  return smoothstep(0.0,0.03,min(margin.x,margin.y));
}
fn cameraRay(uv: vec2f) -> vec3f {
  return normalize(frame.forward.xyz+frame.right.xyz*((uv.x*2.0-1.0)*frame.right.w)
    +frame.up.xyz*((1.0-uv.y*2.0)*frame.up.w));
}
fn sky(ray: vec3f) -> vec3f {
  let height=max(ray.y,0.0);
  let layers=noise(ray.xz/(height+0.51)*5.7+vec2f(frame.eye.w*0.024,-3.8));
  let overcast=mix(vec3f(0.012,0.019,0.031),vec3f(0.003,0.007,0.016),smoothstep(0.02,0.76,height));
  let city=pow(max(0.0,dot(ray,normalize(vec3f(0.71,0.10,-0.68)))),6.0);
  let west=pow(max(0.0,dot(ray,normalize(vec3f(-0.67,0.13,-0.76)))),8.0);
  return overcast*(0.72+0.42*layers)+vec3f(0.012,0.009,0.022)*city+vec3f(0.009,0.003,0.012)*west;
}
fn zone(p: vec2f,center: vec2f,radius: vec2f) -> f32 {
  return 1.0-smoothstep(0.48,1.0,length((p-center)/radius));
}
fn puddle(p: vec2f) -> f32 {
  let distortion=vec2f(noise(p*1.3),noise(p*1.1+vec2f(3.8,-2.7)))-0.5;
  let q=p+distortion*0.76;
  let broad=max(zone(q,vec2f(-6.50,2.52),vec2f(2.37,3.42)),zone(q,vec2f(-4.28,-3.33),vec2f(2.73,2.32)));
  let shoulder=max(zone(q,vec2f(-9.58,7.28),vec2f(3.15,0.74)),zone(q,vec2f(-1.92,-7.18),vec2f(4.94,0.83)));
  let gutter=max(zone(q,vec2f(-10.55,-6.45),vec2f(3.17,1.41)),zone(q,vec2f(4.28,4.92),vec2f(4.9,2.74)));
  let scattered=smoothstep(0.62,0.83,noise(p*0.30))*0.78;
  return smoothstep(0.21,0.74,max(max(broad,shoulder),max(gutter,scattered)));
}
fn ringSlope(p: vec2f, scale: f32, time: f32) -> vec2f {
  let cell=floor(p*scale);
  let random=hash(cell+vec2f(3.71,9.16));
  let tick=floor(time*(1.65+random*0.98)+random*29.0);
  let center=(cell+vec2f(0.28,0.26)+vec2f(hash(cell+tick),hash(cell+tick*1.71))*0.44)/scale;
  let delta=p-center;
  let radius=length(delta);
  let life=fract(time*(1.65+random*0.98)+random*29.0);
  let wave=radius-life*(0.13+random*0.11);
  let band=exp(-abs(wave)*104.0)*sin(wave*157.0);
  return delta/max(radius,0.001)*band*(1.0-life)*(0.34+0.66*random);
}
fn asphaltSlope(p: vec2f, water: f32) -> vec2f {
  let t=frame.eye.w;
  let surface=vec2f(cos(dot(p,vec2f(8.3,12.1))-t*4.0),sin(dot(p,vec2f(11.3,-7.9))+t*3.2));
  let gutter=zone(p,vec2f(-8.4,8.18),vec2f(8.3,0.78));
  return surface*mix(0.027,0.0074,water)
    +(ringSlope(p,2.2,t)+ringSlope(p+vec2f(0.21,0.37),1.81,t+2.0))*water*(0.054+0.034*gutter);
}

fn trackOffset(p: vec2f) -> f32 {
  let offset=vec2f(abs(p.x)-TRACK_STRAIGHT,p.y-TRACK_Z+TRACK_RADIUS);
  if offset.y<0.0 { return offset.x-TRACK_RADIUS; }
  return length(vec2f(max(0.0,offset.x),offset.y))-TRACK_RADIUS;
}
fn trainSource(p: vec3f) -> vec4f {
  var best=vec4f(0);
  var distanceSquared=1e8;
  let offset=p.xz-frame.train.xz;
  if frame.train.w<0.001 || dot(offset,offset)>36.0*36.0 { return best; }
  for(var i=0u;i<3u;i++){
    let car=frame.cars[i];
    let along=car.zw;
    let across=vec2f(-along.y,along.x);
    let local=p.xz-car.xy;
    let within=dot(local,along);
    let slot=clamp(round(within/1.24),-3.0,3.0)*1.24;
    let side=select(-1.0,1.0,dot(local,across)>0.0);
    let lamp=car.xy+along*slot+across*side*1.49;
    let d=p.xz-lamp;
    let d2=dot(d,d);
    if d2<distanceSquared && lamp.y>=TRACK_BACK_Z {
      distanceSquared=d2;
      let gap=within-slot;
      let segment=0.41+0.59*exp(-gap*gap*4.9);
      let span=1.0-smoothstep(3.9,8.6,abs(within));
      best=vec4f(lamp.x,frame.train.y+1.62,lamp.y,span*segment*frame.train.w);
    }
  }
  return best;
}
fn trainFalloff(p: vec3f,source: vec4f) -> f32 {
  let d=source.xyz-p;
  let beamAtDeck=p.xz+d.xz*clamp((6.47-p.y)/max(d.y,0.001),0.0,1.0);
  let railShadow=1.0-smoothstep(2.0,2.34,abs(trackOffset(beamAtDeck)));
  let visibility=1.0-0.87*railShadow*(1.0-smoothstep(6.25,6.54,p.y));
  return source.w*visibility*max(0.0,1.0-dot(d,d)/347.0)/(3.3+dot(d,d));
}
fn railHeadlamp(side: f32) -> vec3f {
  let lead=frame.cars[2];
  let lateral=vec2f(-lead.w,lead.z);
  let p=lead.xy+lead.zw*TRAIN_LAMP.x+lateral*side*TRAIN_LAMP.z;
  return vec3f(p.x,frame.train.y+TRAIN_LAMP.y,p.y);
}
fn railHeadlampAxis(side: f32) -> vec3f {
  let forward=frame.cars[2].zw;
  let aim=forward+vec2f(-forward.y,forward.x)*side*0.019;
  return normalize(vec3f(aim.x,-0.043,aim.y));
}
fn railLampVisibility(origin: vec3f) -> f32 {
  return frame.train.w*smoothstep(TRACK_BACK_Z,TRACK_PORTAL_Z-1.5,origin.z);
}
fn roadHeadlamp(vehicle: RoadVehicle,side: f32) -> vec3f {
  let along=vehicle.pose.zw;
  let p=vehicle.pose.xy+along*ROAD_LAMP.x+vec2f(-along.y,along.x)*side*ROAD_LAMP.z;
  return vec3f(p.x,vehicle.surface.x+ROAD_LAMP.y+ROAD_LAMP.x*vehicle.surface.y,p.y);
}
fn roadHeadlampAxis(vehicle: RoadVehicle,side: f32) -> vec3f {
  let along=vehicle.pose.zw;
  let aim=along+vec2f(-along.y,along.x)*side*0.015;
  return normalize(vec3f(aim.x,vehicle.surface.y-0.10,aim.y));
}
fn headlampFalloff(p: vec3f,origin: vec3f,axis: vec3f,range: f32,radius: f32,spread: f32) -> f32 {
  let delta=p-origin;
  let along=dot(delta,axis);
  if along<=0.0 || along>=range { return 0.0; }
  let radial=length(delta-axis*along)/max(radius+along*spread,0.001);
  let cone=1.0-smoothstep(0.24,1.0,radial);
  return cone*(1.0-smoothstep(range*0.65,range,along))/(1.45+dot(delta,delta));
}
fn roadHeadlights(p: vec3f) -> vec4f {
  var best=vec4f(0);
  if p.y>4.0 { return best; }
  for(var i=0u;i<TRAFFIC_COUNT;i++){
    let vehicle=frame.traffic[i];
    let delta=p.xz-vehicle.pose.xy;
    if vehicle.surface.w<=0.001 || dot(delta,delta)>17.0*17.0 { continue; }
    let along=vehicle.pose.zw;
    let lateral=vec2f(-along.y,along.x);
    let side=select(-1.0,1.0,dot(delta,lateral)>0.0);
    let origin=roadHeadlamp(vehicle,side);
    let axis=roadHeadlampAxis(vehicle,side);
    let power=headlampFalloff(p,origin,axis,ROAD_BEAM.x,ROAD_BEAM.y,ROAD_BEAM.z)*vehicle.surface.w;
    if power>best.w {best=vec4f(origin,power);}
  }
  return best;
}
fn lampSample(p: vec3f,light: Lamp) -> vec4f {
  let halfLength=max(0.0,-light.axis.w);
  let along=clamp(dot(p-light.position.xyz,light.axis.xyz),-halfLength,halfLength);
  let d=light.position.xyz+light.axis.xyz*along-p;
  let d2=dot(d,d);
  let window=max(0.0,1.0-d2/(light.position.w*light.position.w));
  if window<=0.0 {return vec4f(d,0);}
  let cone=dot(d,-light.axis.xyz)*inverseSqrt(max(0.0001,d2));
  let beam=select(1.0,0.035+0.965*smoothstep(light.axis.w,min(0.98,light.axis.w+0.23),cone),light.axis.w>0.0);
  return vec4f(d,light.color.w*beam*window*window/(2.55+d2));
}
fn surfaceLight(n: vec3f,v: vec3f,l: vec3f,base: vec3f,rough: f32,metal: f32) -> vec3f {
  let noL=max(dot(n,l),0.0);
  let noV=max(dot(n,v),0.045);
  let h=normalize(l+v+vec3f(0.00001,0,0));
  let nh=max(dot(n,h),0.0);
  let a2=max(0.001,pow(rough,4.0));
  let d=nh*nh*(a2-1.0)+1.0;
  let distribution=a2/(PI*d*d);
  let visibility=0.5/max(noL*sqrt(noV*noV*(1.0-a2)+a2)+noV*sqrt(noL*noL*(1.0-a2)+a2),0.001);
  let f0=mix(vec3f(0.033),base,metal);
  let fresnel=f0+(1.0-f0)*pow(1.0-clamp(dot(h,v),0.0,1.0),5.0);
  return ((1.0-fresnel)*base*(1.0-metal)/PI+fresnel*min(distribution*visibility,24.0))*noL;
}
fn noodleLightThroughGlass(p: vec3f,source: vec3f) -> f32 {
  let t=(NOODLE_GLASS_Z-source.z)/max(p.z-source.z,0.001);
  let hit=mix(source.xy,p.xy,t);
  let x=hit.x-NOODLE_X;
  let width=smoothstep(-1.98,-1.88,x)*(1.0-smoothstep(1.97,2.07,x));
  let frames=(1.0-smoothstep(0.014,0.14,abs(x+0.41)))+(1.0-smoothstep(0.014,0.14,abs(x-0.69)));
  let bottom=select(0.50,0.29,x>-0.35&&x<0.62);
  let height=smoothstep(bottom-0.07,bottom+0.10,hit.y)*(1.0-smoothstep(2.59,2.76,hit.y));
  return width*(1.0-0.67*frames)*height;
}
fn noodleLampVisibility(index: u32,p: vec3f,source: vec3f) -> f32 {
  if index<NOODLE_FIRST_LIGHT {return 1.0;}
  if p.z>NOODLE_GLASS_Z {
    if index==NOODLE_FIRST_LIGHT {return noodleLightThroughGlass(p,source);}
    return 0.0;
  }
  let inside=abs(p.x-NOODLE_X)<2.28&&p.z>NOODLE_BACK_Z&&p.y<3.48;
  return select(0.0,1.0,inside);
}
struct Vertex {
  @location(0) position: vec3f, @location(1) normal: vec3f,
  @location(2) uv: vec2f, @location(3) color: vec3f, @location(4) code: vec2f,
}
struct SceneVertex {
  @builtin(position) position: vec4f, @location(0) world: vec3f, @location(1) normal: vec3f,
  @location(2) uv: vec2f, @location(3) color: vec3f, @location(4) @interpolate(flat) material: u32,
  @location(5) @interpolate(flat) motion: u32, @location(6) materialPosition: vec4f,
}
fn sceneVertex(v: Vertex,matrix: mat4x4f) -> SceneVertex {
  let motion=u32(v.code.y+0.5);
  let onTrain=motion>0u&&motion<8u;
  let onRoadCar=motion>=TRAFFIC_MOTION&&motion<ROBOT_MOTION;
  var world=v.position;
  var n=v.normal;
  if onTrain {
    var along=vec2f(1,0);
    var center=vec2f(0);
    if motion<=3u || motion>=6u {
      let car=frame.cars[min(2u,motion-1u)];
      along=car.zw;
      center=car.xy;
      if motion>=6u {
        let side=select(-1.0,1.0,motion==7u);
        let pivot=vec2f(WIPER_PIVOT.y,side*WIPER_PIVOT.z);
        let arm=world.yz-pivot;
        let angle=frame.wipers.x+(side+1.0)*0.036;
        let c=cos(angle);
        let s=sin(angle);
        world=vec3f(world.x,pivot+vec2f(c*arm.x-s*arm.y,s*arm.x+c*arm.y));
        n=vec3f(n.x,c*n.y-s*n.z,s*n.y+c*n.z);
      }
    } else {
      let join=frame.couplers[motion-4u];
      along=join.zw;
      center=join.xy;
      world.x*=frame.couplerScale[motion-4u];
      n.x/=frame.couplerScale[motion-4u];
    }
    let across=vec2f(-along.y,along.x);
    let p=center+along*world.x+across*world.z;
    let norm=along*n.x+across*n.z;
    world=vec3f(p.x,world.y+frame.train.y,p.y);
    n=vec3f(norm.x,n.y,norm.y);
  } else if onRoadCar {
    let trafficPart=motion-TRAFFIC_MOTION;
    let roadIndex=trafficPart/3u;
    let vehicle=frame.traffic[roadIndex];
    let along=vehicle.pose.zw;
    let across=vec2f(-along.y,along.x);
    if trafficPart%3u!=0u {
      let axle=select(ROAD_AXLES.x,ROAD_AXLES.y,trafficPart%3u==2u);
      let offset=world.xy-vec2f(axle,ROAD_AXLES.z);
      let spin=vehicle.wheels.xy;
      world.x=axle+dot(offset,vec2f(spin.x,spin.y));
      world.y=ROAD_AXLES.z+dot(offset,vec2f(-spin.y,spin.x));
      n=vec3f(dot(n.xy,vec2f(spin.x,spin.y)),dot(n.xy,vec2f(-spin.y,spin.x)),n.z);
    }
    let p=vehicle.pose.xy+along*world.x+across*world.z;
    let norm=along*n.x+across*n.z;
    world=vec3f(p.x,world.y+vehicle.surface.x+world.x*vehicle.surface.y,p.y);
    n=vec3f(norm.x-along.x*n.y*vehicle.surface.y,n.y,norm.y-along.y*n.y*vehicle.surface.y);
  } else if motion>=LEASH_MOTION {
    let index=motion-LEASH_MOTION;
    let a=frame.leash[index].xyz;
    let b=frame.leash[index+1u].xyz;
    let axis=normalize(b-a);
    let side=normalize(cross(axis,vec3f(0,1,0)));
    let up=cross(side,axis);
    world=mix(a,b,world.y)+side*world.x+up*world.z;
    n=side*n.x+axis*n.y+up*n.z;
  } else if motion>=ROBOT_MOTION {
    let bone=frame.robotBones[motion-ROBOT_MOTION];
    let q=bone.rotation;
    world*=ROBOT_SCALE;
    let delta=2.0*cross(q.xyz,world);
    world+=q.w*delta+cross(q.xyz,delta)+bone.translation.xyz;
    let tilt=2.0*cross(q.xyz,n);
    n+=q.w*tilt+cross(q.xyz,tilt);
  } else if motion>=DOG_MOTION {
    let part=motion-DOG_MOTION;
    let walker=frame.dog;
    let clock=frame.walk.x;
    if part==0u {
      world.y+=sin(clock*TAU*2.0)*0.021;
    } else {
      let isFoot=part>=9u;
      let leg=select((part-1u)/2u,max(9u,part)-9u,isFoot);
      let side=select(-1.0,1.0,leg%2u==1u);
      let front=select(-1.0,1.0,leg>=2u);
      let cycle=fract(clock+select(0.0,0.5,(leg==1u||leg==2u)));
      let step=clamp((cycle-0.58)/0.42,0.0,1.0);
      let stride=select(mix(0.18,-0.18,cycle/0.58),mix(-0.18,0.18,smoothstep(0.0,1.0,step)),cycle>0.58);
      let hip=vec3f(side*0.288,0.57+sin(clock*TAU*2.0)*0.021,front*0.295);
      let foot=vec3f(side*0.39,0.069+sin(PI*step)*0.14,front*0.37+stride);
      let knee=vec3f(side*0.374,0.322+sin(PI*step)*0.047,front*0.41-0.115+stride*0.52);
      let lower=(part-1u)%2u==1u;
      let a=select(hip,knee,lower);
      let b=select(knee,foot,lower);
      let down=normalize(b-a);
      let sideAxis=normalize(cross(vec3f(0,0,1),down));
      let depthAxis=cross(down,sideAxis);
      if isFoot {
        world+=foot;
      } else {
        world=a+sideAxis*world.x+down*world.y*distance(a,b)+depthAxis*world.z;
        n=sideAxis*n.x+down*n.y+depthAxis*n.z;
      }
    }
    let c=cos(walker.w);
    let s=sin(walker.w);
    world=vec3f(c*world.x+s*world.z,world.y,c*world.z-s*world.x)+walker.xyz;
    n=vec3f(c*n.x+s*n.z,n.y,c*n.z-s*n.x);
  }
  return SceneVertex(matrix*vec4f(world,1.0),world,n,v.uv,v.color,u32(v.code.x+0.5),motion,vec4f(v.position,v.normal.x));
}
@vertex fn sceneVS(v: Vertex) -> SceneVertex { return sceneVertex(v,frame.view); }
@vertex fn floorVS(v: Vertex) -> SceneVertex { return sceneVertex(v,frame.floorMirror); }
@vertex fn shopVS(v: Vertex) -> SceneVertex { return sceneVertex(v,frame.shopMirror); }

fn shade(v: SceneVertex,eye: vec3f,reflections: bool) -> vec3f {
  let p=v.world;
  let id=v.material;
  let norm=normalize(v.normal);
  var n=norm;
  let onTrain=v.motion>0u&&v.motion<8u;
  let onRoadCar=v.motion>=TRAFFIC_MOTION&&v.motion<ROBOT_MOTION;
  let view=normalize(eye-p);
  let vertical=abs(n.y)<0.61;
  let top=n.y>0.7;
  let materialP=select(p,v.materialPosition.xyz,v.motion>0u);
  let materialNormalX=select(n.x,v.materialPosition.w,v.motion>0u);
  let wall=vec2f(select(materialP.x,materialP.z,abs(materialNormalX)>0.60),materialP.y);
  let uv=select(materialP.xz,wall,vertical);
  let width=max(length(dpdx(uv)),length(dpdy(uv)));
  let dx=dpdx(v.uv);
  let dy=dpdy(v.uv);
  let cloud=noise(uv*0.67);
  let mid=noise(uv*5.31);
  let grain=mix(noise(uv*66.7),0.5,smoothstep(0.003,0.023,width));
  var base=v.color*(0.82+0.19*cloud+0.09*mid);
  var rough=0.79;
  var metal=0.0;
  var emission=vec3f(0);
  var pool=0.0;
  var film=0.0;
  var ripple=vec2f(0);
  let underAwning=zone(p.xz,vec2f(-8.9,12.15),vec2f(9.35,5.9))*(1.0-smoothstep(3.48,3.83,p.y));
  switch id {
    case 0u,6u: {
      let seams=abs(fract(uv*select(vec2f(0.48,0.67),vec2f(2.55,4.8),id==6u)+vec2f(0.41,0.18))-0.5);
      let grooves=1.0-smoothstep(0.006,0.018,min(seams.x,seams.y));
      let seep=noise(vec2f(uv.x*8.6,uv.y*0.68));
      let splash=select(1.0,mix(0.56,1.0,smoothstep(0.0,1.1,p.y-0.32*seep)),vertical);
      base*=splash*(0.83+0.24*grain+0.22*seep)*(1.0-0.18*grooves);
      rough=0.83;
    }
    case 1u,2u,16u: {
      let road=id==1u || (id==16u && p.y<0.035);
      if top && road {
        pool=puddle(p.xz);
        film=0.43+0.39*noise(p.xz*0.85);
      } else if id==2u && top {
        film=(0.52+0.29*cloud)*(1.0-0.88*underAwning);
        pool=film*0.31*smoothstep(0.58,0.75,noise(p.xz*0.58));
        let slab=fract(vec2f(p.x*1.35+0.5*floor(p.z*1.72),p.z*1.72));
        let gap=min(slab,1.0-slab);
        base*=mix(0.55,1.0,smoothstep(0.007,0.024,min(gap.x,gap.y)));
      }
      let aggregate=grain*0.55+mid*0.32+cloud*0.13;
      base*=mix(0.72+0.48*aggregate,0.61+0.21*mid,pool)*(1.0-0.26*film);
      if id==16u {base*=mix(0.35,0.86,smoothstep(0.22,0.58,aggregate));}
      rough=mix(0.88-0.36*film,0.117,pool);
      if film>0.0 && reflections {
        ripple=asphaltSlope(p.xz,pool);
        n=normalize(n+vec3f(ripple.x,0,ripple.y));
      }
    }
    case 3u,4u,5u,7u,13u: {
      let brushed=mix(noise(uv*vec2f(75.0,4.0)),0.5,smoothstep(0.008,0.034,width));
      rough=0.37+0.18*brushed;
      metal=0.72;
      base*=0.80+0.27*brushed+0.15*grain;
      if id==4u && onRoadCar {
        let coat=mix(0.52,grain,1.0-smoothstep(0.009,0.021,width));
        base=v.color*(0.95+0.09*mid+0.06*coat);
        rough=0.23+0.14*coat;
        metal=0.47;
      } else if id==4u {
        let flecks=smoothstep(0.70,0.83,0.66*grain+0.34*mid);
        base=mix(base,vec3f(0.25,0.28,0.29),flecks*0.65);
        metal=0.12+flecks*0.57;
      }
      if id==5u {rough=0.79;metal=0.0;}
      if id==7u {
        let pattern=fract(uv*vec2f(21,9));
        let groove=abs(pattern.x+pattern.y-1.0);
        base*=mix(0.35,1.10,smoothstep(0.025,0.125,groove));
        rough=0.42;
      }
      if id==13u {rough=0.22;metal=0.93;}
    }
    case 8u: {
      let pane=v.uv;
      let room=hash(v.color.rb*vec2f(13.3,27.6));
      let edgeDistance=min(min(pane.x,1.0-pane.x),min(pane.y,1.0-pane.y));
      let edge=smoothstep(0.006,0.10,edgeDistance);
      let fresnel=pow(1.0-clamp(dot(n,view),0.0,1.0),3.5);
      let exterior=sky(reflect(-view,n))*vec3f(0.57,0.76,0.94);
      let light=smoothstep(0.12,0.65,max(v.color.r,v.color.b));
      let slats=0.79+0.21*cos(pane.y*111.0)*(1.0-smoothstep(0.008,0.035,abs(dy.y)+abs(dx.y)));
      let curtain=select(1.0,mix(0.64,0.95,slats),pane.y<0.49+0.28*room);
      let side=select(pane.x,1.0-pane.x,room>0.50);
      let delta=pane-vec2f(0.29+0.45*room,0.31);
      let lamp=0.42+0.58*exp(-dot(delta,delta)*3.5);
      let sill=1.0-0.57*smoothstep(0.73,0.98,pane.y)*(1.0-smoothstep(0.20,0.35,side));
      emission=v.color*light*0.37*edge*lamp*curtain*sill+exterior*(0.28+1.33*fresnel);
      base=vec3f(0.033,0.047,0.058)+v.color*0.060;
      rough=0.20+0.08*grain;
      metal=0.24;
    }
    case 9u: {emission=v.color;rough=0.27;}
    case 11u: {
      let cells=fract(uv*vec2f(19,19))-0.5;
      let raised=1.0-smoothstep(0.17,0.28,length(cells));
      base*=0.80+0.20*raised+0.10*mid;
      rough=0.65;
    }
    case 12u: {rough=0.69;base*=0.81+0.31*grain;}
    case 14u: {
      let brush=mix(noise(uv*vec2f(5.9,115.0)),0.5,smoothstep(0.004,0.024,width));
      let streak=noise(vec2f(uv.x*23.0,uv.y*1.3));
      base=v.color*(0.81+0.16*brush+0.12*streak);
      rough=0.33+brush*0.11;
      metal=0.77;
    }
    case 15u: {
      let fresnel=pow(1.0-clamp(dot(n,view),0.0,1.0),3.6);
      let reflected=reflect(-view,n);
      let skyline=smoothstep(-0.13,0.33,reflected.y);
      let water=mix(noise(uv*vec2f(91.0,4.4)),0.5,smoothstep(0.004,0.016,width));
      base=v.color*0.26;
      rough=0.11+0.14*water;
      metal=0.31;
      let reflectedStreet=vec3f(0.013,0.024,0.037)*(0.76+0.24*water)*skyline;
      emission=(sky(reflected)*2.55+reflectedStreet)*(0.25+1.29*fresnel);
    }
    case 17u: {
      let viewOffset=vec2f(-dot(view,vec3f(n.z,0,-n.x)),view.y)*0.085;
      let interiorUV=clamp(v.uv+viewOffset,vec2f(0.004),vec2f(0.996));
      let interior=textureSampleGrad(signage,linearSampler,interiorUV,i32(CARRIAGE_LAYER),dx,dy).rgb;
      let border=smoothstep(0.0,0.08,min(min(v.uv.x,1.0-v.uv.x),min(v.uv.y,1.0-v.uv.y)));
      let streak=noise(vec2f(v.uv.x*91.0,v.uv.y*1.55));
      emission=interior*v.color*(0.50+0.12*streak)*border;
      base=vec3f(0.049,0.073,0.081);
      rough=0.19+0.09*streak;
      metal=0.21;
    }
    case 18u: {
      let go=fract((frame.eye.w+0.61)/12.0)<0.64;
      let green=v.color.g>v.color.r;
      let lens=1.0-smoothstep(0.33,0.53,length(v.uv-0.5));
      base*=0.17;
      emission=v.color*select(0.014,1.17,go==green)*lens;
      rough=0.25;
    }
    case 19u: {
      let rib=0.5+0.5*cos(p.y*118.0);
      let fade=1.0-smoothstep(0.011,0.045,width);
      base*=(0.81+0.17*mid)*mix(0.96,0.64+0.42*rib,fade);
      n=normalize(n+vec3f(0,sin(p.y*118.0)*0.18*fade,0));
      rough=0.54;
      metal=0.35;
    }
    case 20u,21u,22u: {
      let brick=id==20u;
      let tiles=id==21u;
      let size=select(select(vec2f(0.86,2.43),vec2f(4.3,4.3),tiles),vec2f(3.15,9.8),brick);
      let floorRow=floor(uv.y*size.y);
      let stagger=select(0.0,0.5*floorRow,brick);
      let panel=vec2f(uv.x*size.x+stagger,uv.y*size.y);
      let cell=fract(panel);
      let edge=min(cell,1.0-cell)/size;
      let lineWidth=select(0.009,0.005,brick);
      let joint=(1.0-smoothstep(lineWidth,lineWidth+0.004+width,min(edge.x,edge.y)))
        *(1.0-smoothstep(0.032,0.095,width));
      let variation=hash(floor(panel)+vec2f(3.9,8.2));
      let panelTone=mix(0.82,1.10,variation);
      let trickle=noise(vec2f(uv.x*13.0,uv.y*0.48));
      base*=panelTone*(0.78+0.17*trickle+0.13*grain)*(1.0-joint*select(select(0.36,0.23,tiles),0.32,brick));
      rough=select(select(0.43,0.28,tiles),0.74,brick)+grain*0.10;
      metal=select(0.03,0.44,id==22u);
    }
    case 23u: {
      let facing=clamp(dot(n,view),0.0,1.0);
      let fresnel=pow(1.0-facing,3.1);
      let reflection=reflect(-view,n);
      let sheen=pow(max(0.0,1.0-abs(reflection.y-0.18)),8.0);
      let rain=noise(vec2f(uv.x*39.0,uv.y*0.94));
      let opening=smoothstep(0.025,0.12,min(v.uv.y,1.0-v.uv.y));
      let lights=0.028+0.11*smoothstep(0.49,0.86,v.color.b);
      emission=sky(reflection)*(0.81+1.63*fresnel)
        +vec3f(0.025,0.084,0.115)*sheen*(0.20+fresnel)
        +v.color*lights*opening*(0.82+0.18*rain);
      base=vec3f(0.026,0.071,0.094)+v.color*0.067;
      rough=0.16+0.09*rain;
      metal=0.41;
    }
    default: {
      if id>=SIGN_BASE {
        let decal=textureSampleGrad(signage,linearSampler,v.uv,i32(id-SIGN_BASE),dx,dy).rgb;
        let rim=min(min(v.uv.x,1.0-v.uv.x),min(v.uv.y,1.0-v.uv.y));
        let bleed=smoothstep(0.0,0.027,rim)*(0.92+0.12*mid);
        let shopWindow=id>=STOREFRONT_LAYER&&id<NEON_LAYER;
        base=decal*select(0.37,0.14,shopWindow);
        emission=decal*v.color*bleed*(0.70+0.35*cloud);
        if shopWindow {
          let glass=pow(1.0-clamp(dot(n,view),0.0,1.0),3.2);
          emission+=sky(reflect(-view,n))*(0.23+1.16*glass);
        }
        if id>=NEON_LAYER {
          let rows=1.0-0.21*(1.0-smoothstep(0.11,0.29,fract(v.uv.y*118.0)))*(1.0-smoothstep(0.002,0.008,width));
          let scan=0.91+0.09*sin(v.uv.y*9.2-frame.eye.w*1.1);
          emission*=rows*scan;
        }
        rough=0.39;
      }
    }
  }
  let facing=0.40+0.60*max(n.y,0.0);
  let inShop=p.x<-11.565 && p.x>-18.67 && p.z>8.56 && p.z<15.71 && p.y<3.40;
  let inNoodles=abs(p.x-NOODLE_X)<2.28&&p.z<NOODLE_GLASS_Z&&p.z>NOODLE_BACK_Z&&p.y<3.48;
  let ambient=(vec3f(0.065,0.079,0.112)*(1.0-0.46*underAwning)
    +select(vec3f(0),vec3f(0.18,0.133,0.085),inShop)
    +select(vec3f(0),vec3f(0.23,0.144,0.074),inNoodles))*facing;
  var lit=emission+base*ambient*(1.0-metal*0.53);
  lit+=mix(vec3f(0.011,0.016,0.025),base,metal)*(0.055+0.16*max(reflect(-view,n).y,0.0))*(1.0-rough*0.51);
  if onRoadCar && id==4u {
    let edge=pow(1.0-clamp(dot(n,view),0.0,1.0),3.0);
    lit+=sky(reflect(-view,n))*(0.15+0.52*edge)+base*0.034;
  }
  let distant=distance(p,eye);
  if distant<65.0 {
    for(var i=0u;i<LIGHT_COUNT;i++){
      let lamp=lights[i];
      let sample=lampSample(p,lamp);
      if sample.w>0.001 {
        let l=sample.xyz*inverseSqrt(max(dot(sample.xyz,sample.xyz),0.001));
        let strength=sample.w*noodleLampVisibility(i,p,p+sample.xyz);
        lit+=strength*lamp.color.xyz*surfaceLight(n,view,l,base,rough,metal);
      }
    }
    let trainLamp=trainSource(p);
    let movingLight=trainFalloff(p,trainLamp);
    if !onTrain && movingLight>0.00005 {
      let l=normalize(trainLamp.xyz-p);
      lit+=vec3f(1.0,0.75,0.49)*movingLight*43.0*surfaceLight(n,view,l,base,rough,metal);
    }
    if !onTrain && frame.train.w>0.001 && p.y>5.9 {
      for(var side=-1.0;side<=1.0;side+=2.0){
        let origin=railHeadlamp(side);
        let light=headlampFalloff(p,origin,railHeadlampAxis(side),TRAIN_BEAM.x,TRAIN_BEAM.y,TRAIN_BEAM.z)*railLampVisibility(origin);
        if light>0.0001 {
          lit+=vec3f(1.0,0.86,0.64)*light*83.0*surfaceLight(n,view,normalize(origin-p),base,rough,metal);
        }
      }
    }
    let roadLight=roadHeadlights(p);
    if roadLight.w>0.00008 {
      lit+=vec3f(0.81,0.90,1.0)*roadLight.w*82.0*surfaceLight(n,view,normalize(roadLight.xyz-p),base,rough,metal);
    }
  }
  if top && p.y<0.20 && abs(p.z)<4.5 {
    for(var i=0u;i<TRAFFIC_COUNT;i++){
      let car=frame.traffic[i];
      let delta=p.xz-car.pose.xy;
      let q=vec2f(dot(delta,car.pose.zw)/2.18,dot(delta,vec2f(-car.pose.w,car.pose.z))/0.88);
      lit*=1.0-0.47*(1.0-smoothstep(0.26,1.34,dot(q,q)))*car.surface.w;
    }
  }
  if reflections && film>0.0 && p.y<0.18 && frame.options.x>0.5 {
    let mirrorUV=project(frame.floorMirror,p);
    let offset=ripple*vec2f(0.036,0.049)+vec2f(0,(1.0-pool)*0.0031*sin(uv.x*10.7));
    let reflected=textureSampleLevel(floorMirrorTex,linearSampler,mirrorUV+offset,0).rgb;
    let blurred=textureSampleLevel(floorMirrorTex,linearSampler,mirrorUV+offset+vec2f(0.0,0.009),0).rgb
      +textureSampleLevel(floorMirrorTex,linearSampler,mirrorUV+offset-vec2f(0.0,0.009),0).rgb;
    let blur=mix((reflected*2.0+blurred)*0.25,reflected,pool);
    let fresnel=0.055+0.945*pow(1.0-clamp(dot(n,view),0.0,1.0),3.4);
    let reflectionAmount=mix(0.24*film,0.99,pool)*(0.34+0.66*fresnel)*screenEdge(mirrorUV);
    lit=lit*(1.0-reflectionAmount*0.82)+blur*reflectionAmount;
  }
  if top && p.y<0.22 {
    let dog=p.xz-frame.dog.xz;
    let handler=p.xz-frame.patrol.xz;
    let spot=exp(-dot(dog,dog)*9.0);
    let edge=exp(-dot(dog,dog)*3.4)-spot;
    lit*=1.0-0.46*exp(-dot(handler,handler)*11.0)-0.46*spot;
    lit+=vec3f(0.065,0.20,0.18)*edge*(0.035+0.092*pool);
  }
  if onTrain && p.z<TRACK_BACK_Z { discard; }
  if onRoadCar && p.z<ROAD_BACK_Z { discard; }
  return lit;
}
@fragment fn sceneFS(v: SceneVertex) -> @location(0) vec4f { return vec4f(shade(v,frame.eye.xyz,true),1); }
@fragment fn floorFS(v: SceneVertex) -> @location(0) vec4f {
  if v.world.y<0.172 && (v.material==1u||v.material==2u||v.material==16u||v.material==11u) { discard; }
  if v.world.y<0.0 { discard; }
  let eye=vec3f(frame.eye.x,0.02-frame.eye.y,frame.eye.z);
  return vec4f(shade(v,eye,false),1);
}
@fragment fn shopFS(v: SceneVertex) -> @location(0) vec4f {
  if v.world.x<SHOP_GLASS_X+0.006 { discard; }
  let eye=vec3f(2.0*SHOP_GLASS_X-frame.eye.x,frame.eye.yz);
  return vec4f(shade(v,eye,false),1);
}
@fragment fn glassFS(v: SceneVertex) -> @location(0) vec4f {
  let p=v.world;
  let view=normalize(frame.eye.xyz-p);
  let viewFacing=clamp(dot(v.normal,view),0.0,1.0);
  let noodlePane=abs(p.z-NOODLE_GLASS_Z)<0.02&&abs(p.x-NOODLE_X)<2.2;
  let fresnel=select(0.070,0.040,noodlePane)+select(0.88,0.72,noodlePane)*pow(1.0-viewFacing,4.4);
  let lane=floor(v.uv.x*32.0);
  let seed=hash(vec2f(lane,floor(p.z+p.x*3.1)));
  let track=fract(v.uv.x*32.0)-seed;
  let phase=fract(v.uv.y*3.4-frame.eye.w*(0.12+seed*0.21)+seed*8.72);
  let streak=(1.0-smoothstep(0.013,0.074,abs(track)))*smoothstep(0.49,0.94,phase);
  let beads=1.0-smoothstep(0.032,0.092,length(vec2f(track,(phase-0.95)*2.8)));
  let rain=streak*0.62+beads*0.63;
  let fogging=(1.0-smoothstep(0.01,0.23,min(v.uv.y,1.0-v.uv.y)))*select(0.08,0.042,noodlePane);
  let opacity=clamp(fresnel+rain*0.11+fogging,0.0,0.96);
  var reflected=vec3f(0.023,0.046,0.062);
  if noodlePane { reflected=sky(reflect(-view,v.normal))*2.14; }
  if v.normal.x>0.60 && frame.options.y>0.5 {
    let uv=project(frame.shopMirror,p);
    reflected=mix(reflected,textureSampleLevel(shopMirrorTex,linearSampler,uv+vec2f(rain*0.0027,0),0).rgb,screenEdge(uv));
  }
  let passing=trainSource(p+vec3f(0.49*(p.z-9.0),0,0));
  let d=passing.xyz-p;
  let train=passing.w*exp(-dot(d,d)/264.0);
  let drops=rain*(vec3f(0.035,0.063,0.058)+vec3f(0.16,0.09,0.035)*train);
  return vec4f(reflected*opacity+drops+vec3f(0.035,0.018,0.008)*train*fresnel,opacity);
}

struct Screen { @builtin(position) position: vec4f, @location(0) uv: vec2f }
@vertex fn fullscreen(@builtin(vertex_index) i: u32) -> Screen {
  let uv=vec2f(f32((i<<1u)&2u),f32(i&2u));
  return Screen(vec4f(uv*vec2f(2.0,-2.0)+vec2f(-1.0,1.0),0,1),uv);
}
fn viewDepth(uv: vec2f) -> f32 {
  let size=vec2i(textureDimensions(sceneDepth));
  let xy=clamp(vec2i(uv*vec2f(size)),vec2i(0),size-1);
  let depth=textureLoad(sceneDepth,xy,0);
  return NEAR*FAR/max(FAR-depth*(FAR-NEAR),0.001);
}
fn steamDensity(p: vec3f,source: vec3f,time: f32) -> f32 {
  let height=p.y-source.y;
  let plume=source.xz+vec2f(0.37*height+sin(height*2.7+time*1.13)*height*0.10,0.09*height+sin(time*0.78-height*1.4)*height*0.08);
  let radius=0.145+height*0.31;
  let radial=length((p.xz-plume)/max(radius,0.16));
  if radial>=1.72 {return 0.0;}
  let q=p*vec3f(2.1,1.87,2.2)-vec3f(time*0.37,time*1.11,time*0.08);
  let turb=noise3(q)*0.69+noise3(q*2.15)*0.31;
  let profile=smoothstep(0.025,0.35,height)*(1.0-smoothstep(2.0,4.50,height));
  return exp(-radial*radial*1.44)*profile*smoothstep(0.31,0.91,turb)*1.31;
}
fn rayBox(origin: vec3f,inv: vec3f,lo: vec3f,hi: vec3f,limit: f32) -> vec2f {
  let a=(lo-origin)*inv;
  let b=(hi-origin)*inv;
  let start=min(a,b);
  let end=max(a,b);
  return vec2f(max(0.0,max(start.x,max(start.y,start.z))),min(limit,min(end.x,min(end.y,end.z))));
}
fn headlampVolume(eye: vec3f,ray: vec3f,inv: vec3f,limit: f32,origin: vec3f,axis: vec3f,beam: vec3f,seed: f32,samples: u32) -> f32 {
  let end=origin+axis*beam.x;
  let bound=vec3f(beam.y+beam.x*beam.z);
  let box=rayBox(eye,inv,min(origin,end)-bound,max(origin,end)+bound,limit);
  if box.y<=box.x { return 0.0; }
  // Intersect the expanding cone before integrating the lit rain along the view ray.
  let delta=eye-origin;
  let height=dot(delta,axis);
  let slope=dot(ray,axis);
  let perpendicular=delta-height*axis;
  let lateral=ray-slope*axis;
  let width=beam.y+height*beam.z;
  let taper=slope*beam.z;
  let a=dot(lateral,lateral)-taper*taper;
  let b=dot(perpendicular,lateral)-width*taper;
  let c=dot(perpendicular,perpendicular)-width*width;
  let discriminant=b*b-a*c;
  var lo=box.x;
  var hi=box.y;
  if abs(slope)>0.00001 {
    let start=-height/slope;
    let finish=(beam.x-height)/slope;
    lo=max(lo,min(start,finish));
    hi=min(hi,max(start,finish));
  } else if height<0.0 || height>beam.x { return 0.0; }
  if a>0.00001 {
    if discriminant<=0.0 { return 0.0; }
    let root=sqrt(discriminant);
    lo=max(lo,(-b-root)/a);
    hi=min(hi,(-b+root)/a);
  }
  if hi<=lo { return 0.0; }
  let stepSize=(hi-lo)/f32(samples);
  let scatter=0.27+0.74*pow(max(0.0,dot(-ray,axis)),3.2);
  var light=0.0;
  for(var i=0u;i<samples;i++){
    let distance=lo+(f32(i)+seed)*stepSize;
    let p=eye+ray*distance;
    let strength=headlampFalloff(p,origin,axis,beam.x,beam.y,beam.z);
    if strength>0.0 {
      let mist=0.72+0.28*noise3(p*vec3f(1.27,1.84,1.17)-vec3f(frame.eye.w*0.29,0,0));
      light+=strength*mist*exp(-distance*0.012);
    }
  }
  return light*stepSize*scatter;
}
fn steam(origin: vec3f,ray: vec3f,limit: f32,source: vec3f,seed: f32) -> vec4f {
  let inv=select(vec3f(-1),vec3f(1),ray>=vec3f(0))/max(abs(ray),vec3f(0.0001));
  let span=rayBox(origin,inv,source-vec3f(2.7,0,2.7),source+vec3f(4.7,4.58,3.2),limit);
  if span.y<=span.x {return vec4f(0);}
  var accum=vec3f(0);
  var trans=1.0;
  let stepSize=(span.y-span.x)/16.0;
  for(var i=0u;i<16u;i++){
    let p=origin+ray*(span.x+(f32(i)+seed)*stepSize);
    let density=steamDensity(p,source,frame.eye.w);
    if density>0.001 {
      var light=vec3f(0.012,0.017,0.028);
      for(var j=0u;j<LIGHT_COUNT;j++){
        let lamp=lights[j];
        let sample=lampSample(p,lamp);
        if sample.w>0.002 {
          let l=sample.xyz*inverseSqrt(max(dot(sample.xyz,sample.xyz),0.001));
          let phase=0.23+0.65*pow(max(dot(ray,l),0.0),4.0);
          light+=lamp.color.xyz*sample.w*phase*noodleLampVisibility(j,p,p+sample.xyz);
        }
      }
      let moving=trainSource(p);
      let phase=0.40+0.60*pow(max(dot(ray,normalize(moving.xyz-p)),0.0),3.0);
      light+=vec3f(1.0,0.70,0.44)*trainFalloff(p,moving)*80.0*phase;
      light+=vec3f(0.73,0.85,1.0)*roadHeadlights(p).w*31.0;
      let opacity=1.0-exp(-density*stepSize);
      accum+=trans*opacity*light;
      trans*=1.0-opacity;
      if trans<0.018 {break;}
    }
  }
  return vec4f(accum,1.0-trans);
}
@fragment fn volumeFS(v: Screen) -> @location(0) vec4f {
  let ray=cameraRay(v.uv);
  let limit=viewDepth(v.uv)/max(dot(ray,frame.forward.xyz),0.08);
  let seed=0.22+0.56*hash(v.position.xy);
  let a=steam(frame.eye.xyz,ray,limit,vec3f(2.57,0.015,-2.54),seed);
  let b=steam(frame.eye.xyz,ray,limit,vec3f(-14.4,0.16,-9.42),seed);
  let mistAlpha=a.a+b.a*(1.0-a.a);
  let inv=select(vec3f(-1),vec3f(1),ray>=vec3f(0))/max(abs(ray),vec3f(0.0001));
  var trainBeams=0.0;
  if frame.train.w>0.001 {
    for(var side=-1.0;side<=1.0;side+=2.0){
      let origin=railHeadlamp(side);
      let power=railLampVisibility(origin);
      if power>0.001 { trainBeams+=headlampVolume(frame.eye.xyz,ray,inv,limit,origin,railHeadlampAxis(side),TRAIN_BEAM,seed,12u)*power; }
    }
  }
  var roadBeams=0.0;
  if min(frame.eye.y,frame.eye.y+ray.y*limit)<2.5 {
    for(var i=0u;i<TRAFFIC_COUNT;i++){
      let vehicle=frame.traffic[i];
      if vehicle.surface.w<=0.001 { continue; }
      for(var side=-1.0;side<=1.0;side+=2.0){
        let origin=roadHeadlamp(vehicle,side);
        roadBeams+=headlampVolume(frame.eye.xyz,ray,inv,limit,origin,roadHeadlampAxis(vehicle,side),ROAD_BEAM,seed,5u)*vehicle.surface.w;
      }
    }
  }
  let beams=vec3f(1.0,0.86,0.67)*trainBeams*3.3+vec3f(0.81,0.90,1.0)*roadBeams*1.13;
  return vec4f(a.rgb+b.rgb*(1.0-a.a)+beams*(1.0-mistAlpha*0.7),mistAlpha);
}
fn brightAt(uv: vec2f) -> vec3f {
  let scene=textureSampleLevel(sceneTex,linearSampler,uv,0).rgb;
  let mist=textureSampleLevel(fogTex,linearSampler,uv,0);
  let color=scene*(1.0-mist.a)+mist.rgb;
  let peak=max(color.r,max(color.g,color.b));
  return color*smoothstep(0.36,1.40,peak);
}
@fragment fn bloomFS(v: Screen) -> @location(0) vec4f {
  let uv=v.uv;
  let step=4.6/vec2f(textureDimensions(sceneTex));
  let dx=vec2f(step.x,0);
  let dy=vec2f(0,step.y);
  let center=brightAt(uv)*0.25;
  let close=(brightAt(uv+dx)+brightAt(uv-dx)+brightAt(uv+dy)+brightAt(uv-dy))*0.115;
  let corner=(brightAt(uv+dx+dy)+brightAt(uv+dx-dy)+brightAt(uv-dx+dy)+brightAt(uv-dx-dy))*0.047;
  let far=(brightAt(uv+dx*2.4)+brightAt(uv-dx*2.4)+brightAt(uv+dy*2.4)+brightAt(uv-dy*2.4))*0.0255;
  return vec4f(center+close+corner+far,1.0);
}
@fragment fn displayFS(v: Screen) -> @location(0) vec4f {
  let uv=v.uv;
  let ray=cameraRay(uv);
  let rgb=textureLoad(sceneTex,vec2i(v.position.xy),0);
  let depth=viewDepth(uv);
  let dist=min(100.0,depth/max(dot(ray,frame.forward.xyz),0.08));
  let haze=1.0-exp(-dist*0.019);
  let mist=textureSampleLevel(fogTex,linearSampler,uv,0);
  let air=sky(ray)*vec3f(0.89,0.93,1.02);
  var color=mix(rgb.rgb,air,haze*0.82);
  if depth>FAR-0.22 {color=air;}
  color=color*(1.0-mist.a)+mist.rgb;
  color+=textureSampleLevel(glowTex,linearSampler,uv,0).rgb*0.27;
  color*=1.0-0.23*pow(length((uv-0.5)*vec2f(1.36,1.1)),1.5);
  let exposed=color*1.21;
  let mapped=clamp((exposed*(2.51*exposed+0.03))/(exposed*(2.43*exposed+0.59)+0.14),vec3f(0),vec3f(1));
  let grain=(hash(v.position.xy+fract(frame.eye.w)*51.1)-0.5)*0.010;
  return vec4f(pow(mapped,vec3f(1.0/2.2))+grain,1);
}

struct Drop { position: vec4f, motion: vec4f }
@group(3) @binding(0) var<storage,read_write> drops: array<Drop>;
@group(3) @binding(1) var<storage,read> falling: array<Drop>;
fn under(p: vec2f,low: vec2f,high: vec2f) -> bool {
  return all(p>=low)&&all(p<=high);
}
fn rainGround(p: vec2f) -> f32 {
  if under(p,RAIN_ROOFS[0].xy,RAIN_ROOFS[0].zw) {return RAIN_ROOF_Y.x;}
  if under(p,RAIN_ROOFS[1].xy,RAIN_ROOFS[1].zw) {return RAIN_ROOF_Y.y;}
  if p.y>=TRACK_BACK_Z && abs(trackOffset(p))<2.26 {return 6.54;}
  if under(p,vec2f(STAIR_START,STAIR_NEAR),vec2f(STAIR_END,STAIR_FAR)) {
    return mix(0.16,7.1,(p.x-STAIR_START)/(STAIR_END-STAIR_START));
  }
  for(var i=0u;i<TRAFFIC_COUNT;i++){
    let car=frame.traffic[i];
    let delta=p-car.pose.xy;
    let along=dot(delta,car.pose.zw);
    let across=dot(delta,vec2f(-car.pose.w,car.pose.z));
    if car.surface.w>0.5 && abs(across)<0.80 && abs(along)<2.16 {
      let roof=0.75+car.surface.z*(1.0-smoothstep(0.63,1.53,abs(along+0.36)));
      return car.surface.x+car.surface.y*along+roof;
    }
  }
  return select(0.008,0.144,abs(p.y)>8.10);
}
fn sheltered(p: vec3f) -> bool {
  return (p.y<RAIN_ROOF_Y.x && under(p.xz,RAIN_ROOFS[0].xy,RAIN_ROOFS[0].zw))
    || (p.y<RAIN_ROOF_Y.y && under(p.xz,RAIN_ROOFS[1].xy,RAIN_ROOFS[1].zw))
    || (p.y<6.54 && p.z>=TRACK_BACK_Z && abs(trackOffset(p.xz))<2.26);
}
fn spawnDrop(id: u32,tick: f32,first: bool) -> Drop {
  let key=vec2f(f32(id)*0.01379,tick*0.79);
  let seed=hash(key+vec2f(4.32,2.18));
  let rand=vec2f(hash(key),hash(key+vec2f(3.79,-4.2)));
  let runoff=id>=RAIN_COUNT-RUNOFF_COUNT;
  var p=frame.eye.xz+(rand-0.5)*vec2f(44,39);
  var velocity=6.8+seed*8.2;
  var height=rainGround(p)+select(13.5,rand.y*14.0,first);
  if runoff {
    let spout=floor(rand.x*4.0);
    let x=-12.77+spout*3.04+(hash(key-2.8)-0.5)*0.18;
    p=vec2f(x,8.115+0.038*(rand.y-0.5));
    velocity=5.1+seed*2.1;
    height=select(3.46,0.18+rand.y*3.28,first);
  }
  return Drop(vec4f(p.x,height,p.y,seed),vec4f(velocity,-1.0,select(0.0,1.0,runoff),1.0));
}
@compute @workgroup_size(128) fn rainCS(@builtin(global_invocation_id) gid: vec3u) {
  let id=gid.x;
  if id>=RAIN_COUNT {return;}
  var drop=drops[id];
  let time=frame.eye.w;
  let dt=frame.options.z;
  if drop.motion.w==0.0 {
    drops[id]=spawnDrop(id,0.0,true);
    return;
  }
  if dt<=0.0 {return;}
  let runoff=drop.motion.z>0.5;
  if drop.motion.y>=0.0 {
    drop.motion.y+=dt;
    if drop.motion.y>0.21 || (drop.motion.y<0.02 && !runoff && sheltered(drop.position.xyz)) {
      drop=spawnDrop(id,time,false);
    }
  } else {
    let sway=sin(time*0.79+drop.position.w*5.3);
    let wind=vec2f(1.03+sway*0.48,0.32);
    drop.position.x+=select(wind.x,0.0,runoff)*dt;
    drop.position.z+=select(wind.y,0.0,runoff)*dt;
    drop.position.y-=drop.motion.x*dt;
    let ground=rainGround(drop.position.xz);
    if drop.position.y<ground {
      drop.position.y=ground+0.0045;
      drop.motion.y=0.0;
    }
    let distanceFromPlayer=abs(drop.position.xz-frame.eye.xz);
    if !runoff && any(distanceFromPlayer>vec2f(25,23)) {drop=spawnDrop(id,time,false);}
  }
  drops[id]=drop;
}
struct RainVertex {
  @builtin(position) position: vec4f, @location(0) uv: vec2f,
  @location(1) color: vec3f, @location(2) fade: f32,
  @location(3) @interpolate(flat) splash: u32,
}
fn precipitationLight(p: vec3f, toCamera: vec3f, dist: f32) -> vec3f {
  var tint=vec3f(0.036,0.058,0.085);
  for(var i=0u;i<LIGHT_COUNT;i++){
    let lamp=lights[i];
    let sample=lampSample(p,lamp);
    if sample.w>0.002 {
      let toward=dot(sample.xyz,-toCamera)/max(length(sample.xyz)*dist,0.001);
      let forward=0.25+0.53*pow(max(0.0,toward),3.0);
      tint+=lamp.color.xyz*sample.w*forward*noodleLampVisibility(i,p,p+sample.xyz);
    }
  }
  return tint;
}
fn tireSprayVertex(corner: vec2f, instance: u32) -> RainVertex {
  let tire=instance/SPRAY_PARTICLES;
  let slot=instance%SPRAY_PARTICLES;
  let car=frame.traffic[tire/4u];
  let along=car.pose.zw;
  let across=vec2f(-along.y,along.x);
  let side=select(-1.0,1.0,tire%2u==1u);
  let axle=select(ROAD_AXLES.x,ROAD_AXLES.y,tire%4u>=2u);
  let contact=car.pose.xy+along*axle+across*side*0.79;
  let mist=slot>=SPRAY_DROPLETS;
  let key=vec2f(f32(instance)*0.744+0.29,13.1);
  let r=hash(key);
  let duration=select(mix(0.13,0.235,r),mix(0.27,0.41,r),mist);
  let cycle=frame.eye.w/duration+hash(key+3.5);
  let age=fract(cycle);
  let time=age*duration;
  let variation=hash(key+floor(cycle)*vec2f(2.71,5.22));
  let birth=contact-along*car.wheels.z*time;
  let water=smoothstep(0.19,0.72,puddle(birth));
  let speed=smoothstep(2.0,8.0,car.wheels.z);
  let inStreet=abs(birth.x)<ROAD_SPRAY_X && abs(birth.y)<5.5;
  if !inStreet || water*speed*car.surface.w<0.012 {
    return RainVertex(vec4f(2,2,2,1),corner,vec3f(0),0.0,2u);
  }
  let momentum=select(mix(0.52,0.83,r),mix(0.31,0.52,r),mist);
  let spray=across*side*mix(0.69,1.99,variation)+along*car.wheels.z*momentum;
  let position=birth+spray*time;
  let floor=car.surface.x+axle*car.surface.y;
  let lift=select(max(0.0,mix(0.84,1.72,variation)*time-4.9*time*time),0.045+time*0.33,mist);
  let origin=vec3f(position.x,floor+0.019+lift,position.y);
  let toCamera=frame.eye.xyz-origin;
  let dist=length(toCamera);
  let nearby=1.0-smoothstep(18.0,33.0,dist);
  let lensDistance=length(origin-roadHeadlamp(car,side));
  let lensSpill=0.64*(1.0-smoothstep(0.74,1.82,lensDistance))*car.surface.w;
  let headlight=roadHeadlights(origin).w*26.0+lensSpill;
  let color=precipitationLight(origin,toCamera,dist)*select(0.82,0.69,mist)
    +vec3f(0.72,0.86,1.0)*headlight;
  let fade=nearby*water*speed*car.surface.w*(1.0-smoothstep(0.50,1.0,age));
  let uv=vec2f(corner.x,corner.y*2.0-1.0);
  let radius=select(0.024+0.016*r,mix(0.09,0.28,age),mist);
  let width=select(radius*0.28,radius*1.46,mist);
  let height=select(radius,radius*0.53,mist);
  let p=origin+frame.right.xyz*uv.x*width+frame.up.xyz*uv.y*height;
  let alpha=fade*select(0.78,0.22,mist)*mix(0.70,1.0,variation);
  return RainVertex(frame.view*vec4f(p,1),uv,color,alpha,select(2u,3u,mist));
}
@vertex fn rainVS(@builtin(vertex_index) vert: u32,@builtin(instance_index) instance: u32) -> RainVertex {
  let corners=array<vec2f,6>(vec2f(-1,0),vec2f(1,0),vec2f(1,1),vec2f(-1,0),vec2f(1,1),vec2f(-1,1));
  let corner=corners[vert];
  if instance>=RAIN_COUNT { return tireSprayVertex(corner,instance-RAIN_COUNT); }
  let drop=falling[instance];
  let origin=drop.position.xyz;
  let seed=drop.position.w;
  let toCamera=frame.eye.xyz-origin;
  let dist=length(toCamera);
  let runoff=drop.motion.z>0.5;
  let hit=drop.motion.y>=0.0;
  var p=origin;
  var fade=smoothstep(0.27,0.91,dist)*(1.0-smoothstep(25.0,43.0,dist));
  var tint=precipitationLight(origin,toCamera,dist);
  if hit {
    let age=clamp(drop.motion.y/0.21,0.0,1.0);
    let radius=(0.021+age*(0.075+0.034*seed))*select(1.0,1.30,runoff);
    p+=vec3f(corner.x*radius,0.004,(corner.y*2.0-1.0)*radius);
    fade*=0.30*pow(1.0-age,1.4);
  } else {
    let axis=vec3f(select(-0.074,0.0,runoff),1.0,select(-0.022,0.0,runoff));
    let across=normalize(cross(toCamera,axis)+vec3f(0.0001,0,0));
    let width=select(0.0038+seed*0.0049,0.0032+seed*0.0037,runoff);
    let length=select(0.12+0.21*seed,0.16+0.23*seed,runoff);
    p+=across*corner.x*width+axis*corner.y*length;
    fade*=select(0.45,0.52,runoff)*(0.46+0.54*seed);
  }
  let moving=trainSource(origin);
  tint+=vec3f(1.0,0.74,0.49)*trainFalloff(origin,moving)*61.0;
  if frame.train.w>0.001 && origin.y>5.9 {
    for(var side=-1.0;side<=1.0;side+=2.0){
      let lamp=railHeadlamp(side);
      tint+=vec3f(1.0,0.86,0.64)*headlampFalloff(origin,lamp,railHeadlampAxis(side),TRAIN_BEAM.x,TRAIN_BEAM.y,TRAIN_BEAM.z)
        *railLampVisibility(lamp)*31.0;
    }
  }
  tint+=vec3f(0.72,0.86,1.0)*roadHeadlights(origin).w*19.0;
  return RainVertex(frame.view*vec4f(p,1),corner,tint,fade,select(0u,1u,hit));
}
@fragment fn rainFS(v: RainVertex) -> @location(0) vec4f {
  var shape=pow(max(0.0,1.0-abs(v.uv.x)),1.25)
    *smoothstep(0.0,0.13,v.uv.y)*(1.0-smoothstep(0.46,1.0,v.uv.y));
  if v.splash==1u {
    let r=length(vec2f(v.uv.x,v.uv.y*2.0-1.0));
    shape=smoothstep(0.58,0.81,r)*(1.0-smoothstep(0.83,1.0,r));
  } else if v.splash>=2u {
    let r2=dot(v.uv,v.uv);
    shape=(1.0-smoothstep(0.39,1.0,r2))*exp(-r2*select(1.1,2.45,v.splash==3u));
  }
  let alpha=clamp(shape*v.fade,0.0,1.0);
  return vec4f(v.color*alpha,alpha);
}

<script type="module">
const el=id=>document.getElementById(id);
const canvas=el("view");
const TAU=2*Math.PI;
const add=(a,b)=>a.map((v,i)=>v+b[i]);
const sub=(a,b)=>a.map((v,i)=>v-b[i]);
const mul=(a,k)=>a.map(v=>v*k);
const dot=(a,b)=>a.reduce((sum,v,i)=>sum+v*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit=a=>mul(a,1/Math.max(1e-8,Math.hypot(...a)));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{const x=clamp(t,0,1);return x*x*(3-2*x);};
function seededRandom(seed){
  return ()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
}
function matrixProduct(a,b){

  const canTime=adapter.features.has("timestamp-query");
  device=await adapter.requestDevice({requiredFeatures:canTime?["timestamp-query"]:[]});
  context=canvas.getContext("webgpu");
  format=navigator.gpu.getPreferredCanvasFormat();
  context.configure({device,format,alphaMode:"opaque"});
  device.addEventListener("uncapturederror",e=>fail(e.error));
  device.lost.then(info=>fail(Error("WebGPU 设备连接中断。"+(info.message?" "+info.message:""))));
  const shader=device.createShaderModule({label:"Dongxi street shaders",code:[
    "const LIGHT_COUNT = "+lamps.length+"u;",
    "const RAIN_COUNT = "+rainCount+"u;",
    "const RUNOFF_COUNT = "+runoffCount+"u;",
    "const SPRAY_PARTICLES = "+sprayParticles+"u;",
    "const SPRAY_DROPLETS = "+sprayDroplets+"u;",
    "const ROAD_SPRAY_X = f32("+(road.straight+.45)+");",
    "const TRAFFIC_COUNT = "+traffic.length+"u;",
    "const TRAFFIC_MOTION = "+trafficMotion+"u;",
    "const DOG_MOTION = "+dogMotion+"u;",
    "const ROBOT_MOTION = "+robotMotion+"u;",
    "const ROBOT_SCALE = f32("+patrolRobot.scale+");",
    "const ROBOT_JOINT_COUNT = "+maleWalk.joints.length+"u;",
    "const LEASH_MOTION = "+leashMotion+"u;",
    "const LEASH_POINT_COUNT = "+leashPoints+"u;",
    "const WIPER_PIVOT = vec3f("+wiperPivot.join(",")+");",
    "const ROAD_LAMP = vec3f("+roadCar.lamp.join(",")+");",
    "const ROAD_BEAM = vec3f("+roadCar.beam.join(",")+");",
    "const ROAD_AXLES = vec3f("+[roadCar.rearAxle,roadCar.frontAxle,roadCar.wheelRadius].join(",")+");",
    "const ROAD_BACK_Z = f32("+(road.backZ-.65)+");",
    "const NOODLE_X = f32("+noodleShop.x+");",
    "const NOODLE_GLASS_Z = f32("+noodleShop.front+");",
    "const NOODLE_BACK_Z = f32("+(noodleShop.back-.12)+");",
    "const NOODLE_FIRST_LIGHT = "+noodleFirstLight+"u;",
    "const CARRIAGE_LAYER = "+signs.carriage+"u;",
    "const SIGN_BASE = "+mat.sign+"u;",
    "const STOREFRONT_LAYER = "+(mat.sign+signs.shopCafe)+"u;",
    "const NEON_LAYER = "+(mat.sign+neonLayer)+"u;",
    "const NEAR = f32("+near+");",
    "const FAR = f32("+far+");",
    "const TRACK_Z = f32("+track.z+");",
    "const TRACK_BACK_Z = f32("+(track.portalZ-tunnelLength)+");",
    "const TRACK_PORTAL_Z = f32("+track.portalZ+");",
    "const TRAIN_LAMP = vec3f("+[trainHeadlamp.x,trainHeadlamp.y,trainHeadlamp.halfGap].join(",")+");",
    "const TRAIN_BEAM = vec3f("+[trainHeadlamp.range,trainHeadlamp.radius,trainHeadlamp.spread].join(",")+");",
    "const TRACK_STRAIGHT = f32("+track.straight+");",
    "const TRACK_RADIUS = f32("+track.radius+");",
    "const SHOP_GLASS_X = f32("+shopGlass+");",
    "const STAIR_START = f32("+stair.x0+");",
    "const STAIR_END = f32("+stair.x1+");",
    "const STAIR_NEAR = f32("+stair.z0+");",
    "const STAIR_FAR = f32("+stair.z1+");",
    "const RAIN_ROOFS = array("+cover.map(r=>"vec4f("+[r.x0,r.z0,r.x1,r.z1].join(",")+")").join(",")+");",
    "const RAIN_ROOF_Y = vec2f("+cover.map(r=>r.top).join(",")+");",
    el("shaders").textContent,
  ].join("\n")});
  const compilation=await shader.getCompilationInfo();
  const errors=compilation.messages.filter(m=>m.type==="error");
  if(errors.length)throw Error(errors.map(m=>m.lineNum+":"+m.linePos+" "+m.message).join("\n"));
  const V=GPUShaderStage.VERTEX,F=GPUShaderStage.FRAGMENT,C=GPUShaderStage.COMPUTE;
  const layout=(label,entries)=>device.createBindGroupLayout({label,entries});
  const uniform=(binding,visibility)=>({binding,visibility,buffer:{type:"uniform"}});
  const sampled=(binding,sampleType="float",viewDimension="2d")=>({binding,visibility:F,texture:{sampleType,viewDimension}});
  const empty=layout("Unused group",[]);
  const emptyGroup=bind("Unused group",empty,[]);
  const frameLayout=layout("Camera and motion",[uniform(0,V|F|C)]);
  const matLayout=layout("Static materials and lights",[
    sampled(0,"float","2d-array"),{binding:1,visibility:F,sampler:{type:"filtering"}},uniform(2,V|F),
  ]);
  const mirrorLayout=layout("Reflection views",[sampled(0),sampled(1)]);
  const volumeLayout=layout("Opaque depth",[sampled(3,"depth")]);
  const bloomLayout=layout("Bloom source",[sampled(2),sampled(4)]);
  const postLayout=layout("Scene color and mist",[sampled(2),sampled(3,"depth"),sampled(4),sampled(5)]);
  const rainWrite=layout("Update rain",[{binding:0,visibility:C,buffer:{type:"storage"}}]);
  const rainRead=layout("Render rain",[{binding:1,visibility:V,buffer:{type:"read-only-storage"}}]);
  frameBuffer=device.createBuffer({label:"Frame parameters",size:frameValues.byteLength,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  frameGroup=bind("Frame parameters",frameLayout,[[0,{buffer:frameBuffer}]]);
  const lightData=new Float32Array(lamps.flatMap(lamp=>{
    const a=lamp.axis??[0,0,0,0];
    return [...lamp.p,lamp.range,...lamp.c,lamp.power,...unit(a.slice(0,3)),a[3]];
  }));
  const lightBuffer=gpuBuffer("Fixed street lights",GPUBufferUsage.UNIFORM,lightData);
  const sampler=device.createSampler({minFilter:"linear",magFilter:"linear",mipmapFilter:"linear",maxAnisotropy:4});
  materials=bind("Street light and sign atlas",matLayout,[[0,uploadSigns()],[1,sampler],[2,{buffer:lightBuffer}]]);
  const dropBuffer=device.createBuffer({label:"Rain and impacts",size:rainCount*32,usage:GPUBufferUsage.STORAGE});
  const dropCompute=bind("Rain simulation output",rainWrite,[[0,{buffer:dropBuffer}]]);
  const dropRender=bind("Simulated rain instances",rainRead,[[1,{buffer:dropBuffer}]]);
  const dummy=texture("Unused reflection input",1,1,"rgba16float").createView();
  const dummyMirrors=bind("Unused reflection input",mirrorLayout,[[0,dummy],[1,dummy]]);
  const vertices=scene.solid.length/13, dynamic=scene.moving.length/13, paneCount=scene.glazing.length/13;
  const vertexBuffer=gpuBuffer("Procedural street blocks",GPUBufferUsage.VERTEX,scene.solid);
  const movers=gpuBuffer("Train, street traffic and sidewalk patrol",GPUBufferUsage.VERTEX,scene.moving);
  const panes=gpuBuffer("Shop windows",GPUBufferUsage.VERTEX,scene.glazing);
  const vertexLayout=[{arrayStride:52,attributes:[
    {shaderLocation:0,offset:0,format:"float32x3"},{shaderLocation:1,offset:12,format:"float32x3"},
    {shaderLocation:2,offset:24,format:"float32x2"},{shaderLocation:3,offset:32,format:"float32x3"},
    {shaderLocation:4,offset:44,format:"float32x2"},
  ]}];
  const hdr="rgba16float",depthFormat="depth32float";
  const depth={format:depthFormat,depthWriteEnabled:true,depthCompare:"less"};
  const pipelineLayout=(...bindGroupLayouts)=>device.createPipelineLayout({bindGroupLayouts});
  const geoLayout=pipelineLayout(frameLayout,matLayout,mirrorLayout);
  const render=(label,layout,vs,fs,target,options={})=>device.createRenderPipelineAsync({
    label,layout,vertex:{module:shader,entryPoint:vs,buffers:options.buffers??[]},
    fragment:{module:shader,entryPoint:fs,targets:[{format:target,...(options.blend?{blend:options.blend}:{})}]},
    primitive:{topology:"triangle-list"},...(options.depth?{depthStencil:options.depth}:{}),
  });
  const premultiplied={operation:"add",srcFactor:"one",dstFactor:"one-minus-src-alpha"};
  const [mainPipe,floorPipe,shopPipe,glassPipe,fogPipe,bloomPipe,displayPipe,rainPipe,computePipe]=await Promise.all([
    render("Lit street",geoLayout,"sceneVS","sceneFS",hdr,{buffers:vertexLayout,depth}),
    render("Puddle reflection",geoLayout,"floorVS","floorFS",hdr,{buffers:vertexLayout,depth}),
    render("Shop window reflection",geoLayout,"shopVS","shopFS",hdr,{buffers:vertexLayout,depth}),
    render("Glass over the shop interior",geoLayout,"sceneVS","glassFS",hdr,{buffers:vertexLayout,depth,
      blend:{color:premultiplied,alpha:premultiplied}}),
    render("Steam volume",pipelineLayout(frameLayout,matLayout,volumeLayout),"fullscreen","volumeFS",hdr),
    render("Neon bloom",pipelineLayout(frameLayout,matLayout,bloomLayout),"fullscreen","bloomFS",hdr),
    render("Night exposure",pipelineLayout(frameLayout,matLayout,postLayout),"fullscreen","displayFS",format),
    render("Rain and splashes",pipelineLayout(frameLayout,matLayout,empty,rainRead),"rainVS","rainFS",hdr,
      {depth:{...depth,depthWriteEnabled:false},blend:{color:premultiplied,alpha:premultiplied}}),
    device.createComputePipelineAsync({label:"Rain collision and spawning",layout:pipelineLayout(frameLayout,empty,empty,rainWrite),
      compute:{module:shader,entryPoint:"rainCS"}}),
  ]);
  function streetGeometry(pass,pipe,mirrors,buffer,count){
    pass.setPipeline(pipe);pass.setBindGroup(0,frameGroup);
    pass.setBindGroup(1,materials);pass.setBindGroup(2,mirrors);
    pass.setVertexBuffer(0,buffer);pass.draw(count);
  }
  function staticBundle(label,pipe,mirrors){
    const bundle=device.createRenderBundleEncoder({label,colorFormats:[hdr],depthStencilFormat:depthFormat});
    streetGeometry(bundle,pipe,mirrors,vertexBuffer,vertices);
    return bundle.finish({label});
  }
  const floorBundle=staticBundle("Static street reflected in water",floorPipe,dummyMirrors);
  const shopBundle=staticBundle("Static street reflected in glass",shopPipe,dummyMirrors);
  let timing=null;
  if(canTime){
    timing={
      query:device.createQuerySet({type:"timestamp",count:2}),
      resolve:device.createBuffer({size:16,usage:GPUBufferUsage.QUERY_RESOLVE|GPUBufferUsage.COPY_SRC}),
      read:device.createBuffer({size:16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),
      busy:false,
    };
  }
  function resize(){
    const scale=Math.min(devicePixelRatio,1.5,1920/Math.max(1,canvas.clientWidth),1440/Math.max(1,canvas.clientHeight));
    const width=Math.max(1,Math.floor(canvas.clientWidth*scale)),height=Math.max(1,Math.floor(canvas.clientHeight*scale));
    if(targets?.width===width&&targets.height===height)return;
    if(targets)for(const old of targets.textures)old.destroy();
    canvas.width=width;canvas.height=height;
    const textures=[];
    const at=(label,ratio,type)=>{
      const t=texture(label,Math.max(1,Math.round(width*ratio)),Math.max(1,Math.round(height*ratio)),type);
      textures.push(t);return t.createView();
    };
    const color=at("HDR street",1,hdr),streetDepth=at("Street depth",1,depthFormat);
    const floor=at("Puddle color",.53,hdr),floorDepth=at("Puddle depth",.53,depthFormat);
    const glass=at("Glass color",.47,hdr),glassDepth=at("Glass depth",.47,depthFormat);
    const fog=at("Steam color",.47,hdr), bloom=at("Neon bloom",.24,hdr);
    const mirrors=bind("Street reflections",mirrorLayout,[[0,floor],[1,glass]]);
    const street=staticBundle("Static street main view",mainPipe,mirrors);
    targets={width,height,textures,color,streetDepth,floor,floorDepth,glass,glassDepth,fog,bloom,mirrors,street,
      volume:bind("Steam occlusion",volumeLayout,[[3,streetDepth]]),
      bright:bind("Bright surfaces and steam",bloomLayout,[[2,color],[4,fog]]),
      post:bind("Composite input",postLayout,[[2,color],[3,streetDepth],[4,fog],[5,bloom]])};
  }
  function draw(hasFloor,hasGlass,sample){
    const encoder=device.createCommandEncoder({label:"Rainy street frame"});
    const timed=timing&&sample&&!timing.busy;
    const simulation=encoder.beginComputePass({label:"Update rain",
      ...(timed?{timestampWrites:{querySet:timing.query,beginningOfPassWriteIndex:0}}:{})});
    simulation.setPipeline(computePipe);
    simulation.setBindGroup(0,frameGroup);simulation.setBindGroup(1,emptyGroup);
    simulation.setBindGroup(2,emptyGroup);simulation.setBindGroup(3,dropCompute);
    simulation.dispatchWorkgroups(Math.ceil(rainCount/128));simulation.end();
    const startPass=(label,color,clearValue,depthView,timestampWrites)=>encoder.beginRenderPass({
      label,colorAttachments:[{view:color,clearValue,loadOp:"clear",storeOp:"store"}],
      ...(depthView?{depthStencilAttachment:{view:depthView,depthClearValue:1,depthLoadOp:"clear",depthStoreOp:"store"}}:{}),
      ...(timestampWrites?{timestampWrites}:{}),
    });
    const skyColor=[.013,.021,.034,1];
    if(hasFloor){
      const reflection=startPass("Wet road reflection",targets.floor,skyColor,targets.floorDepth);
      reflection.executeBundles([floorBundle]);
      streetGeometry(reflection,floorPipe,dummyMirrors,movers,dynamic);reflection.end();
    }
    if(hasGlass){
      const reflection=startPass("Storefront reflection",targets.glass,skyColor,targets.glassDepth);
      reflection.executeBundles([shopBundle]);
      streetGeometry(reflection,shopPipe,dummyMirrors,movers,dynamic);reflection.end();
    }
    const main=startPass("Street and rain",targets.color,skyColor,targets.streetDepth);
    main.executeBundles([targets.street]);streetGeometry(main,mainPipe,targets.mirrors,movers,dynamic);
    streetGeometry(main,glassPipe,targets.mirrors,panes,paneCount);
    main.setPipeline(rainPipe);main.setBindGroup(0,frameGroup);main.setBindGroup(1,materials);
    main.setBindGroup(2,emptyGroup);main.setBindGroup(3,dropRender);
    main.draw(6,rainCount+traffic.length*4*sprayParticles);main.end();
    const fog=startPass("Steam under the railway",targets.fog,[0,0,0,0]);
    fog.setPipeline(fogPipe);fog.setBindGroup(0,frameGroup);fog.setBindGroup(1,materials);
    fog.setBindGroup(2,targets.volume);fog.draw(3);fog.end();
    const bloom=startPass("Neon bloom",targets.bloom,[0,0,0,0]);
    bloom.setPipeline(bloomPipe);bloom.setBindGroup(0,frameGroup);bloom.setBindGroup(1,materials);
    bloom.setBindGroup(2,targets.bright);bloom.draw(3);bloom.end();
    const display=startPass("Composite street and mist",context.getCurrentTexture().createView(),[0,0,0,1],null,
      timed?{querySet:timing.query,endOfPassWriteIndex:1}:null);
    display.setPipeline(displayPipe);display.setBindGroup(0,frameGroup);display.setBindGroup(1,materials);
    display.setBindGroup(2,targets.post);display.draw(3);display.end();
    if(timed){
      encoder.resolveQuerySet(timing.query,0,2,timing.resolve,0);
      encoder.copyBufferToBuffer(timing.resolve,0,timing.read,0,16);
    }
    device.queue.submit([encoder.finish()]);
    queued++;frameCount++;
    device.queue.onSubmittedWorkDone().catch(()=>{}).finally(()=>queued--);
    if(timed){
      timing.busy=true;
      timing.read.mapAsync(GPUMapMode.READ).then(()=>{
        const [a,b]=new BigUint64Array(timing.read.getMappedRange());
        if(b>=a)gpuMs=Number(b-a)/1e6;
        timing.read.unmap();
      }).catch(()=>{}).finally(()=>timing.busy=false);
    }
  }
  function loop(now){
    if(fatal)return;
    try{
      raf=requestAnimationFrame(loop);
      if(queued>=2)return;
      const dt=lastTime?Math.min(.05,(now-lastTime)/1000):0;
      if(lastTime&&now>lastTime)fps=mix(fps,1000/(now-lastTime),.085);
      lastTime=now;
      const train=trainAt(state.time+(state.mode==="pause"?0:dt));
      resize();tick(dt,train);
      const begin=performance.now(),[hasFloor,hasGlass]=packFrame(train);
      const sample=state.stats&&now-lastStats>420;
      draw(hasFloor,hasGlass,sample);
      if(sample){
        lastStats=now;
        el("stats").textContent=targets.width+" × "+targets.height+"   "+Math.round(fps)+" FPS\nGPU "
          +(gpuMs===null?"—":gpuMs.toFixed(2)+" ms")+"  /  编码 "+(performance.now()-begin).toFixed(2)+" ms\n"
          +"每帧 1 次提交  /  "+rainCount.toLocaleString()+" 雨滴\n静态场景 Render Bundle";
      }
    }catch(error){fail(error);}
  }
  ready=true;el("start").disabled=false;el("start").firstElementChild.textContent="走进雨夜";
  raf=requestAnimationFrame(loop);
}
setup().catch(fail);
</script>
</body>
</html>
