<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪线 · WebGPU 踏雪</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f4f3ed;background:#1b2c3b}
*{box-sizing:border-box}
body{margin:0;overflow:hidden}
[hidden]{display:none!important}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
header{position:absolute;top:clamp(20px,5vw,62px);left:clamp(20px,5vw,75px);pointer-events:none;text-shadow:0 2px 16px #162333a0}
header small{font:600 11px/1.3 Bahnschrift,"Barlow",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#ffe9c7}
header small::before{content:"";display:inline-block;width:22px;margin-right:10px;border-top:1px solid;vertical-align:middle}
h1{margin:7px 0 0;font-family:"Songti SC","SimSun",serif;font-size:clamp(42px,6.5vw,94px);letter-spacing:.12em;font-weight:600;line-height:1.15}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#101c2b5c,transparent 28%,transparent 77%,#0b152ac2),radial-gradient(ellipse at 52% 45%,transparent 56%,#15233340)}
footer{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:clamp(16px,4vw,61px);right:clamp(16px,4vw,61px);display:flex;justify-content:space-between;gap:14px;align-items:center;pointer-events:none}
.keys,.actions{display:flex;flex-wrap:wrap;gap:8px 15px;align-items:center}
.keys span{font-size:12px;color:#fff;text-shadow:0 1px 8px #152333}
kbd{display:inline-block;margin-right:5px;padding:3px 5px;border:1px solid #f1f4f553;border-radius:3px;background:#17253470;font:600 11px/1.2 Bahnschrift,monospace}
button{pointer-events:auto;touch-action:manipulation;border:1px solid #f5f1e26b;border-radius:4px;background:#192737a8;color:#fff7ea;padding:10px 13px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
button:hover,button[aria-pressed="true"]{background:#f1ddbb;color:#2b2720;border-color:#f1ddbb}
button:focus-visible{outline:2px solid #ffebc9;outline-offset:3px}
#message{position:absolute;left:50%;top:50%;width:min(86vw,490px);transform:translate(-50%,-50%);padding:20px 23px;border:1px solid #eae4d766;border-radius:5px;background:#182637eb;font-size:14px;line-height:1.65}
#touch{display:none;position:absolute;bottom:110px;left:20px;grid-template:repeat(2,41px)/repeat(3,41px);gap:4px;touch-action:none}
#touch button{touch-action:none;padding:0;font-size:17px}
#touch button:first-child{grid-column:2}
#touch button:nth-child(2){grid-column:1}
@media(pointer:coarse){#touch{display:grid}.keys{display:none}footer{justify-content:flex-end}}
@media(max-width:660px){footer{align-items:flex-end;gap:6px}.keys,.actions{gap:6px}.keys span{font-size:11px}.actions button{padding:9px}}
</style>
</head>
<body>
<canvas id="view" aria-label="可走动的冬季雪地"></canvas>
<div class="shade"></div>
<header><small>WebGPU</small><h1>雪线</h1></header>
<div id="message" role="status">正在准备雪地…</div>
<div id="touch" aria-label="移动" hidden>
<button data-key="KeyW" aria-label="前进">↑</button><button data-key="KeyA" aria-label="左移">←</button><button data-key="KeyS" aria-label="后退">↓</button><button data-key="KeyD" aria-label="右移">→</button>
</div>
<footer id="controls" hidden>
<div class="keys"><span><kbd>W A S D</kbd>移动</span><span><kbd>Shift</kbd>跑步</span><span>拖动鼠标转视角</span></div>
<div class="actions"><button id="walk" aria-pressed="false">自动走一段</button><button id="inspect" aria-pressed="false" title="快捷键 V">近看脚印</button><button id="slow" aria-pressed="false" hidden>慢动作</button><button id="reset" title="快捷键 R">清空脚印</button><button id="mute" aria-pressed="false" hidden>静音</button></div>
</footer>
<script type="module">
const canvas = document.querySelector("#view");
const message = document.querySelector("#message");
const controls = document.querySelector("#controls");
const touchControls = document.querySelector("#touch");
const walkButton = document.querySelector("#walk");
const inspectButton = document.querySelector("#inspect");
const slowButton = document.querySelector("#slow");
const muteButton = document.querySelector("#mute");
const gridSize = 3072;
const fieldMin = [-18, -28];
const fieldWidth = 36;
const texel = fieldWidth / gridSize;
const maxStamps = 32;
const shadowSize = 2048;
const sun = unit([-0.183, 0.248, -0.951]);
const homePitch = .108;
const cameraNear = .07, cameraFar = 285;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b-a)*t; }
function add(a, b) { return a.map((v, i) => v+b[i]); }
function sub(a, b) { return a.map((v, i) => v-b[i]); }
function scale(a, s) { return a.map(v => v*s); }
function dot(a, b) { return a.reduce((v, n, i) => v+n*b[i], 0); }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function unit(v) { return scale(v, 1/(Math.hypot(...v) || 1)); }
function mix3(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }
function smooth(t) { return t*t*(3-2*t); }
function ramp(a,b,x) { return smooth(clamp((x-a)/(b-a),0,1)); }
function forward(yaw) { return [Math.sin(yaw), 0, -Math.cos(yaw)]; }
function side(yaw) { return [Math.cos(yaw), 0, Math.sin(yaw)]; }
function yawTo(v) { return Math.atan2(v[0], -v[2]); }
function drift(x,z) {
  const bank=x-1.8*Math.sin(z*.20)-.66*Math.sin(z*.57+x*.13);
  return Math.sin(bank*.84+z*.23)*.32+Math.sin(x*.43-z*.63+Math.sin(z*.35))*.25
    +Math.cos(z*.40+x*.20)*.43;
}
function ground(x,z) {
  const valley=1.12*(1-Math.exp(-x*x*.0031));
  return valley+.26*Math.sin(x*.22+z*.13)+.18*Math.cos(z*.33-x*.11)+.23*drift(x,z)
    +.035*Math.sin(x*1.18-z*1.47+Math.sin(x*.65+z*.37));
}
function snowDepth(p,running) {
  return (running?.246:.221) * (.96+.29*drift(p[0],p[2]));
}
function rgb(hex) {
  return hex.match(/../g).map(v => (parseInt(v, 16)/255)**2.2);
}
function look(eye, target) {
  const z = unit(sub(eye, target));
  const x = unit(cross([0, 1, 0], z));
  const y = cross(z, x);
  return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1];
}
function mul(a, b) {
  return Array.from({length:16}, (_,i) => {
    const c = Math.floor(i/4)*4, r = i%4;
    return a[r]*b[c]+a[r+4]*b[c+1]+a[r+8]*b[c+2]+a[r+12]*b[c+3];
  });
}
function perspective(fov, aspect, n, f) {
  const s = 1/Math.tan(fov/2);
  return [s/aspect,0,0,0,0,s,0,0,0,0,f/(n-f),-1,0,0,n*f/(n-f),0];
}
function ortho(span, n, f) {
  return [1/span,0,0,0,0,1/span,0,0,0,0,1/(n-f),0,0,0,n/(n-f),1];
}

const shared = /* wgsl */`
struct View {
  vp: mat4x4f,
  lightVP: mat4x4f,
  eye: vec4f,
  right: vec4f,
  up: vec4f,
  front: vec4f,
  sun: vec4f,
  params: vec4f,
  cameraFocus: vec4f,
  bootL: vec4f,
  bootR: vec4f,
}
@group(0) @binding(0) var<uniform> view: View;

fn hash(v: vec2f) -> f32 {
  let p = fract(vec3f(v.xyx) * 0.1031);
  let q = p + dot(p, p.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
fn noise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let w = f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2f(1,0)),w.x),mix(hash(i+vec2f(0,1)),hash(i+vec2f(1,1)),w.x),w.y);
}
fn film(c: vec3f) -> vec3f {
  let x = max(c, vec3f(0));
  return pow(clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),vec3f(0),vec3f(1)),vec3f(1.0/2.2));
}
fn skyBase(d: vec3f) -> vec3f {
  let h = clamp(d.y,0.0,1.0);
  let s = max(dot(d,view.sun.xyz),0.0);
  let horizon = mix(vec3f(0.58,0.66,0.75),vec3f(1.04,0.89,0.72),pow(s,6.0)*0.85);
  let zenith = vec3f(0.14,0.24,0.35);
  return mix(horizon,zenith,pow(h,0.64)) + vec3f(.28,.21,.14)*pow(s,23.0);
}
fn atmosphere(c: vec3f, world: vec3f) -> vec3f {
  let ray = world-view.eye.xyz;
  let dist = length(ray);
  let d = ray/max(dist,0.01);
  let haze = 1.0-exp(-dist*(0.0060+0.0060*exp(-max(world.y,0.0)*0.067)));
  return mix(c, skyBase(vec3f(d.x, max(d.y,0.02), d.z))*0.85, min(0.95,haze));
}
fn drift(p: vec2f) -> f32 {
  let bank = p.x-1.8*sin(p.y*.20)-.66*sin(p.y*.57+p.x*.13);
  return sin(bank*.84+p.y*.23)*.32+sin(p.x*.43-p.y*.63+sin(p.y*.35))*.25
    +cos(p.y*.40+p.x*.20)*.43;
}
fn terrainHeight(p: vec2f) -> f32 {
  let valley = 1.12*(1.0-exp(-p.x*p.x*.0031));
  return valley+.26*sin(p.x*.22+p.y*.13)+.18*cos(p.y*.33-p.x*.11)+.23*drift(p)
    +.035*sin(p.x*1.18-p.y*1.47+sin(p.x*.65+p.y*.37));
}
fn noiseSlope(p: vec2f) -> vec2f {
  let i = floor(p);
  let f = fract(p);
  let w = f*f*(3.0-2.0*f);
  let d = 6.0*f*(1.0-f);
  let a = hash(i);
  let b = hash(i+vec2f(1,0));
  let c = hash(i+vec2f(0,1));
  let e = hash(i+vec2f(1,1));
  return vec2f(mix(b-a,e-c,w.y),mix(c-a,e-b,w.x))*d;
}
`;

// Each cell stores two half floats: signed displacement in meters and compaction.
const snowData = /* wgsl */`
const SIZE = ${gridSize}u;
const MIN = vec2f(${fieldMin.map(v => v.toFixed(1)).join(",")});
const CELL = ${texel};
@group(1) @binding(0) var<storage, read> field: array<u32>;
fn snowCell(i: u32) -> vec2f { return unpack2x16float(field[i]); }

struct Surface {
  height: f32,
  compaction: f32,
  gradient: vec2f,
}
fn spline(v: vec4f, t: f32) -> vec2f {
  let a = -0.5*v.x + 1.5*v.y - 1.5*v.z + 0.5*v.w;
  let b = v.x - 2.5*v.y + 2.0*v.z - 0.5*v.w;
  let c = 0.5*(v.z-v.x);
  return vec2f(((a*t+b)*t+c)*t+v.y,(3.0*a*t+2.0*b)*t+c);
}
fn heightRow(a: u32, t: f32) -> vec2f {
  return spline(vec4f(snowCell(a-1u).x,snowCell(a).x,snowCell(a+1u).x,snowCell(a+2u).x),t);
}
fn sampleSnow(p: vec2f, detail: bool) -> Surface {
  let g = (p - MIN) / CELL;
  if (any(g < vec2f(0)) || any(g >= vec2f(f32(SIZE)-1.0))) {
    return Surface(0, 0, vec2f(0));
  }
  let xy = vec2u(g);
  let a = xy.y*SIZE + xy.x;
  let t = fract(g);
  let v00 = snowCell(a);
  let v10 = snowCell(a+1u);
  let v01 = snowCell(a+SIZE);
  let v11 = snowCell(a+SIZE+1u);
  let v = mix(mix(v00,v10,t.x),mix(v01,v11,t.x),t.y);
  let touched = max(max(abs(v00.x),abs(v10.x)),max(abs(v01.x),abs(v11.x))) > 0.000001;
  if (detail && touched && all(xy > vec2u(0)) && all(xy < vec2u(SIZE-2u))) {
    let r0 = heightRow(a-SIZE,t.x);
    let r1 = heightRow(a,t.x);
    let r2 = heightRow(a+SIZE,t.x);
    let r3 = heightRow(a+2u*SIZE,t.x);
    let vertical = spline(vec4f(r0.x,r1.x,r2.x,r3.x),t.y);
    let horizontal = spline(vec4f(r0.y,r1.y,r2.y,r3.y),t.y);
    return Surface(vertical.x,v.y,vec2f(horizontal.x,vertical.y)/CELL);
  }
  let dx = mix(v10.x-v00.x,v11.x-v01.x,t.y);
  let dz = mix(v01.x-v00.x,v11.x-v10.x,t.x);
  return Surface(v.x,v.y,vec2f(dx,dz)/CELL);
}
`;

const stampSource = /* wgsl */`
const SIZE = ${gridSize}u;
const MIN = vec2f(${fieldMin.map(v => v.toFixed(1)).join(",")});
const CELL = ${texel};
struct Step {
  transform: vec4f,
  pressure: vec4f,
}
struct Batch {
  steps: array<Step,${maxStamps}>,
  area: vec4i,
  count: vec4u,
}
@group(0) @binding(0) var<storage,read_write> field: array<u32>;
@group(0) @binding(1) var<uniform> batch: Batch;
fn box(p: vec2f, b: vec2f, r: f32) -> f32 {
  let d = abs(p)-b+r;
  return length(max(d,vec2f(0)))+min(max(d.x,d.y),0.0)-r;
}
fn sole(p0: vec2f, foot: f32) -> f32 {
  let p = vec2f(p0.x + foot*0.013*smoothstep(-0.08,0.17,p0.y),p0.y);
  let toe = box(p-vec2f(0,0.081),vec2f(0.103,0.151),0.073);
  let heel = box(p-vec2f(0.006*foot,-0.128),vec2f(0.081,0.102),0.045);
  return min(toe,heel);
}
@compute @workgroup_size(8,8) fn stamp(@builtin(global_invocation_id) id: vec3u) {
  if (any(id.xy >= vec2u(batch.area.zw))) { return; }
  let cell = batch.area.xy+vec2i(id.xy);
  let world = MIN + vec2f(cell)*CELL;
  let at = u32(cell.y)*SIZE+u32(cell.x);
  var value = unpack2x16float(field[at]);
  for (var i = 0u; i < batch.count.x; i++) {
    let step = batch.steps[i];
    let d = world-step.transform.xy;
    let heading = step.transform.zw;
    let p = vec2f(dot(d,vec2f(-heading.y,heading.x)),dot(d,heading));
    let n = sin(world.x*53.0+world.y*47.0)*cos(world.y*39.0-world.x*25.0);
    let crust = sin(world.x*23.0-world.y*13.0)*cos(world.y*26.0+world.x*17.0);
    let shape = sole(p,step.pressure.y) + n*.006 + crust*.009;
    let wall = 1.0-smoothstep(-0.040,0.062,shape);
    let apron = smoothstep(0.040,0.064,shape)*(1.0-smoothstep(0.073,0.123,shape));
    let heel = mix(0.99,0.82,smoothstep(-0.16,0.06,p.y));
    let tread = 1.0-smoothstep(0.19,0.52,abs(fract((p.y+abs(p.x)*0.47)*14.0)-0.5)*2.0);
    let inner = 1.0-smoothstep(0.013,0.024,abs(p.x));
    let lugs = mix(tread,0.72,inner)*wall;
    let roll = mix(1.0,smoothstep(.20,.89,step.pressure.w),smoothstep(-.16,.16,p.y));
    let load = step.pressure.w*roll;
    let cut = -wall * (heel*step.pressure.x - lugs*0.014)*load;
    let ridge = apron * (.034+n*.008+crust*.011)*step.pressure.z*load;
    if (wall > .032) {
      value.x = min(value.x,cut);
    } else if (value.x >= 0.0) {
      value.x = max(value.x,ridge);
    }
    value.y = max(value.y,wall*load*(.66+lugs*.34));
  }
  field[at] = pack2x16float(value);
}
`;

const lighting = /* wgsl */`
@group(2) @binding(0) var shadow: texture_depth_2d;
@group(2) @binding(1) var shadowSampler: sampler_comparison;
fn sunlight(world: vec3f, n: vec3f) -> f32 {
  let p = view.lightVP*vec4f(world+n*0.021,1);
  let uv = p.xy*vec2f(0.5,-0.5)+0.5;
  let shadowDepth = p.z-0.00040;
  let pixel = 1.0/${shadowSize.toFixed(1)};
  let v = textureSampleCompareLevel(shadow,shadowSampler,uv+vec2f(-.7,-.7)*pixel,shadowDepth)
    +textureSampleCompareLevel(shadow,shadowSampler,uv+vec2f(.7,-.7)*pixel,shadowDepth)
    +textureSampleCompareLevel(shadow,shadowSampler,uv+vec2f(-.7,.7)*pixel,shadowDepth)
    +textureSampleCompareLevel(shadow,shadowSampler,uv+vec2f(.7,.7)*pixel,shadowDepth);
  let valid = all(uv > vec2f(0.002)) && all(uv < vec2f(0.998)) && shadowDepth > 0.0 && shadowDepth < 1.0;
  return select(1.0,v*0.25,valid);
}
fn shade(world: vec3f, normal: vec3f, base: vec3f, snow: f32, ao: f32) -> vec3f {
  let n = normalize(normal);
  let l = view.sun.xyz;
  let wrap = max(0.0,(dot(n,l)+0.16*snow)/(1.0+0.16*snow));
  let hemi = mix(vec3f(.10,.15,.22),vec3f(.30,.37,.465),n.y*.5+.5);
  let light = vec3f(1.60,1.34,1.09)*wrap*sunlight(world,n);
  return base*(hemi*ao+light*(.78+.22*ao));
}
`;

const terrainSource = shared+snowData+lighting+/* wgsl */`
struct Pixel {
  @builtin(position) clip: vec4f,
  @location(0) world: vec3f,
}
fn surfaceHeight(p: vec2f) -> f32 {
  return terrainHeight(p)+sampleSnow(p,false).height;
}
fn stitchedHeight(offset: vec3f) -> f32 {
  let p = offset.xy + view.cameraFocus.xz;
  if (offset.z == 0.0) {
    return surfaceHeight(p);
  }
  let cell = abs(offset.z);
  let axis = select(vec2f(1,0),vec2f(0,1),offset.z > 0.0);
  let t = fract(dot(offset.xy,axis)/cell);
  let a = p-axis*t*cell;
  let b = a+axis*cell;
  return mix(surfaceHeight(a),surfaceHeight(b),t);
}
@vertex fn terrain(@location(0) offset: vec3f) -> Pixel {
  let p = offset.xy + view.cameraFocus.xz;
  let h = stitchedHeight(offset);
  let world = vec3f(p.x,h,p.y);
  return Pixel(view.vp*vec4f(world,1),world);
}
@fragment fn groundPixel(frag: Pixel) -> @location(0) vec4f {
  let w = frag.world;
  let p = w.xz;
  let d = 0.042;
  let snow = sampleSnow(p,true);
  let heightSlope = vec2f(terrainHeight(p+vec2f(d,0))-terrainHeight(p-vec2f(d,0)),
    terrainHeight(p+vec2f(0,d))-terrainHeight(p-vec2f(0,d)))/(2.0*d);
  let footprint = max(length(dpdx(p)),length(dpdy(p)));
  let near = 1.0-smoothstep(.020,.068,footprint);
  let medium = 1.0-smoothstep(.065,.21,footprint);
  let loose = 1.0-snow.compaction*.83;
  let warp = vec2f(noise(p*.83),noise(p*.89+43.0))*2.4;
  let grain = p*vec2f(36.0,43.0)+warp*6.0;
  let driftNoise = p*vec2f(2.5,5.2)+warp;
  let crest = noise(driftNoise);
  let textureSlope = noiseSlope(driftNoise)*vec2f(.076,.12)*medium
    +noiseSlope(grain)*.066*near;
  let baseNormal = normalize(vec3f(-heightSlope.x,1,-heightSlope.y));
  let slope = heightSlope+snow.gradient+textureSlope*loose;
  let n = normalize(vec3f(-slope.x,1,-slope.y));
  let wind = noise(p*.96+warp)+.35*drift(p);
  let tint = mix(vec3f(.64,.70,.78),vec3f(.90,.91,.90),clamp(.32+wind*.51+crest*.15,0.0,1.0));
  let compaction = mix(tint,vec3f(.53,.62,.71),snow.compaction*.39);
  let ao = 1.0-smoothstep(.018,.245,-snow.height)*.42;
  let granules = noise(grain);
  let shadeColor = compaction*(1.0+(granules-.48)*.13*near*loose);
  let cavity = 1.0-snow.compaction*(1.0-smoothstep(-.18,.42,dot(n,view.sun.xyz)))*.16;
  // Snow scatters some light across the steep sides of a deep track.
  let wallSoftness=smoothstep(.015,.16,-snow.height)*.19;
  let softNormal=normalize(mix(n,baseNormal,wallSoftness));
  var c = shade(w,softNormal,shadeColor,1.0,ao)*cavity;
  let bl = w.xz-view.bootL.xz;
  let br = w.xz-view.bootR.xz;
  let footAO = max(exp(-dot(bl,bl)*64.0)*view.bootL.w,exp(-dot(br,br)*64.0)*view.bootR.w);
  c *= 1.0-footAO*.28;
  let h = normalize(normalize(view.eye.xyz-w)+view.sun.xyz);
  let glint = pow(max(dot(baseNormal,h),0.0),8.0)*pow(granules,12.0)*near;
  c += vec3f(1.0,.93,.83)*glint*.14*loose;
  return vec4f(film(atmosphere(c,w)),1);
}
`;

const meshSource = shared+lighting+/* wgsl */`
struct Model {
  x: vec4f,
  y: vec4f,
  z: vec4f,
  position: vec4f,
  color: vec4f,
}
@group(1) @binding(0) var<storage,read> models: array<Model>;
struct Pixel {
  @builtin(position) clip: vec4f,
  @location(0) world: vec3f,
  @location(1) normal: vec3f,
  @location(2) color: vec4f,
}
struct Vertex {
  @location(0) pos: vec3f,
  @location(1) n: vec3f,
  @location(2) color: vec4f,
}
fn modelPosition(m: Model, p: vec3f) -> vec3f {
  return m.position.xyz+p.x*m.x.xyz+p.y*m.y.xyz+p.z*m.z.xyz;

@vertex fn objects(v: Vertex, @builtin(instance_index) index: u32) -> Pixel {
  let m = models[index];

  let n = v.n.x*m.x.xyz*m.x.w+v.n.y*m.y.xyz*m.y.w+v.n.z*m.z.xyz*m.z.w;
  return Pixel(view.vp*vec4f(w,1),w,normalize(n),vec4f(v.color.rgb*m.color.rgb,v.color.a+m.color.a));
}

  return view.lightVP*vec4f(modelPosition(models[index],v.pos),1);

  let grain = noise(w.xz*18.0+vec2f(w.y*6.1,w.y*4.7));

  if (material > 1.5 && material < 2.5) { c = frag.color.rgb*2.7; }
  if (material > 2.5 && material < 3.5) {
    let needles = noise(vec2f(w.x*42.0+w.y*17.0,w.z*37.0-w.y*23.0));
    c *= .61+.62*needles;

`;

function terrainMesh() {
  const levels = [[.01171875,2.25],[.046875,4.5],[.1875,9],[.75,24],[1.5,66],[3,150]];
  const vertices = [], indices = [];
  let inner = 0;
  for (let level=0;level<levels.length;level++) {
    const [cell,radius] = levels[level];
    const next = levels[level+1]?.[0] ?? 0;
    const n = radius/cell, hole = inner/cell, stride = n*2+1;
    const base = vertices.length/3;
    for (let z=-n;z<=n;z++) {
      for (let x=-n;x<=n;x++) {
        const seam = Math.abs(x) === n ? next : Math.abs(z) === n ? -next : 0;
        vertices.push(x*cell,z*cell,seam);
      }
    }
    for (let z=-n;z<n;z++) {
      for (let x=-n;x<n;x++) {
        if (x>=-hole && x<hole && z>=-hole && z<hole) continue;
        const a = base+(z+n)*stride+(x+n);
        indices.push(a,a+stride,a+1,a+1,a+stride,a+stride+1);
      }
    }
    inner = radius;
  }
  return {vertices:new Float32Array(vertices),indices:new Uint32Array(indices)};
}

  }));
  const terrainBuffers=[{arrayStride:12,attributes:[{shaderLocation:0,offset:0,format:"float32x3"}]}];
  const modelBuffers=[{arrayStride:40,attributes:[
    {shaderLocation:0,offset:0,format:"float32x3"},{shaderLocation:1,offset:12,format:"float32x3"},
    {shaderLocation:2,offset:24,format:"float32x4"},
  ]}];
  const depth={format:"depth32float",depthWriteEnabled:true,depthCompare:"less"};
  const alpha={
    color:{srcFactor:"src-alpha",dstFactor:"one-minus-src-alpha"},
    alpha:{srcFactor:"one",dstFactor:"one-minus-src-alpha"},
  };
  function pipeline(label,module,pipelineLayout,entryPoint,buffers,fragment,depthStencil,blend,targetFormat=format) {
    return device.createRenderPipelineAsync({
      label,layout:pipelineLayout,vertex:{module,entryPoint,buffers},
      fragment:fragment?{module,entryPoint:fragment,targets:[{format:targetFormat,blend}]}:undefined,
      primitive:{topology:"triangle-list",cullMode:"none"},depthStencil,
    });
  }
  const additive={
    color:{srcFactor:"one",dstFactor:"one"},
    alpha:{srcFactor:"zero",dstFactor:"one"},
  };
  const fogBlend={
    color:{srcFactor:"one",dstFactor:"one-minus-src-alpha"},
    alpha:{srcFactor:"zero",dstFactor:"one"},
  };
  [fieldPipeline,terrainPipeline,meshPipeline,skyPipeline,particlePipeline,meshShadow,flarePipeline,
    shaftsPipeline,shaftsComposite]=await Promise.all([
    device.createComputePipelineAsync({layout:layout(stampLayout),compute:{module:shaders.stamp,entryPoint:"stamp"}}),
    pipeline("雪面",shaders.terrain,layout(viewLayout,fieldLayout,shadowLayout),"terrain",terrainBuffers,"groundPixel",depth),
    pipeline("场景",shaders.object,layout(viewLayout,modelsLayout,shadowLayout),"objects",modelBuffers,"objectPixel",depth),
    pipeline("天空",shaders.sky,layout(viewLayout),"sky",[],"skyPixel",{...depth,depthWriteEnabled:false}),
    pipeline("飘雪",shaders.particle,layout(viewLayout),"flake",[],"flakePixel",{...depth,depthWriteEnabled:false},alpha),
    pipeline("场景投影",shaders.object,layout(viewLayout,modelsLayout),"objectShadow",modelBuffers,null,depth),
    pipeline("太阳光晕",shaders.flare,layout(viewLayout,flareLayout),"flare",[],"flarePixel",undefined,additive),
    pipeline("林间光束",shaders.shafts,layout(viewLayout,shaftsDepthLayout,shadowLayout),
      "shafts",[],"scatter",undefined,undefined,"rgba16float"),
    pipeline("合成林间光束",shaders.shafts,layout(viewLayout,shaftsDepthLayout,emptyLayout,shaftsLayout),
      "shafts",[],"composite",undefined,fogBlend),
  ]);
  resetWorld(true);
  updateTreeDetail();
  ready=true;
  requestAnimationFrame(frame);
}
function uploadInstances(b) {
  b.length=b.instances.length/20;
  if (b.length>b.capacity) throw Error("场景实例超过预分配容量。");
  if (b.length) device.queue.writeBuffer(b.buffer,0,new Float32Array(b.instances));
}
function resize() {
  const ratio=Math.min(devicePixelRatio||1,1.5,1920/canvas.clientWidth,1350/canvas.clientHeight);
  const w=Math.max(1,Math.round(canvas.clientWidth*ratio)), h=Math.max(1,Math.round(canvas.clientHeight*ratio));
  if (canvas.width===w && canvas.height===h && colorDepth) return;
  canvas.width=w;
  canvas.height=h;
  colorDepth?.destroy();
  shaftsTexture?.destroy();
  colorDepth=device.createTexture({
    size:[w,h],format:"depth32float",usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING,
  });
  flareGroup=group(flareLayout,[colorDepth.createView()]);
  shaftsDepthGroup=group(shaftsDepthLayout,[colorDepth.createView()]);
  shaftsTexture=device.createTexture({
    size:[Math.ceil(w/3),Math.ceil(h/3)],format:"rgba16float",
    usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING,
  });
  shaftsView=shaftsTexture.createView();
  shaftsGroup=group(shaftsLayout,[shaftsView]);
}
// A thread owns one snow cell and applies every overlapping stamp in order.
function encodeStamps(encoder) {
  if (resetPending) {
    encoder.clearBuffer(fieldBuffer);
    resetPending=false;
  }
  if (!stamps.length) return;
  const steps=stamps.splice(0,maxStamps);
  const pad=.39;
  const min=fieldMin.map((v,i) => clamp(Math.floor((Math.min(...steps.map(p=>p[i]))-pad-v)/texel),0,gridSize));
  const max=fieldMin.map((v,i) => clamp(Math.ceil((Math.max(...steps.map(p=>p[i]))+pad-v)/texel)+1,0,gridSize));
  const [w,h]=max.map((v,i) => v-min[i]);
  if (w<=0 || h<=0) return;
  const buffer=new ArrayBuffer(maxStamps*32+32);
  new Float32Array(buffer).set(steps.flat());
  new Int32Array(buffer,maxStamps*32,4).set([...min,w,h]);
  new Uint32Array(buffer,maxStamps*32+16,4)[0]=steps.length;
  device.queue.writeBuffer(stampBuffer,0,buffer);
  const pass=encoder.beginComputePass({label:"靴底挤压雪层"});
  pass.setPipeline(fieldPipeline);
  pass.setBindGroup(0,stampGroup);
  pass.dispatchWorkgroups(Math.ceil(w/8),Math.ceil(h/8));
  pass.end();
}
function camera(dt,time) {
  const hero=atSnow(player.position);
  const f=forward(cameraYaw);
  const aspect=canvas.width/canvas.height;
  const zoom=aspect<1?1.20:1;
  let target, eye;
  if (inspection) {
    const step=lastStep??{position:player.position,yaw:player.yaw};
    const following=player.clip!==null || auto || player.feet.some(foot=>foot.stop);
    const mark=atSnow(following?player.position:step.position);
    target=add(mark,scale(forward(step.yaw),following?-.12:-.48));
    const radius=(following?2.28:1.97)*zoom;
    const inspectPitch=clamp(pitch+.59,.63,1.27);
    eye=add(target,add(scale(f,-radius*Math.cos(inspectPitch)),[0,radius*Math.sin(inspectPitch),0]));
  } else {
    const radius=5.7*zoom;
    target=add(add(hero,scale(f,1.43)),[0,1.08,0]);
    eye=add(target,add(scale(f,-radius*Math.cos(pitch)),[0,radius*Math.sin(pitch),0]));
    eye[1]=Math.max(eye[1],ground(eye[0],eye[2])+.43);
  }
  const damping=1-Math.exp(-dt*(inspection?9:8));
  cameraEye=cameraEye?mix3(cameraEye,eye,damping):eye;
  cameraTarget=cameraTarget?mix3(cameraTarget,target,damping):target;
  const front=unit(sub(cameraTarget,cameraEye));
  const right=unit(cross(front,[0,1,0]));
  const up=cross(right,front);
  const fov=57*Math.PI/180;
  const vp=mul(perspective(fov,aspect,cameraNear,cameraFar),look(cameraEye,cameraTarget));
  const lightTarget=[Math.round(hero[0]*.5)*2,0,Math.round(hero[2]*.5)*2-6];
  const lightVP=mul(ortho(28,.1,120),look(add(lightTarget,scale(sun,56)),lightTarget));
  const focus=inspection&&lastStep&&!player.clip&&!auto?lastStep.position:hero;
  const center=[Math.round(focus[0]/texel)*texel,hero[1],Math.round(focus[2]/texel)*texel,0];
  const tan=Math.tan(fov/2);
  const contacts=player.feet.flatMap(foot => [
    ...add(foot.p,scale(forward(foot.yaw),.038)),1-clamp(foot.lift*6,0,1)
  ]);
  device.queue.writeBuffer(viewBuffer,0,new Float32Array([
    ...vp,...lightVP,...cameraEye,time,...right,0,...up,0,...front,0,...sun,0,tan*aspect,tan,0,0,...center,...contacts,
  ]));
}
function drawTerrain(pass,pipeline) {
  pass.setPipeline(pipeline);
  pass.setBindGroup(1,snowGroup);
  pass.setVertexBuffer(0,terrainVertex);
  pass.setIndexBuffer(terrainIndex,"uint32");
  pass.drawIndexed(indexCount);
}
function drawObjects(pass,pipeline,shadowPass=false) {
  pass.setPipeline(pipeline);
  for (const [name,b] of Object.entries(batches)) {
    if (!b.length || (shadowPass && (name==="range" || name==="spray"))) continue;
    pass.setBindGroup(1,b.group);
    pass.setVertexBuffer(0,b.vertex);
    if (b.index) {
      pass.setIndexBuffer(b.index,"uint32");
      pass.drawIndexed(b.count,b.length);
    } else {
      pass.draw(b.count,b.length);
    }
  }
}
let lastTime, elapsed=0;
function frame(now) {
  if (!ready) return;
  const realDt=lastTime===undefined?1/60:clamp((now-lastTime)/1000,0,.05);
  const dt=realDt*(slow?.33:1);
  lastTime=now;
  elapsed+=dt;
  try {
    resize();
    movePlayer(dt,elapsed);
    updateTreeDetail();
    camera(realDt,elapsed);
    character(dt);
    snowSpray(elapsed);
    for (const b of Object.values(batches)) if (b.dynamic) uploadInstances(b);
    const encoder=device.createCommandEncoder();
    encodeStamps(encoder);
    const shadows=encoder.beginRenderPass({label:"日光阴影",colorAttachments:[],depthStencilAttachment:{
      view:shadowDepth,depthLoadOp:"clear",depthClearValue:1,depthStoreOp:"store",
    }});
    shadows.setBindGroup(0,viewGroup);
    drawObjects(shadows,meshShadow,true);
    shadows.end();
    const output=context.getCurrentTexture().createView();
    const pass=encoder.beginRenderPass({label:"雪线",colorAttachments:[{
      view:output,loadOp:"clear",clearValue:[.22,.37,.56,1],storeOp:"store",
    }],depthStencilAttachment:{view:colorDepth.createView(),depthLoadOp:"clear",depthClearValue:1,depthStoreOp:"store"}});
    pass.setBindGroup(0,viewGroup);
    pass.setPipeline(skyPipeline);
    pass.draw(3);
    pass.setBindGroup(2,shadowGroup);
    drawTerrain(pass,terrainPipeline);
    drawObjects(pass,meshPipeline);
    pass.setPipeline(particlePipeline);
    pass.draw(6,570);
    pass.end();
    const shafts=encoder.beginRenderPass({label:"林间光束",colorAttachments:[
      {view:shaftsView,loadOp:"clear",clearValue:[0,0,0,0],storeOp:"store"},
    ]});
    shafts.setPipeline(shaftsPipeline);
    shafts.setBindGroup(0,viewGroup);
    shafts.setBindGroup(1,shaftsDepthGroup);
    shafts.setBindGroup(2,shadowGroup);
    shafts.draw(3);
    shafts.end();
    const flare=encoder.beginRenderPass({label:"光束和镜头光晕",colorAttachments:[
      {view:output,loadOp:"load",storeOp:"store"},
    ]});
    flare.setPipeline(shaftsComposite);
    flare.setBindGroup(0,viewGroup);
    flare.setBindGroup(1,shaftsDepthGroup);
    flare.setBindGroup(3,shaftsGroup);
    flare.draw(3);
    flare.setPipeline(flarePipeline);
    flare.setBindGroup(0,viewGroup);
    flare.setBindGroup(1,flareGroup);
    flare.draw(3);
    flare.end();
    device.queue.submit([encoder.finish()]);
    if (controls.hidden) {
      message.hidden=true;
      controls.hidden=false;
      touchControls.hidden=false;
    }
    requestAnimationFrame(frame);
  } catch (error) { fail(error); }
}

walkButton.addEventListener("click",toggleAuto);
inspectButton.addEventListener("click",toggleInspect);
slowButton.addEventListener("click",() => { slow=!slow; updateButtons(); });
muteButton.addEventListener("click",()=>{
  muted=!muted;
  muteButton.setAttribute("aria-pressed",muted);
  muteButton.textContent=muted?"开启声音":"静音";
  if (snowAudio) {
    snowAudio.volume.gain.setTargetAtTime(muted?0:.87,snowAudio.context.currentTime,.018);
    if (muted) for (const sound of snowAudio.active) sound.stop();
  }
  if (!muted) unlockSnowAudio();
});
document.querySelector("#reset").addEventListener("click",() => resetWorld());
document.addEventListener("click",unlockSnowAudio);
document.addEventListener("pointerup",unlockSnowAudio);
const movement=/^(Key[WASD]|Arrow(Up|Down|Left|Right)|Shift(Left|Right))$/;
window.addEventListener("keydown",e => {
  if (!ready || e.altKey || e.ctrlKey || e.metaKey) return;
  if (movement.test(e.code)) {
    unlockSnowAudio();
    keys.add(e.code);
    e.preventDefault();
  }
  if (e.repeat) return;
  if (e.code==="KeyV") toggleInspect();
  if (e.code==="KeyR") resetWorld();
});
window.addEventListener("keyup",e => keys.delete(e.code));
window.addEventListener("blur",() => keys.clear());
for (const button of touchControls.querySelectorAll("button")) {
  const key=button.dataset.key;
  button.addEventListener("pointerdown",e => {
    if (!ready) return;
    button.setPointerCapture(e.pointerId);
    keys.add(key);
  });
  button.addEventListener("lostpointercapture",() => keys.delete(key));
}
let drag=null;
canvas.addEventListener("pointerdown",e => {
  if (drag!==null || e.button!==0) return;
  canvas.setPointerCapture(e.pointerId);
  drag=[e.pointerId,e.clientX,e.clientY];
});
canvas.addEventListener("pointermove",e => {
  if (drag?.[0]!==e.pointerId) return;
  cameraYaw-=(e.clientX-drag[1])*.006;
  pitch=clamp(pitch+(e.clientY-drag[2])*.004,.07,.77);
  drag=[e.pointerId,e.clientX,e.clientY];
});
canvas.addEventListener("lostpointercapture",e => { if (drag?.[0]===e.pointerId) drag=null; });
setup().catch(fail);
</script>
</body>
