<style>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#101917;color:var(--paper)}button{font:inherit}
canvas,.overlay{position:fixed;inset:0;width:100%;height:100%;touch-action:none}canvas{display:block;outline:none}

.shade{position:absolute;inset:0;background:#10171494;display:grid;place-items:center}.card{width:min(400px,88vw);background:#121d19f2;border:1px solid var(--edge);padding:29px}.card h2{margin:10px 0;font-size:28px}.card p{font-size:13px;line-height:1.7;color:#d1dbc9;margin-bottom:22px}

<body>
<canvas id="view" tabindex="0" aria-label="潮闸三维场景"></canvas>
<div class="overlay">
  <div id="title" class="title">
    <div class="title-content">
      <div class="rule mono">COASTAL PUMP STATION / 04</div>

  <div class="corner mono"><i class="mark" aria-hidden="true"></i> 海岸泵站 / 04</div>

<script id="shaders" type="text/wgsl">
struct Frame {
  view: mat4x4f, reflection: mat4x4f, flashlight: mat4x4f, sunlight: mat4x4f,
  basinReflection: mat4x4f,
  eye: vec4f, forward: vec4f, right: vec4f, up: vec4f,
  lamp: vec4f, lampDirection: vec4f, gate: vec4f, mirror: vec4f,
  relay: vec4f, reflectedRay: vec4f, surface: vec4f, step: vec4f,
  pump: vec4f, bubbles: array<vec4f,PUMP_BUBBLES>,
}
@group(0) @binding(0) var<uniform> frame: Frame;
@group(1) @binding(0) var flashDepth: texture_depth_2d;
@group(1) @binding(1) var sunDepth: texture_depth_2d;
@group(1) @binding(2) var shadowSampler: sampler_comparison;
struct Fixture {
  shadow: mat4x4f, position: vec4f, direction: vec4f, color: vec4f,
  emission: vec4f,
}
@group(1) @binding(3) var fixtureDepth: texture_depth_2d_array;
@group(1) @binding(4) var<uniform> fixtures: array<Fixture,FIXTURE_COUNT>;
@group(1) @binding(5) var signPaint: texture_2d_array<f32>;
@group(1) @binding(6) var signSampler: sampler;

const SUN = vec3f(0.119, 0.188, -0.975);
const SOURCE = vec3f(-2.95, 2.68, -5.3);
const SENSOR = vec3f(2.45, 3.28, -15.2);
const NEAR = 0.06;
const FAR = 92.0;
const SEA_LEVEL = -0.17;
const PI = 3.14159265;
const TAU = 6.28318531;

fn hash(p: vec2f) -> f32 {
  return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453);
}
fn noise(p: vec2f) -> f32 {
  let cell = floor(p);
  let q = fract(p);
  let u = q * q * (3.0 - 2.0 * q);
  return mix(mix(hash(cell), hash(cell + vec2f(1, 0)), u.x),
             mix(hash(cell + vec2f(0, 1)), hash(cell + vec2f(1, 1)), u.x), u.y);
}
fn shadowCoord(m: mat4x4f, p: vec3f) -> vec4f {
  let q = m * vec4f(p, 1);
  let n = q.xyz / max(q.w, 0.0001);
  return vec4f(n.x * 0.5 + 0.5, 0.5 - n.y * 0.5, n.z, q.w);
}
fn insideShadow(s: vec4f) -> bool {
  return s.w > 0.0 && all(s.xyz > vec3f(0)) && all(s.xyz < vec3f(1));
}
fn flashVisibility(p: vec3f, bias: f32) -> f32 {
  let s = shadowCoord(frame.flashlight, p);
  if !insideShadow(s) { return 0.0; }
  return textureSampleCompareLevel(flashDepth, shadowSampler, s.xy, s.z - bias);
}
fn sunVisibility(p: vec3f, bias: f32) -> f32 {
  let s = shadowCoord(frame.sunlight, p);
  if !insideShadow(s) { return select(0.0, 1.0, p.z < -18.5); }
  return textureSampleCompareLevel(sunDepth, shadowSampler, s.xy, s.z - bias);
}
fn fixtureVisibility(index: u32, p: vec3f, bias: f32) -> f32 {
  let s = shadowCoord(fixtures[index].shadow,p);
  if !insideShadow(s) { return 0.0; }
  return textureSampleCompareLevel(fixtureDepth,shadowSampler,s.xy,index,s.z-bias);
}
fn fixtureBeam(index: u32, towardLight: vec3f, distanceSq: f32) -> f32 {
  let light = fixtures[index];
  let cosAngle = -dot(towardLight,light.direction.xyz);
  return smoothstep(light.direction.w,light.position.w,cosAngle)
    * (1.0-smoothstep(FIXTURE_FAR*FIXTURE_FAR*0.60,FIXTURE_FAR*FIXTURE_FAR,distanceSq));
}
fn cone(origin: vec3f, dir: vec3f, p: vec3f, outer: f32, inner: f32) -> f32 {
  let v = p - origin;
  return smoothstep(outer, inner, dot(v / max(length(v), 0.005), dir));
}
fn segmentGlow(p: vec3f, start: vec3f, direction: vec3f, range: f32, width: f32) -> f32 {
  let v = p - start;
  let t = dot(v, direction);
  let d = length(v - direction * t);
  return exp(-3.0 * d * d / (width * width)) * smoothstep(0.0, 0.28, t)
    * (1.0 - smoothstep(range - 0.18, range + 0.15, t));
}

struct VertexIn {
  @location(0) pos: vec3f, @location(1) normal: vec3f, @location(2) material: f32,
  @location(3) uv: vec2f,
}
struct Geometry {
  position: vec3f, normal: vec3f,
}
fn rotation(v: vec3f, a: f32) -> vec3f {
  return vec3f(cos(a)*v.x + sin(a)*v.z, v.y, -sin(a)*v.x + cos(a)*v.z);
}
fn geometry(v: VertexIn) -> Geometry {
  var p = v.pos;
  var n = v.normal;
  if v.material >= 20.0 && v.material < 24.0 { p.y += frame.gate.x * GATE_TRAVEL; }
  if (v.material >= 24.0 && v.material < 28.0) || v.material == f32(MIRROR_MARK) {
    p = frame.mirror.xyz + rotation(p - frame.mirror.xyz, frame.mirror.w);
    n = rotation(n, frame.mirror.w);
  }
  return Geometry(p, n);
}
struct SceneVertex {
  @builtin(position) clip: vec4f, @location(0) position: vec3f, @location(1) normal: vec3f,
  @location(2) @interpolate(flat) material: u32,
  @location(3) uv: vec2f,
}
fn sceneVertex(v: VertexIn, matrix: mat4x4f) -> SceneVertex {
  let g = geometry(v);
  return SceneVertex(matrix * vec4f(g.position, 1), g.position, g.normal, u32(v.material), v.uv);
}
@vertex fn sceneMain(v: VertexIn) -> SceneVertex { return sceneVertex(v, frame.view); }
@vertex fn sceneReflection(v: VertexIn) -> SceneVertex { return sceneVertex(v, frame.reflection); }
@vertex fn basinReflection(v: VertexIn) -> SceneVertex { return sceneVertex(v,frame.basinReflection); }
@vertex fn shadowFlash(v: VertexIn) -> @builtin(position) vec4f {
  return frame.flashlight * vec4f(geometry(v).position, 1);
}
@vertex fn shadowSun(v: VertexIn) -> @builtin(position) vec4f {
  return frame.sunlight * vec4f(geometry(v).position, 1);
}
@vertex fn shadowFixed(v: VertexIn, @builtin(instance_index) index: u32) -> @builtin(position) vec4f {
  return fixtures[index].shadow * vec4f(v.pos,1);
}

fn floorWetness(p: vec2f) -> vec2f {
  let warp = vec2f(noise(p*1.18),noise(p*1.36+vec2f(18.3,4.2)))-0.5;
  let q = p + warp*vec2f(0.77,1.12);
  let pooling = min(min(
    length((q-vec2f(-1.37,4.31))/vec2f(0.85,1.25)),
    length((q-vec2f(-2.40,0.26))/vec2f(1.34,1.98))), min(
    length((q-vec2f(2.34,-6.33))/vec2f(1.49,2.45)),
    length((q-vec2f(-0.91,-13.66))/vec2f(1.38,2.48))));
  let pockets = min(length((q-vec2f(1.55,1.75))/vec2f(0.86,1.45)),
                    length((q-vec2f(-2.66,-4.50))/vec2f(0.92,1.45)));
  let edge = min(pooling,pockets) + (noise(p*vec2f(4.5,3.6))-0.5)*0.27;
  let indoors = 1.0-smoothstep(16.4,18.1,-p.y);
  let damp = (1.0-smoothstep(0.92,1.39,edge))*indoors;
  let puddle = (1.0-smoothstep(0.89,1.02,edge))*indoors;
  return vec2f(damp,puddle);
}
fn raisedTread(p: vec2f, footprint: f32) -> vec3f {
  let pitch = 0.12;
  let grid = p/pitch;
  let cell = floor(grid);
  let direction = select(-1.0,1.0,fract((cell.x+cell.y)*0.5)<0.25);
  let axis = vec2f(1.0,direction)*0.70710678;
  let across = vec2f(-axis.y,axis.x);
  let local = (fract(grid)-0.5)*pitch;
  let size = vec2f(0.049,0.0145);
  let q = vec2f(dot(local,axis),dot(local,across))/size;
  let rounded = sqrt(q*q+vec2f(0.0025,0.0036));
  let width = 0.66+min(footprint*6.0,0.25);
  let edge = clamp((rounded.x+rounded.y-0.40)/width,0.0,1.0);
  let detail = 1.0-smoothstep(0.019,0.063,footprint);
  let height = (1.0-edge*edge*(3.0-2.0*edge))*detail;
  let gradient = q/(size*rounded);
  let slope = (axis*gradient.x+across*gradient.y)*(-6.0*edge*(1.0-edge)*detail/width);
  return vec3f(height,slope);
}
fn bumpedNormal(n: vec3f, px: vec3f, py: vec3f, hx: f32, hy: f32) -> vec3f {
  let r1 = cross(py,n);
  let r2 = cross(n,px);
  let determinant = dot(px,r1);
  return normalize(max(abs(determinant),1e-9)*n - sign(determinant)*(hx*r1+hy*r2));
}
fn surfaceLight(n: vec3f, v: vec3f, l: vec3f, base: vec3f, rough: f32, metal: f32) -> vec3f {
  let noL = max(dot(n,l),0.0);
  if noL <= 0.0 { return vec3f(0); }
  let h = (l+v)*inverseSqrt(max(dot(l+v,l+v),0.00001));
  let noV = max(dot(n,v),0.004);
  let noH = max(dot(n,h),0.0);
  let a2 = max(0.0005,pow(rough,4.0));
  let d = noH*noH*(a2-1.0)+1.0;
  let distribution = a2/(PI*d*d);
  let visibility = 0.5 / max(noL*sqrt(noV*noV*(1.0-a2)+a2) + noV*sqrt(noL*noL*(1.0-a2)+a2),0.0001);
  let f0 = mix(vec3f(0.035),base,metal);
  let fresnel = f0 + (1.0-f0)*pow(1.0-clamp(dot(v,h),0.0,1.0),5.0);
  let diffuse = base*(1.0-fresnel)*(1.0-metal)/PI;
  return (diffuse + fresnel*min(distribution*visibility,36.0))*noL;
}
fn shade(in: SceneVertex, eye: vec3f) -> vec4f {
  let p = in.position;
  let normal = normalize(in.normal);
  let v = normalize(eye - p);
  let id = in.material;
  let tread = id == TREAD_PLATE && normal.y > 0.66;
  let horizontal = abs(normal.y)>0.66 && (id==0u || id==1u || id==TREAD_PLATE);
  let uv = select(vec2f(p.x*0.69+p.z*0.77,p.y+p.x*0.16-p.z*0.11),p.xz,horizontal);
  let footprint = max(length(dpdx(uv)),length(dpdy(uv)));
  let px = dpdx(p);
  let py = dpdy(p);
  let coarse = noise(uv*0.73);
  let mid = noise(uv*6.6);
  let grit = mix(noise(uv*39.0),0.5,smoothstep(0.013,0.040,footprint));
  let uvDx = dpdx(in.uv);
  let uvDy = dpdy(in.uv);
  var base = vec3f(0.27,0.279,0.258) * (0.63 + 0.34*coarse + 0.27*mid + 0.16*grit);
  var rough = 0.89;
  var metal = 0.0;
  var relief = (mid*0.0034+grit*0.0013);
  var treadSlope = vec2f(0);
  var puddle = 0.0;
  var emissive = vec3f(0);
  if tread {
    let sheetSize = vec2f(1.52,2.45);
    let row = floor((p.z+7.2)/sheetSize.y);
    let sheet = (p.xz+vec2f(0.35+fract(row*0.5)*sheetSize.x,7.2))/sheetSize;
    let edge = (0.5-abs(fract(sheet)-0.5))*sheetSize;
    let jointDistance = min(edge.x,edge.y);
    let seam = smoothstep(0.002,0.010+min(footprint*0.45,0.012),jointDistance);
    let bolt = (1.0-smoothstep(0.008,0.016,length(edge-vec2f(0.042))))
      * (1.0-smoothstep(0.006,0.026,footprint));
    let pattern = raisedTread(p.xz,footprint);
    let treadMask = smoothstep(0.011,0.035,jointDistance)*(1.0-bolt);
    let raised = pattern.x*treadMask;
    let wet = floorWetness(p.xz);
    puddle = wet.y*(1.0-raised*mix(0.68,0.13,wet.y));
    let brushed = mix(noise(p.xz*vec2f(48.0,5.0)),0.5,smoothstep(0.009,0.035,footprint));
    let sheetTone = 0.86+0.24*hash(floor(sheet));
    base = vec3f(0.205,0.232,0.241)*sheetTone*(0.77+0.28*coarse+0.16*mid+0.07*brushed);
    base = mix(base,vec3f(0.37,0.397,0.40)*sheetTone,raised*0.72);
    base *= mix(0.40,1.0,seam)*mix(1.0,0.58,bolt)*(1.0-0.34*wet.x)*(1.0-0.39*puddle);
    rough = mix(mix(0.62+mid*0.09,0.43,raised),0.33,puddle);
    metal = mix(0.70,0.94,raised)*mix(0.78,1.0,seam);
    relief = 0.0018*seam-0.0011*bolt+0.00036*brushed;
    treadSlope = pattern.yz*(0.0038*treadMask*(1.0-0.65*puddle));
  } else if id == TREAD_PLATE {
    base = vec3f(0.115,0.137,0.141)*(0.79+0.31*mid);
    rough = 0.62;
    metal = 0.72;
  } else if id == 0u {
    let tile = abs(fract(p.xz*vec2f(0.34,0.22)+vec2f(0.72,0.50))-0.5);
    let seam = smoothstep(0.004,0.010,min(tile.x,tile.y));
    let pores = smoothstep(0.18,0.44,grit);
    base = vec3f(0.237,0.237,0.208)*(0.62+0.41*coarse+0.24*mid+0.16*pores)*mix(0.61,1.0,seam);
    rough = 0.91;
    relief += 0.0018*seam;
  } else if id == 1u || (id >= 28u && id <= BASIN_SIGN) {
    if !horizontal {
      let seams = smoothstep(0.007,0.017,abs(fract(p.y*0.52+0.49)-0.5));
      let drip = noise(vec2f(uv.x*8.2,p.y*0.59));
      let tide = smoothstep(0.04,0.90,p.y-0.11*coarse);
      base *= mix(0.49,1.0,seams)*(0.80+0.29*drip)*mix(0.50,1.0,tide);
      relief += seams*0.0019;
    }
    rough = 0.85+0.12*grit;
    if id >= 28u {
      let mark = textureSampleGrad(signPaint,signSampler,in.uv,i32(id-28u),uvDx,uvDy);
      let wear = smoothstep(0.19,0.44,noise(uv*28.0)*0.72+mid*0.28);
      let alpha = mark.a*mix(0.58+0.40*wear,1.0,select(0.0,0.63,id==31u || id==32u));
      base = mix(base,mark.rgb*(0.72+0.25*coarse),alpha);
      rough = mix(rough,0.69,alpha);
      relief *= 1.0-0.45*alpha;
    }
  } else if id == 2u || id == 9u || id == 14u || id == 20u || id == 26u || id == 27u {
    let brush = mix(noise(vec2f(uv.x*4.4,uv.y*97.0)),0.5,smoothstep(0.007,0.024,footprint));
    base = vec3f(0.15,0.18,0.176)*(0.78+0.23*mid+0.17*brush);
    rough = 0.38+0.16*mid;
    metal = 0.90;
    relief = brush*0.00035;
    if id == 9u || id == 26u {
      let lathe = length(in.uv);
      let latheFootprint = max(length(uvDx),length(uvDy));
      let finish = mix(noise(vec2f(lathe*179.0,6.2)),0.5,smoothstep(0.0024,0.007,latheFootprint));
      base = vec3f(0.53,0.55,0.50)*(0.83+0.18*finish+0.09*mid);
      rough = 0.27+0.09*finish;
      relief = finish*0.00016;
    }
    if id == 14u {
      let oxidation = smoothstep(0.47,0.70,coarse*0.43+mid*0.48+grit*0.09);
      base = mix(vec3f(0.40,0.43,0.39)*(0.84+0.14*brush),vec3f(0.23,0.103,0.052)*(0.67+0.63*mid+0.17*grit),oxidation);
      rough = mix(0.31+0.14*brush,0.84,oxidation);
      metal = mix(0.93,0.06,oxidation);
      relief += oxidation*(mid*0.002+grit*0.0014);
    }
    if id == 20u {
      let shutterY = p.y-frame.gate.x*GATE_TRAVEL;
      let band = 0.5+0.5*cos(shutterY*38.55);
      base *= 0.78+0.22*band;
      rough = 0.54+0.07*band;
      if normal.z > 0.40 {
        let paintUV = vec2f(0.5+p.x/3.95,0.5+(2.34-shutterY)/1.98);
        if all(abs(paintUV-0.5)<vec2f(0.5)) {
          let paint = textureSampleGrad(signPaint,signSampler,paintUV,i32(GATE_PAINT_LAYER),
            vec2f(px.x/3.95,-px.y/1.98),vec2f(py.x/3.95,-py.y/1.98));
          let wear = mix(0.85,1.0,smoothstep(0.22,0.55,grit*0.64+mid*0.36));
          let coverage = paint.a*wear;
          base = mix(base,paint.rgb*(0.82+0.18*band),coverage);
          rough = mix(rough,0.69,coverage);
          metal = mix(metal,0.025,coverage);
        }
      }
    }
    if id == 27u { rough = 0.47; }
  } else if id == 22u {
    base = vec3f(0.037,0.042,0.039)*(0.77+0.35*mid);
    rough = 0.81;
  } else if id == 3u || id == 18u || id == 21u {
    base = vec3f(0.64,0.42,0.091)*(0.73+grit*0.32);
    if id == 18u || id == 21u {
      let stripe = select(1.4,4.4,id==18u);
      base *= mix(0.08,1.0,step(0.5,fract((p.x+p.y)*stripe)));
    }
    rough = 0.59;
    relief *= 0.32;
  } else if id == 4u {
    let chip = smoothstep(0.63,0.76,mid*0.56+coarse*0.24+grit*0.20);
    base = mix(vec3f(0.043,0.235,0.201)*(0.83+0.31*coarse),vec3f(0.41,0.38,0.31),chip);
    rough = mix(0.37+0.12*mid,0.54,chip);
    metal = mix(0.02,0.82,chip);
    relief = 0.0008*grit-0.0015*chip;
  } else if id == 5u {
    let wear = smoothstep(0.60,0.78,mid*0.75+grit*0.25);
    base = mix(vec3f(0.39,0.076,0.035),vec3f(0.40,0.38,0.33),wear)*(0.85+0.22*coarse);
    rough = mix(0.41,0.64,wear);
    metal = 0.76*wear;
    relief *= 0.36;
  } else if id == 6u || id == 7u || id == 8u || id == 12u || id == 23u {
    base = vec3f(0.23);
    if id == 6u { emissive = vec3f(1.62,0.13,0.039) * (0.90+0.10*sin(frame.eye.w*3.3)); }
    if id == 7u { emissive = vec3f(0.13,0.71,0.58); }
    if id == 8u { emissive = mix(vec3f(0.21,0.038,0.016),vec3f(0.38,2.7,0.79),frame.relay.w); }
    if id == 12u { emissive = vec3f(1.7,1.24,0.69) * frame.gate.z; }
    if id == 23u { emissive = vec3f(1.2,0.2,0.052); }
  } else if (id >= 15u && id <= 17u) || id == BASIN_LENS_MATERIAL {
    let lens = fixtures[select(id-15u,FIXTURE_COUNT-1u,id==BASIN_LENS_MATERIAL)];
    emissive = lens.color.rgb*lens.emission.x*(0.95+0.09*mid);
    rough = 0.28;
  } else if id == 10u {
    base = vec3f(0.055,0.067,0.055);
  } else if id == 11u {
    base = vec3f(0.58,0.61,0.49) * (0.84 + grit*0.17);
    rough = 0.52;
  } else if id == 24u {
    base = vec3f(0.48,0.53,0.48)*(0.83+mid*0.22);
    rough = 0.20; metal = 0.91;
    relief = 0.0;
    emissive = vec3f(0.075,0.114,0.102) + frame.gate.z*vec3f(0.10,0.092,0.062);
  } else if id == 25u {
    base = vec3f(0.46,0.33,0.095); rough = 0.42; metal = 0.67;
  } else if id == BASIN_WALL {
    let local = basinLocal(p);
    let damp = smoothstep(0.0,0.17,p.y-BASIN_LEVEL);
    base = basinConcrete(local,normal)*mix(0.62,1.0,damp);
    rough = mix(0.53,0.76,damp);
    relief *= 0.38;
  } else if id == CONSOLE_FACE || id == CONSOLE_SCREEN || id == CONSOLE_NAMEPLATE || id == MIRROR_MARK {
    let decal = textureSampleGrad(signPaint,signSampler,in.uv,i32(id-28u),uvDx,uvDy).rgb;
    base = decal*(0.94+0.08*mid);
    rough = select(0.66,0.30,id==CONSOLE_SCREEN);
    relief = 0.00027*grit;
    if id == CONSOLE_SCREEN {
      let u = in.uv.x;
      let w = in.uv.y;
      let calibrated = smoothstep(0.95,0.99,frame.relay.w);
      let pumpReady = frame.pump.w;
      let angle = frame.mirror.w/0.23;
      let alignment = exp(-angle*angle)*frame.gate.z;
      let cell = (u*512.0-38.0)/37.3;
      let index = clamp(floor(cell),0.0,11.0);
      let segment = (1.0-smoothstep(0.80,0.86,fract(cell)))*step(0.0,cell)*step(cell,12.0);
      let track = segment*smoothstep(0.404,0.411,w)*(1.0-smoothstep(0.496,0.504,w));
      let chargeTrack = segment*smoothstep(0.710,0.720,w)*(1.0-smoothstep(0.799,0.809,w));
      let readout = vec3f(0.21,0.69,0.50)*track*smoothstep(index,index+1.0,alignment*12.0)
        + vec3f(0.70,0.41,0.097)*chargeTrack*smoothstep(index,index+1.0,frame.relay.w*12.0);
      let status = mix(vec3f(0.68,0.12,0.032),
        mix(vec3f(0.75,0.30,0.043),vec3f(0.14,0.83,0.45),calibrated),pumpReady);
      let indicator = 1.0-smoothstep(0.019,0.028,length((in.uv-vec2f(0.927,0.148))*vec2f(1.84,1.0)));
      emissive = decal*mix(vec3f(0.18,0.23,0.20),vec3f(0.34,0.48,0.38),pumpReady)
        +readout*0.58*pumpReady+status*indicator*0.71;
    }
  } else if id == CONSOLE_POWER || id == CONSOLE_RELAY {
    base = vec3f(0.068,0.12,0.082);
    rough = 0.32;
    let standby = mix(vec3f(0.57,0.098,0.027),vec3f(0.44,0.16,0.024),frame.pump.w);
    let readyColor = vec3f(0.13,0.78,0.45);
    let state = frame.pump.w*select(1.0,smoothstep(0.93,0.99,frame.relay.w),id==CONSOLE_RELAY);
    emissive = mix(standby,readyColor,state)*select(0.34,0.62,id==CONSOLE_POWER);
  } else if id == CONSOLE_PAINT {
    let wear = smoothstep(0.74,0.89,mid*0.47+grit*0.53);
    base = mix(vec3f(0.069,0.196,0.171)*(0.91+0.16*coarse),vec3f(0.21,0.24,0.21),wear);
    rough = 0.47+0.12*wear;
    metal = 0.11+0.50*wear;
    relief = 0.0010*grit;
  } else if id == CONSOLE_DIAL {
    let theta = clamp(frame.mirror.w/1.26,-1.0,1.0)*2.05;
    let direction = vec2f(sin(theta),cos(theta));
    let dial = -in.uv;
    let radial = dot(dial,direction);
    let across = abs(dial.x*direction.y-dial.y*direction.x);
    let onCap = smoothstep(0.90,0.98,dot(normal,CONSOLE_PANEL_NORMAL));
    let mark = smoothstep(0.025,0.031,radial)*(1.0-smoothstep(0.052,0.058,radial))
      *(1.0-smoothstep(0.0027,0.0046,across))*onCap;
    base = mix(vec3f(0.045,0.052,0.050),vec3f(0.72,0.49,0.11),mark);
    rough = 0.48;
    relief = 0.00030*grit;
  }
  let n = bumpedNormal(normal,px,py,dpdx(relief)+dot(treadSlope,px.xz),dpdy(relief)+dot(treadSlope,py.xz));
  let room = smoothstep(-19.0,-17.9,p.z);
  let shutterFace = select(0.0,max(0.0,normal.z),id==20u || id==21u);
  let bounce = mix(vec3f(0.036,0.047,0.051),vec3f(0.016,0.022,0.027),room)*(0.55+0.45*max(0.0,n.y))
    + vec3f(0.027,0.031,0.029)*shutterFace;
  let reflectedUp = 0.5+0.5*reflect(-v,n).y;
  let roomReflectance = mix(1.0,0.57,room);
  var out = base*bounce*mix(1.0,0.38,metal)+emissive;
  out += mix(vec3f(0.035),base,metal)*mix(vec3f(0.014,0.021,0.025),vec3f(0.075,0.080,0.074),reflectedUp)*(1.0-0.57*rough)*roomReflectance;
  for (var i=0u; i<FIXTURE_COUNT; i++) {
    let light = fixtures[i];
    let toLight = light.position.xyz-p;
    let distSq = dot(toLight,toLight);
    if distSq < FIXTURE_FAR*FIXTURE_FAR {
      let l = toLight*inverseSqrt(max(distSq,0.0001));
      let spot = fixtureBeam(i,l,distSq);
      let energy = light.color.rgb*light.color.w;
      out += base*energy*(0.010+0.012*max(dot(n,l),0.0))*(1.0-0.65*metal)/(9.0+distSq);
      if spot > 0.001 && dot(n,l) > 0.0 {
        let visibility = fixtureVisibility(i,p+normal*0.015,0.0011);
        out += energy*spot*visibility*surfaceLight(n,v,l,base,rough,metal)/(1.4+distSq);
      }
    }
  }
  let alarm = vec3f(0.61, 3.84, -12.84) - p;
  out += vec3f(1.16,0.23,0.079)*surfaceLight(n,v,normalize(alarm),base,rough,metal)/(1.0+dot(alarm,alarm)*0.35);
  if id == BASIN_WALL || id == BASIN_SIGN {
    let spill = vec3f(BASIN_CENTER.x+BASIN_LAMP.x,BASIN_LEVEL+0.10,BASIN_CENTER.y+BASIN_LAMP.z)-p;
    let light = select(2.1,3.4,id==BASIN_WALL)/(0.62+dot(spill,spill));
    out += vec3f(0.55,0.85,0.79)*light*surfaceLight(n,v,normalize(spill),base,rough,metal);
  }
  if (id >= 24u && id < 28u) || id >= CONSOLE_NAMEPLATE {
    let workLight = frame.mirror.xyz+vec3f(0.0,0.66,0.85)-p;
    let fill = 1.68/(0.70+dot(workLight,workLight));
    out += vec3f(0.76,0.91,0.89)*fill*surfaceLight(n,v,normalize(workLight),base,rough,metal);
  }
  if frame.lamp.w > 0.0 {
    let delta = frame.lamp.xyz - p;
    let spot = cone(frame.lamp.xyz,frame.lampDirection.xyz,p,0.900,0.978);
    if spot > 0.001 {
      let e = spot*flashVisibility(p+normal*0.019,0.0008)*30.0/(1.5+dot(delta,delta));
      out += vec3f(1,0.90,0.72)*e*surfaceLight(n,v,normalize(delta),base,rough,metal);
    }
  }
  if frame.gate.z > 0.0 {
    let ray = normalize(SOURCE - p);
    let beam = cone(SOURCE, normalize(frame.mirror.xyz-SOURCE), p, 0.973, 0.997);
    let bounced = segmentGlow(p,frame.mirror.xyz,frame.reflectedRay.xyz,frame.reflectedRay.w,0.46);
    out += frame.gate.z * (beam * vec3f(2.30,1.94,1.20)*surfaceLight(n,v,ray,base,rough,metal)
         + bounced * base * vec3f(0.64,0.76,0.44));
  }
  if frame.gate.y > 0.0 || p.z < -18.6 {
    let sun = sunVisibility(p + normal*0.035, 0.001);
    let skyAmbient = smoothstep(0.0, 1.0, (-p.z - 11.0)/11.0) * (0.2+frame.gate.y*0.8);
    out += vec3f(1.0,0.55,0.26)*sun*10.0*surfaceLight(n,v,SUN,base,rough,metal);
    out += base*vec3f(0.33,0.41,0.46)*skyAmbient;
  }
  // The HDR pass carries puddle coverage in alpha for the planar reflection composite.
  return vec4f(out,puddle);
}
@fragment fn mainShade(in: SceneVertex) -> @location(0) vec4f { return shade(in,frame.eye.xyz); }
@fragment fn mirrorShade(in: SceneVertex) -> @location(0) vec4f {
  if in.material == 0u || in.material == TREAD_PLATE || in.material == BASIN_WALL { discard; }
  let reflection = shade(in,vec3f(frame.eye.x,-frame.eye.y,frame.eye.z));
  return vec4f(reflection.rgb,1);
}
@fragment fn basinMirrorShade(in: SceneVertex) -> @location(0) vec4f {
  if in.position.y < BASIN_LEVEL { discard; }
  let eye = vec3f(frame.eye.x,2.0*BASIN_LEVEL-frame.eye.y,frame.eye.z);
  return vec4f(shade(in,eye).rgb,1);
}

struct Screen { @builtin(position) position: vec4f, @location(0) uv: vec2f }
@vertex fn screen(@builtin(vertex_index) i: u32) -> Screen {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return Screen(vec4f(p * vec2f(2,-2) + vec2f(-1,1),0,1), p);
}
@group(2) @binding(0) var sceneDepth: texture_depth_2d;
@group(2) @binding(1) var sceneColor: texture_2d<f32>;
@group(2) @binding(2) var reflectionColor: texture_2d<f32>;
@group(2) @binding(3) var fogColor: texture_2d<f32>;
@group(2) @binding(4) var ripple: texture_2d<f32>;
@group(2) @binding(5) var linearSampler: sampler;
@group(2) @binding(6) var oceanSlopes: texture_2d_array<f32>;
@group(2) @binding(7) var skyCache: texture_2d_array<f32>;
@group(2) @binding(8) var waveSampler: sampler;
@group(2) @binding(9) var skySampler: sampler;
@group(2) @binding(10) var basinReflectionColor: texture_2d<f32>;
@group(2) @binding(11) var<storage,read> basinNodes: array<BasinNode>;
@group(2) @binding(12) var<storage,read> basinTriangles: array<BasinTriangle>;
@group(2) @binding(13) var basinMarkings: texture_2d_array<f32>;
fn projectionUV(matrix: mat4x4f, p: vec3f) -> vec2f {
  let clip = matrix*vec4f(p,1);
  return clip.xy/max(clip.w,0.001)*vec2f(0.5,-0.5)+0.5;
}
fn screenEdge(uv: vec2f) -> f32 {
  let edge = min(uv,1.0-uv);
  return smoothstep(0.0,0.035,min(edge.x,edge.y));
}
fn viewRay(uv: vec2f) -> vec3f {
  let s = uv*2.0 - 1.0;
  return normalize(frame.forward.xyz + frame.right.xyz*s.x*frame.right.w + frame.up.xyz*(-s.y)*frame.up.w);
}
fn linearDepth(uv: vec2f) -> f32 {
  let size = vec2i(textureDimensions(sceneDepth));
  let d = textureLoad(sceneDepth, clamp(vec2i(uv*vec2f(size)),vec2i(0),size-1), 0);
  return NEAR*FAR/(FAR - d*(FAR-NEAR));
}
fn basinIntersection(ray: vec3f) -> f32 {
  if ray.y >= -0.0001 { return -1.0; }
  let distance = (BASIN_LEVEL-frame.eye.y)/ray.y;
  if distance <= 0.0 { return -1.0; }
  let local = frame.eye.xz+ray.xz*distance-BASIN_CENTER;
  return select(-1.0,distance,all(abs(local)<BASIN_HALF));
}
fn skyUV(ray: vec3f) -> vec2f {
  return vec2f(atan2(ray.x,-ray.z)/TAU+0.5,asin(clamp(ray.y,0.0,1.0))/(PI*0.5));
}
fn cachedSky(ray: vec3f, lod: f32) -> vec4f {
  // Advect the cached cloud layer in world direction while keeping the sun and sky fixed.
  let wind = vec3f(2.5,0.0,1.4)*frame.eye.w*max(ray.y,0.0)/800.0;
  let clouds = textureSampleLevel(skyCache,skySampler,skyUV(normalize(ray-wind)),0,lod);
  return vec4f(clearSky(ray)*clouds.a+clouds.rgb,clouds.a);
}
fn sky(ray: vec3f) -> vec3f {
  let light = cachedSky(ray,0.0);
  let disk = smoothstep(0.99989,0.99994,dot(ray,SUN));
  return light.rgb + vec3f(7.1,4.2,2.1)*disk*light.a;
}

// biu-game's open-ocean approach: filtered slope moments, sky Fresnel and a GGX sun lobe.
fn seaDistance(ray: vec3f) -> f32 {
  let height = frame.eye.y - SEA_LEVEL;
  let a = dot(ray.xz,ray.xz) / 12742000.0;
  let discriminant = ray.y*ray.y - 4.0*a*height;
  if ray.y >= 0.0 || discriminant < 0.0 || height <= 0.0 { return -1.0; }
  let distance = 2.0*height / max(-ray.y+sqrt(discriminant),0.00001);
  let p = frame.eye.xz+ray.xz*distance;
  let underStation = abs(p.x)<DECK_HALF_WIDTH && p.y>DECK_END && p.y<DECK_START;
  return select(distance,-1.0,underStation);
}
fn glint(normal: vec3f, view: vec3f, alpha: f32) -> f32 {
  let h = normalize(view + SUN);
  let noV = max(dot(normal,view),0.002);
  let noL = max(dot(normal,SUN),0.0);
  let noH = max(dot(normal,h),0.0);
  let a2 = alpha*alpha;
  let denominator = noH*noH*(a2-1.0)+1.0;
  let distribution = a2 / max(PI*denominator*denominator,0.00001);
  let visibility = 0.5 / max(noL*sqrt(noV*noV*(1.0-a2)+a2) + noV*sqrt(noL*noL*(1.0-a2)+a2),0.00001);
  let fresnel = 0.022 + 0.978*pow(1.0-clamp(dot(view,h),0.0,1.0),5.0);
  return distribution*visibility*fresnel*noL;
}
fn sunSparkles(p: vec2f, dx: vec2f, dy: vec2f, specular: f32) -> f32 {
  let chance = min(max(0.0,specular-0.085)*0.13,0.19);
  if chance <= 0.0 { return 0.0; }
  let offset = p-frame.eye.xz;
  let range = max(length(offset),0.01);
  let radial = offset/range;
  let tangent = vec2f(-radial.y,radial.x);
  let rangeStep = abs(dot(radial,dx))+abs(dot(radial,dy));
  let angleStep = (abs(dot(tangent,dx))+abs(dot(tangent,dy)))/range;
  let detail = 1.0-smoothstep(0.20,1.8,rangeStep);
  let average = chance*0.08;
  if detail <= 0.0 { return average; }

  // As in Biu Game, the sun lobe drives the odds of a flash in each projected water cell.
  let bearing = atan2(radial.x,-radial.y);
  let cells = vec2f(bearing,range)/max(vec2f(angleStep*1.32,rangeStep),vec2f(0.00001,0.014));
  let cell = bitcast<vec2u>(vec2i(floor(cells)));
  let time = frame.eye.w*6.7 + gridHash(vec3u(cell,0u))*6.0;
  let tick = u32(floor(time))+1u;
  let a = step(1.0-chance,gridHash(vec3u(cell,tick)));
  let b = step(1.0-chance,gridHash(vec3u(cell,tick+1u)));
  let flash = mix(a,b,smoothstep(0.14,0.86,fract(time)));
  return mix(average,flash,detail);
}
fn ocean(ray: vec3f, p: vec2f, dx: vec2f, dy: vec2f, distanceToWater: f32) -> vec3f {
  var slope = vec2f(0.0);
  var variance = 0.0;
  var swell = vec2f(0.0);
  for (var band = 0u; band < OCEAN_BANDS; band++) {
    let span = OCEAN_SPANS[band];
    let moments = textureSampleGrad(oceanSlopes,waveSampler,p/span,i32(band),dx/span,dy/span);
    slope += moments.xy;
    variance += dot(max(moments.zw - moments.xy*moments.xy,vec2f(0.0)),vec2f(1.0));
    if band < 2u { swell += moments.xy; }
  }
  let slick = noise(p*vec2f(0.025,0.065) + vec2f(frame.eye.w*0.02,0.0));
  let wind = mix(0.68,1.04,smoothstep(0.20,0.79,slick));
  let alpha = clamp(sqrt(0.00145 + variance*wind*wind)*0.78,0.028,0.36);
  let normal = normalize(vec3f(-slope.x*wind,1.0,-slope.y*wind));
  let noV = mix(max(-ray.y,alpha*0.55),clamp(dot(normal,-ray),0.0,1.0),0.69);
  let fresnel = 0.023 + 0.977*pow(1.0-noV,5.0);
  let reflection = reflect(ray,normal);
  let skyDirection = normalize(vec3f(reflection.x,sqrt(reflection.y*reflection.y+alpha*alpha*0.43),reflection.z));
  let reflected = cachedSky(skyDirection,clamp(log2(1.0+alpha*68.0),0.7,4.6)).rgb;
  let face = dot(swell + slope*0.44,vec2f(0.5,0.866))*6.0;
  let waveLight = face / sqrt(1.0 + face*face);
  let coast = exp(-max(0.0,abs(p.x)-3.1)*0.105)*exp(-max(0.0,-p.y-25.0)*0.048);
  let body = mix(vec3f(0.018,0.071,0.148),vec3f(0.024,0.115,0.186),coast*0.62)*(1.0+waveLight*0.61);
  let blueReflection = reflected*vec3f(0.91,1.035,1.13)*(0.63+0.12*waveLight);
  var color = mix(body,blueReflection,fresnel*0.86);
  // Grade the brighter blue wave faces before adding the warm sun and white glints.
  let bright = smoothstep(0.067,0.159,dot(color,vec3f(0.2126,0.7152,0.0722)));
  let blue = smoothstep(0.018,0.074,color.b-color.r);
  color *= 1.0-0.27*bright*blue;
  let sunTransmission = max(0.18,cachedSky(SUN,1.0).a);
  let spec = min(glint(normal,-ray,alpha),6.0)*sunTransmission;
  color += vec3f(1.06,0.65,0.34)*spec*0.39;
  color += vec3f(1.0,0.985,0.97)*sunSparkles(p,dx,dy,spec)*1.85;
  let distantSky = cachedSky(normalize(vec3f(ray.x,0.0,ray.z)),1.7).rgb;
  let haze = 1.0-exp(-distanceToWater*0.00165);
  return mix(color,distantSky,haze*0.94);
}
struct BasinHit {
  distance: f32, normal: vec3f, material: u32, uv: vec2f,
}
struct BasinNode { low: vec4f, high: vec4f }
struct BasinTriangle {
  point: vec4f, edgeA: vec4f, edgeB: vec4f,
  normalA: vec4f, normalB: vec4f, normalC: vec4f, coordinates: vec4f,
}

const BASIN_CONCRETE = 0u;
const BASIN_LENS = 1u;
const BASIN_STEEL = 2u;
const BASIN_RUBBER = 3u;
const BASIN_CAST = 4u;
const BASIN_PAINT = 5u;
const BASIN_GRATE = 6u;
const BASIN_TAG = 7u;

fn basinLocal(p: vec3f) -> vec3f {
  return vec3f(p.x-BASIN_CENTER.x,p.y-BASIN_LEVEL,p.z-BASIN_CENTER.y);
}
fn basinConcrete(p: vec3f, n: vec3f) -> vec3f {
  let wall = vec2f(select(p.x,p.z,abs(n.x)>0.5),p.y);
  let uv = select(wall,p.xz,n.y>0.5);
  let aggregate = noise(uv*51.0);
  let tone = noise(uv*4.8);
  let pore = smoothstep(0.14,0.37,aggregate);
  let sideMark = smoothstep(0.34,0.85,noise(vec2f(uv.x*14.0,uv.y*1.5)));
  let deposit = (1.0-smoothstep(-0.14,-0.035,p.y))*smoothstep(-0.54,-0.18,p.y)*sideMark;
  let score = 1.0-smoothstep(0.002,0.009,abs(uv.y+0.53+0.002*noise(uv*45.0)));
  let stain = (0.91+0.17*tone+0.077*pore)*(1.0-0.20*deposit-0.14*score);
  return vec3f(0.24,0.258,0.244)*stain;
}
fn basinBoundsHit(low: vec3f, high: vec3f, origin: vec3f, inverse: vec3f, limit: f32) -> bool {
  let a = (low-origin)*inverse;
  let b = (high-origin)*inverse;
  let entry = min(a,b);
  let exit = max(a,b);
  return max(0.001,max(entry.x,max(entry.y,entry.z)))<=min(limit,min(exit.x,min(exit.y,exit.z)));
}
fn basinMeshHit(origin: vec3f, ray: vec3f, limit: f32, anyHit: bool) -> BasinHit {
  let inverse = select(vec3f(-1),vec3f(1),ray>=vec3f(0))/max(abs(ray),vec3f(1e-6));
  var hit = BasinHit(limit,vec3f(0),0u,vec2f(0));
  // Nodes are threaded in depth-first order. A miss jumps over the entire subtree.
  var index = 0u;
  loop {
    if index>=arrayLength(&basinNodes) { break; }
    let node = basinNodes[index];
    let escape = select(index+1u,u32(node.high.w),node.high.w>0.0);
    if !basinBoundsHit(node.low.xyz,node.high.xyz,origin,inverse,hit.distance) { index=escape; continue; }
    if node.high.w<0.0 {
      let first = u32(node.low.w);
      let end = u32(-node.high.w);
      for (var j=first; j<end; j++) {
        let triangle = basinTriangles[j];
        let p = cross(ray,triangle.edgeB.xyz);
        let determinant = dot(triangle.edgeA.xyz,p);
        if abs(determinant)<1e-9 { continue; }
        let q = origin-triangle.point.xyz;
        let inverseDeterminant = 1.0/determinant;
        let u = dot(q,p)*inverseDeterminant;
        if u<0.0 || u>1.0 { continue; }
        let r = cross(q,triangle.edgeA.xyz);
        let v = dot(ray,r)*inverseDeterminant;
        let t = dot(triangle.edgeB.xyz,r)*inverseDeterminant;
        if v<0.0 || u+v>1.0 || t<=0.001 || t>=hit.distance { continue; }
        hit.distance = t;
        if anyHit { return hit; }
        let w = 1.0-u-v;
        hit.normal = normalize(w*triangle.normalA.xyz+u*triangle.normalB.xyz+v*triangle.normalC.xyz);
        if dot(hit.normal,ray)>0.0 { hit.normal=-hit.normal; }
        hit.material = u32(triangle.point.w);
        hit.uv = w*triangle.coordinates.xy+u*triangle.coordinates.zw+v*vec2f(triangle.edgeA.w,triangle.edgeB.w);
      }
      index++;
    } else {
      index++;
    }
  }
  return hit;
}
fn basinLightVisibility(p: vec3f, normal: vec3f, delta: vec3f) -> f32 {
  let range = length(delta);
  let lightRay = delta/max(range,0.0001);
  if range<0.027 || dot(normal,lightRay)<=0.0 { return 1.0; }
  let origin = p+normal*0.004;
  let axis = select(vec3f(0,1,0),vec3f(0,0,1),abs(lightRay.y)>0.90);
  let tangent = normalize(cross(axis,lightRay))*0.069;
  let bitangent = cross(lightRay,tangent);
  let lightSamples = array<vec3f,3>(delta+tangent,delta-tangent*0.52-bitangent*0.78,delta-tangent*0.52+bitangent*0.78);
  var visible = 0.0;
  for(var i=0u;i<3u;i++) {
    let sampleRay = lightSamples[i];
    let sampleRange = length(sampleRay);
    let limit = sampleRange-0.016;
    let blocker = basinMeshHit(origin,sampleRay/sampleRange,limit,true).distance;
    visible += 1.0-smoothstep(0.0,0.14,limit-blocker);
  }
  return 0.22+0.78*visible/3.0;
}
fn basinMaterialNormal(p: vec3f, n: vec3f, material: u32) -> vec3f {
  if material==BASIN_LENS || material==BASIN_TAG { return n; }
  let axis = select(vec3f(0,1,0),vec3f(1,0,0),abs(n.y)>0.88);
  let tangent = normalize(cross(axis,n));
  let bitangent = cross(n,tangent);
  let uv = (p.xz+vec2f(p.y*0.63,p.y*0.82))*73.0;
  let variation = vec2f(noise(uv),noise(uv+vec2f(31.2,9.7)))-0.5;
  let micro = select(0.075,0.17,material==BASIN_CAST || material==BASIN_CONCRETE);
  return normalize(n+(tangent*variation.x+bitangent*variation.y)*micro);
}
fn basinCaustic(p: vec2f, depth: f32) -> f32 {
  let t = frame.eye.w;
  let q = p+vec2f(0.33,-0.17)*depth;
  let distortion = vec2f(sin(q.y*7.9-t*0.85),sin(q.x*6.2+t*0.64));
  let a = sin(dot(q,vec2f(12.4,7.5))+distortion.x*0.62+t*0.91);
  let b = sin(dot(q,vec2f(-8.6,15.2))+distortion.y*0.43-t*1.16);
  let c = sin(dot(q,vec2f(20.7,-9.2))+t*0.75+distortion.x*0.78);
  let focus = pow(clamp(1.0-abs(a*0.52+b*0.34+c*0.14),0.0,1.0),6.0);
  return focus*mix(0.20,1.0,smoothstep(0.20,0.77,noise(q*4.5)));
}
fn basinBubbles(origin: vec3f, ray: vec3f, limit: f32, background: vec3f) -> vec3f {
  let count = u32(frame.pump.z);
  if count==0u { return background; }
  let inverse = select(vec3f(-1),vec3f(1),ray>=vec3f(0))/max(abs(ray),vec3f(1e-6));
  if !basinBoundsHit(PUMP_VENT-vec3f(0.23,0.055,0.23),PUMP_VENT+vec3f(0.28,-PUMP_VENT.y,0.23),
    origin,inverse,limit) { return background; }
  var color = background;
  for (var i=0u; i<count; i++) {
    let bubble = frame.bubbles[i];
    let delta = bubble.xyz-origin;
    let closest = dot(delta,ray);
    let side = (delta-closest*ray)/bubble.w;
    let radial = dot(side,side);
    if radial>=1.0 { continue; }
    let chord = sqrt(1.0-radial);
    let entry = closest-bubble.w*chord;
    if entry<=0.001 || entry>=limit { continue; }
    let n = -side-ray*chord;
    let lampRay = normalize(BASIN_LAMP-bubble.xyz);
    let overhead = normalize(BASIN_OVERHEAD-bubble.xyz);
    let lampGlint = pow(max(0.0,dot(n,normalize(lampRay-ray))),25.0);
    let overheadGlint = pow(max(0.0,dot(n,normalize(overhead-ray))),32.0);
    let edge = smoothstep(0.39,0.86,radial)*(1.0-smoothstep(0.86,1.0,radial));
    let sheen = edge*(0.045+0.17*max(0.0,dot(n,lampRay)))+0.47*lampGlint+0.22*overheadGlint;
    let depthFade = exp(-entry*0.40)*(1.0-smoothstep(-0.043,-0.004,bubble.y));
    color = color*(1.0-depthFade*(0.56*edge+0.042*chord)) + depthFade*sheen*vec3f(0.74,0.88,0.86);
  }
  return color;
}
fn basinUnderwater(p: vec3f, ray: vec3f, normal: vec3f) -> vec3f {
  let waterRay = refract(ray,normal,1.0/1.333);
  let origin = basinLocal(p);
  let bed = (BASIN_BED-origin.y)/waterRay.y;
  let side = select(-BASIN_HALF,BASIN_HALF,waterRay.xz>=vec2f(0));
  let wall = (side-origin.xz)*select(vec2f(-1.0),vec2f(1.0),waterRay.xz>=vec2f(0))/max(abs(waterRay.xz),vec2f(1e-5));
  let boundary = min(bed,min(wall.x,wall.y));
  var hit = basinMeshHit(origin,waterRay,boundary,false);
  if hit.distance == boundary {
    hit.normal = vec3f(0,1,0);
    if wall.x < min(wall.y,bed) { hit.normal = vec3f(-sign(waterRay.x),0,0); }
    else if wall.y < bed { hit.normal = vec3f(0,0,-sign(waterRay.z)); }
  }
  let q = origin+waterRay*hit.distance;
  let uv = q.xz+vec2f(q.y*0.81,-q.y*0.29);
  let fine = noise(uv*81.0);
  let grit = noise(uv*27.0);
  let coarse = noise(uv*6.6);
  var albedo = vec3f(0);
  var rough = 0.70;
  var metal = 0.0;
  var emission = vec3f(0);
  switch hit.material {
    case BASIN_CONCRETE: { albedo = basinConcrete(q,hit.normal); rough = 0.83; }
    case BASIN_LENS: {
      let profile = smoothstep(0.20,0.86,1.0-abs(q.z-0.22)*4.6);
      emission = vec3f(0.98,1.02,0.94)*(0.25+0.53*profile);
      albedo = vec3f(0.23,0.27,0.26);
      rough = 0.32;
    }
    case BASIN_STEEL: {
      let brush = noise(uv*vec2f(86,8));
      albedo = vec3f(0.36,0.39,0.38)*(0.76+0.18*coarse+0.12*brush);
      rough = 0.31+0.17*brush;
      metal = 0.86;
    }
    case BASIN_RUBBER: {
      albedo = vec3f(0.035,0.039,0.038)*(0.81+0.27*grit);
      rough = 0.62+0.09*fine;
    }
    case BASIN_CAST: {
      let oxide = smoothstep(0.62,0.84,coarse*0.55+grit*0.45);
      albedo = mix(vec3f(0.115,0.126,0.119),vec3f(0.17,0.117,0.086),oxide)*(0.80+0.29*fine+0.13*coarse);
      rough = 0.62+0.22*grit;
      metal = 0.42*(1.0-oxide*0.85);
    }
    case BASIN_PAINT: {
      let chipped = smoothstep(0.72,0.86,0.48*coarse+0.34*grit+0.18*fine);
      albedo = mix(vec3f(0.084,0.152,0.168)*(0.82+0.26*coarse+0.12*grit),vec3f(0.21,0.219,0.202),chipped);
      rough = 0.42+0.14*grit+0.12*chipped;
      metal = 0.04+0.60*chipped;
    }
    case BASIN_GRATE: {
      albedo = vec3f(0.14,0.155,0.15)*(0.73+0.29*grit);
      rough = 0.56+0.17*coarse;
      metal = 0.70;
    }
    case BASIN_TAG: {
      albedo = textureSampleLevel(basinMarkings,linearSampler,hit.uv,i32(BASIN_TAG_LAYER),2.3).rgb;
      rough = 0.54;
      metal = 0.28;
    }
    default: {}
  }
  let n = basinMaterialNormal(q,hit.normal,hit.material);
  let center = max(abs(q.x)/BASIN_HALF.x,abs(q.z)/BASIN_HALF.y);
  let rim = 1.0-smoothstep(0.80,1.0,center)*0.32;
  let reflection = reflect(waterRay,n);
  let environment = mix(vec3f(0.032,0.042,0.041),vec3f(0.18,0.22,0.21),max(0.0,reflection.y));
  var color = albedo*vec3f(0.100,0.128,0.128)*mix(1.0,0.31,metal)*rim+emission;
  color += environment*mix(vec3f(0.035),albedo,metal)*(1.0-rough*0.68)*rim;
  let air = BASIN_OVERHEAD-q;
  let toAir = normalize(air);
  let lightPath = toAir*min(length(air),-q.y/max(toAir.y,0.01));
  let throughWater = exp(-length(lightPath)*vec3f(0.45,0.19,0.13));
  let down = vec3f(0.93,0.97,1.0)*(4.6/(0.92+dot(air,air)))*throughWater;
  let waterEntry = q+lightPath;
  let visibleEntry = 1.0-smoothstep(0.94,1.015,max(abs(waterEntry.x)/BASIN_HALF.x,abs(waterEntry.z)/BASIN_HALF.y));
  let caustic = basinCaustic(waterEntry.xz,q.y)*visibleEntry;
  color += down*(0.48+caustic*0.32)*surfaceLight(n,-waterRay,toAir,albedo,rough,metal)
    * basinLightVisibility(q,hit.normal,air)*visibleEntry;
  let lamp = BASIN_LAMP-q;
  let l = lamp*inverseSqrt(max(dot(lamp,lamp),0.0001));
  let returned = basinCaustic(q.xz+vec2f(0.32,-0.24)*q.y,-q.y*0.73)*max(0.0,hit.normal.y);
  let pool = vec3f(0.88,0.96,0.88)*(3.0+1.22*returned)/(0.31+dot(lamp,lamp));
  color += pool*surfaceLight(n,-waterRay,l,albedo,rough,metal)*basinLightVisibility(q,hit.normal,lamp);
  let transmission = exp(-hit.distance*vec3f(0.51,0.235,0.173));
  let transmitted = color*transmission+vec3f(0.009,0.027,0.032)*(1.0-transmission);
  return basinBubbles(origin,waterRay,hit.distance,transmitted);
}
fn basinWater(p: vec3f, ray: vec3f) -> vec3f {
  let local = p.xz-BASIN_CENTER;
  let t = frame.eye.w;
  let a = vec2f(7.8,5.6);
  let b = vec2f(-4.4,8.9);
  let c = vec2f(17.9,-12.1);
  let ripple = local-vec2f(0.44,1.045);
  let r = length(ripple);
  let spread = exp(-r*1.32)*smoothstep(0.025,0.12,r);
  var slope = a*0.0043*cos(dot(local,a)-t*1.58)
    + b*0.0028*cos(dot(local,b)+t*1.21)
    + c*0.0010*cos(dot(local,c)-t*2.42)
    + ripple/max(r,0.001)*cos(r*33.0-t*2.1)*spread*0.036;
  if frame.pump.y>0.001 {
    let source = local-PUMP_VENT.xz-vec2f(0.06,0);
    let distance = length(source);
    let wave = distance*51.0-frame.pump.x*14.0;
    let rings = 0.065*cos(wave)+0.023*sin(wave*1.67+source.x*11.0);
    let falloff = exp(-distance*6.1)*smoothstep(0.012,0.072,distance);
    slope += source/max(distance,0.001)*rings*falloff*frame.pump.y;
  }
  let normal = normalize(vec3f(-slope.x,1.0,-slope.y));
  let transmitted = basinUnderwater(p,ray,normal);
  let reflected = reflect(ray,normal);
  let flat = reflect(ray,vec3f(0,1,0));
  let uv = projectionUV(frame.basinReflection,p);
  let waveUV = projectionUV(frame.basinReflection,p+reflected*1.9)-projectionUV(frame.basinReflection,p+flat*1.9);
  let reflectionUV = uv+clamp(waveUV,vec2f(-0.018),vec2f(0.018));
  let room = textureSampleLevel(basinReflectionColor,linearSampler,reflectionUV,0);
  let backup = textureSampleLevel(basinReflectionColor,linearSampler,uv,0);
  let reflectedRoom = mix(backup.rgb,room.rgb,room.a*screenEdge(reflectionUV));
  let fresnel = 0.0204+0.9796*pow(1.0-clamp(dot(normal,-ray),0.0,1.0),5.0);
  let light = BASIN_OVERHEAD-basinLocal(p);
  let halfVector = normalize(light)-ray;
  let h = halfVector*inverseSqrt(max(dot(halfVector,halfVector),0.0001));
  let glimmer = 0.046*pow(max(0.0,dot(normal,h)),122.0);
  let edge = min(BASIN_HALF.x-abs(local.x),BASIN_HALF.y-abs(local.y));
  let waterline = (1.0-smoothstep(0.002,0.012,edge))*(0.22+0.78*noise(local*10.0));
  return mix(transmitted,reflectedRoom,fresnel)+vec3f(0.83,0.94,1.0)*glimmer+vec3f(0.016,0.024,0.025)*waterline;
}
@fragment fn volume(s: Screen) -> @location(0) vec4f {
  let ray = viewRay(s.uv);
  let viewCos = max(dot(ray,frame.forward.xyz),0.05);
  let hit = seaDistance(ray);
  var z = linearDepth(s.uv);
  let basin = basinIntersection(ray);
  if basin > 0.0 { z = min(z,basin*viewCos); }
  if hit > 0.0 { z = min(z,hit*viewCos); }
  let dist = min(z/viewCos,32.0);
  let march = dist / 22.0;
  let offset = 0.39 + 0.22*hash(floor(s.position.xy));
  var fog = vec3f(0);
  for (var i = 0; i < 22; i++) {
    let t = (f32(i) + offset)*march;
    let p = frame.eye.xyz + ray*t;
    let density = 0.24 + 0.42*exp(-max(p.y,0.0)*0.70) + 0.19*noise(p.xz*0.53+vec2f(frame.eye.w*0.05,0));
    if p.z > -18.1 && p.z < 6.8 {
      for (var j=0u; j<FIXTURE_COUNT; j++) {
        let toLight = fixtures[j].position.xyz-p;
        let distSq = dot(toLight,toLight);
        if distSq < FIXTURE_FAR*FIXTURE_FAR {
          let l = toLight*inverseSqrt(max(distSq,0.0001));
          let beam = fixtureBeam(j,l,distSq);
          if beam > 0.001 {
            let light = fixtures[j].color;
            let phase = 0.57+0.43*pow(max(dot(ray,l),0.0),3.0);
            let visible = fixtureVisibility(j,p,0.0007);
            let nearLens = smoothstep(0.025,0.19,distSq);
            fog += light.rgb*light.w*beam*visible*density*phase*nearLens*0.0125/(2.0+distSq);
          }
        }
      }
    }
    if frame.lamp.w > 0.0 {
      let spot = cone(frame.lamp.xyz,frame.lampDirection.xyz,p,0.915,0.982);
      if spot > 0.0 {
        let d = length(p-frame.lamp.xyz);
        fog += vec3f(0.83,0.92,0.88)*density*spot*flashVisibility(p,0.0014)*0.049*exp(-d*0.19);
      }
    }
    if frame.gate.z > 0.0 {
      let incoming = segmentGlow(p,SOURCE,normalize(frame.mirror.xyz-SOURCE),distance(SOURCE,frame.mirror.xyz),0.34);
      let outgoing = segmentGlow(p,frame.mirror.xyz,frame.reflectedRay.xyz,frame.reflectedRay.w,0.28);
      fog += frame.gate.z*density*(incoming*vec3f(0.19,0.14,0.055) + outgoing*vec3f(0.15,0.20,0.097));
    }
    if frame.gate.y > 0.0 && p.z < -4.0 && p.z > -23.0 {
      let phase = 0.34 + 0.66*pow(max(dot(ray,SUN),0.0),6.0);
      let inside = smoothstep(-20.0,-17.8,p.z);
      fog += vec3f(0.067,0.040,0.023)*density*phase*inside*sunVisibility(p,0.0015)*smoothstep(0.0,0.32,frame.gate.y);
    }
  }
  return vec4f(fog*march,z);
}
fn fogAt(uv: vec2f, z: f32) -> vec3f {
  let size = vec2f(textureDimensions(fogColor));
  let grid = uv*size-0.5;
  let cell = floor(grid);
  let f = fract(grid);
  var color = vec3f(0);
  var total = 0.0;
  for (var i=0; i<4; i++) {
    let offset = vec2i(i % 2, i / 2);
    let t = textureLoad(fogColor,clamp(vec2i(cell)+offset,vec2i(0),vec2i(size)-1),0);
    let w = select(1.0-f.x,f.x,offset.x==1)*select(1.0-f.y,f.y,offset.y==1);
    let weight = w / (1.0 + 6.0*abs(t.a-z)/max(z,0.5));
    color += t.rgb*weight;
    total += weight;
  }
  return color/max(total,0.0001);
}
fn toneMap(color: vec3f) -> vec3f {
  let glow = max(color-vec3f(0.9),vec3f(0))*0.035;
  let x = (color + glow) * 1.23;
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),vec3f(0),vec3f(1));
}
@fragment fn display(s: Screen) -> @location(0) vec4f {
  let ray = viewRay(s.uv);
  let viewCos = max(dot(ray,frame.forward.xyz),0.05);
  let geometryDepth = linearDepth(s.uv);
  let background = geometryDepth > FAR - 0.75;
  let sea = seaDistance(ray);
  let seaPoint = frame.eye.xz + ray.xz*max(0.0,sea);
  let seaDx = dpdx(seaPoint);

fn gridHash(p: vec3u) -> f32 {
  var n = (p.x*1597334677u) ^ (p.y*3812015801u) ^ (p.z*2798796415u);

  let b = mix(gridHash(i+vec3u(0,1,0)),gridHash(i+vec3u(1,1,0)),t.x);
  let c = mix(gridHash(i+vec3u(0,0,1)),gridHash(i+vec3u(1,0,1)),t.x);
  let d = mix(gridHash(i+vec3u(0,1,1)),gridHash(i+vec3u(1,1,1)),t.x);

fn cloudDensity(p: vec3f, detail: bool) -> f32 {
  let height = (p.y-CLOUD_BASE)/(CLOUD_TOP-CLOUD_BASE);

function matrixProduct(a,b) {
  const m = new Float32Array(16);
  for (let col=0;col<4;col++) for (let row=0;row<4;row++) {
    for (let k=0;k<4;k++) m[col*4+row] += a[k*4+row]*b[col*4+k];
  }
  return m;
}

  const z=mul(unit(forward),-1), x=unit(cross(up,z)), y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}
function perspective(angle,aspect,near,far) {
  const f=1/Math.tan(angle/2);
  return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,far/(near-far),-1,0,0,near*far/(near-far),0]);
}

  return new Float32Array([2/w,0,0,0,0,2/h,0,0,0,0,1/(near-far),0,0,0,near/(near-far),1]);
}

function packBasinMesh(vertices) {
  const triangles=[];
  const stride=vertexComponents;
  for(let i=0;i<vertices.length;i+=stride*3){
    const point=vertices.slice(i,i+3), b=vertices.slice(i+stride,i+stride+3), c=vertices.slice(i+stride*2,i+stride*2+3);
    const edgeA=sub(b,point),edgeB=sub(c,point);
    if(Math.hypot(...cross(edgeA,edgeB))<1e-10)continue;
    const normalA=vertices.slice(i+3,i+6),normalB=vertices.slice(i+stride+3,i+stride+6),normalC=vertices.slice(i+stride*2+3,i+stride*2+6);
    triangles.push({
      low:point.map((a,j)=>Math.min(a,b[j],c[j])), high:point.map((a,j)=>Math.max(a,b[j],c[j])),
      center:point.map((a,j)=>(a+b[j]+c[j])/3),
      data:[...point,vertices[i+6],...edgeA,vertices[i+stride*2+7],...edgeB,vertices[i+stride*2+8],
        ...normalA,0,...normalB,0,...normalC,0,vertices[i+7],vertices[i+8],vertices[i+stride+7],vertices[i+stride+8]],
    });
  }
  const nodes=[], faces=[];
  function split(items){
    const index=nodes.length;
    const low=[Infinity,Infinity,Infinity], high=[-Infinity,-Infinity,-Infinity];
    for(const triangle of items)for(let i=0;i<3;i++){
      low[i]=Math.min(low[i],triangle.low[i]);high[i]=Math.max(high[i],triangle.high[i]);
    }
    const node=[...low.map(v=>v-0.00002),0,...high.map(v=>v+0.00002),0];
    nodes.push(node);
    // A negative last index marks a leaf. Its first and last entries are triangle indices.
    if(items.length<=6){
      node[3]=faces.length;
      for(const triangle of items)faces.push(triangle.data);
      node[7]=-faces.length;
      return;
    }
    const spans=sub(high,low);
    const axis=spans.indexOf(Math.max(...spans));
    items.sort((a,b)=>a.center[axis]-b.center[axis]);
    const mid=items.length>>1;
    split(items.slice(0,mid));split(items.slice(mid));
    nodes[index][7]=nodes.length;
  }
  split(triangles);
  return {nodes:new Float32Array(nodes.flat()),triangles:new Float32Array(faces.flat())};
}

function nearMirror(){return Math.hypot(state.x-mirror[0],state.z-mirror[2])<2.25;}

    const change=Number(keys.has("ArrowRight")||keys.has("KeyD"))-Number(keys.has("ArrowLeft")||keys.has("KeyA"));

    const speed=running?4.7:3.35;
    const step=speed*dt/Math.max(1,Math.hypot(side,walk));
    const dx=(Math.sin(state.yaw)*walk+Math.cos(state.yaw)*side)*step;
    const dz=(-Math.cos(state.yaw)*walk+Math.sin(state.yaw)*side)*step;
    const oldX=state.x,oldZ=state.z;
    if(!blocked(state.x+dx,state.z))state.x+=dx;
    if(!blocked(state.x,state.z+dz))state.z+=dz;
    const moved=Math.hypot(state.x-oldX,state.z-oldZ);
    state.stride+=moved;
    if(state.stride>=state.nextFootContact){
      state.nextFootContact+=strideLength;
      stationAudio.footstep(running);
    }
    if(moved>0 && state.rippleAge>0.45){state.foot=[state.x,0,state.z];state.rippleAge=0;}
    state.y+=(1.65+(moved>0?Math.sin(state.stride*11)*0.024:0)-state.y)*Math.min(1,dt*12);
  }
  if(state.relay && state.gate<1 && dt>0){
    const previous=state.gate;
    state.gate=Math.min(1,state.gate+dt*gateLiftRate);
    stationAudio.gate(state.x,state.y,state.z,state.yaw,previous,state.gate);
  }
  if(state.gate>=1)state.gateReady=true;
  if(state.gateReady && state.z<-23.0) state.won=true;
  stationAudio.pump(state.pumpOn,state.x,state.y,state.z,state.yaw);
}

  if(activeTouch?.[0]===e.pointerId)activeTouch=undefined;

function recordRenderedFrame(now) {
  if(fpsSampleStart===undefined){
    fpsSampleStart=now;
    return;
  }
  fpsSampleFrames++;
  const elapsed=now-fpsSampleStart;
  if(elapsed<fpsSampleMs)return;
  fps=1000*fpsSampleFrames/elapsed;
  fpsSampleStart=now;
  fpsSampleFrames=0;
  // Count consecutive windows so a single long hitch cannot reduce resolution.
  slowSamples=fps<45?slowSamples+1:0;
  fastSamples=fps>=57?fastSamples+1:0;
  if(slowSamples>=5&&renderScaleIndex<renderScales.length-1){
    renderScaleIndex++;
    resetFrameRateSamples();
  }else if(fastSamples>=20&&renderScaleIndex>0){
    renderScaleIndex--;

// Same spectrum bands and slope energy as the biu-game open ocean.
function buildOceanSeed(size,bands) {
  let seed=4321;
  const random=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const gaussian=()=>Math.sqrt(-2*Math.log(random()))*Math.cos(TAU*random());
  const wind=unit([0.5,0.87,0]);
  const peak=TAU/14;
  const coefficients=new Float32Array(size*size*bands.length*2);
  for(const [band,{span,min,max,slopeVariance}] of bands.entries()){
    const spacing=TAU/span;
    const start=band*size*size*2;
    let energy=0;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const kx=(x<size/2?x:x-size)*spacing;
      const kz=(y<size/2?y:y-size)*spacing;
      const k=Math.hypot(kx,kz);
      if(k===0 || k<min || k>=max)continue;
      const sigma=k<peak?0.07:0.09;
      const peakShape=Math.exp(-((Math.sqrt(k/peak)-1)**2)/(2*sigma*sigma));
      const directional=0.5+0.5*clamp((kx*wind[0]+kz*wind[1])/k,-1,1);
      const spread=Math.max(0.8,6*Math.sqrt(peak/k));
      const power=k**-4*Math.exp(-1.25*(peak/k)**2-(k/420)**2)*3.3**peakShape
        *(directional**spread+0.04)*spacing*spacing;
      const i=start+(y*size+x)*2;
      const amplitude=Math.sqrt(power/2);
      coefficients[i]=gaussian()*amplitude;
      coefficients[i+1]=gaussian()*amplitude;
      energy+=k*k*power;
    }
    const gain=Math.sqrt(slopeVariance/Math.max(2*energy,1e-12));
    for(let i=start;i<start+size*size*2;i++)coefficients[i]*=gain;
  }
  return coefficients;
}

  const particleBuffer=buffer("Mist particles",dust,GPUBufferUsage.STORAGE);
  const driftGroup=bg("Drift positions",driftLayout,[[0,{buffer:particleBuffer}]]);
  const dustGroup=bg("Mist vertices",dustLayout,[[1,{buffer:particleBuffer}]]);
  const sceneLayout=pipelineLayout(uniformLayout,shadowsLayout);
  const shadowLayout=pipelineLayout(uniformLayout);
  const depthStencil={format:"depth32float",depthWriteEnabled:true,depthCompare:"less"};
  const colorTarget={format:"rgba16float"};
  const render=(label,layout,vertex,fragment,target,buffers=[],depth)=>{
    const desc={label,layout,vertex:{module,entryPoint:vertex,buffers},primitive:{topology:"triangle-list"}};
    if(fragment)desc.fragment={module,entryPoint:fragment,targets:[target]};
    if(depth)desc.depthStencil=depth;
    return device.createRenderPipelineAsync(desc);
  };
  const compute=(label,layout,entryPoint)=>device.createComputePipelineAsync({label,layout,compute:{module,entryPoint}});
  const computeLayout=group=>pipelineLayout(uniformLayout,empty,empty,group);
  const [mainPipe,reflectionPipe,basinReflectionPipe,flashPipe,sunPipe,fixedPipe,fogPipe,displayPipe,particlePipe,driftPipe,waterPipe,
    spectrumPipe,rowsPipe,columnsPipe,momentsPipe,filterPipe,skyPipe]=await Promise.all([
    render("Main HDR",sceneLayout,"sceneMain","mainShade",colorTarget,verts,depthStencil),
    render("Planar reflection",sceneLayout,"sceneReflection","mirrorShade",colorTarget,verts,depthStencil),
    render("Service basin reflection",sceneLayout,"basinReflection","basinMirrorShade",colorTarget,verts,depthStencil),
    render("Flashlight shadow",shadowLayout,"shadowFlash",null,null,verts,depthStencil),
    render("Sunlight shadow",shadowLayout,"shadowSun",null,null,verts,depthStencil),
    render("Static fixture shadow",pipelineLayout(empty,fixtureDepthLayout),"shadowFixed",null,null,verts,depthStencil),
    render("Half-resolution light scattering",pipelineLayout(uniformLayout,shadowsLayout,depthLayout),"screen","volume",colorTarget),
    render("Present",pipelineLayout(uniformLayout,empty,displayLayout),"screen","display",{format}),
    render("Instanced mist",pipelineLayout(uniformLayout,shadowsLayout,empty,dustLayout),"dustVertex","dustShade",
      {format:"rgba16float",blend:{color:{srcFactor:"one",dstFactor:"one"},alpha:{srcFactor:"zero",dstFactor:"one"}}},[],
      {...depthStencil,depthWriteEnabled:false}),
    compute("Mist drift",computeLayout(driftLayout),"drift"),
    compute("Ripple slope",computeLayout(waterLayout),"water"),
    compute("Evolve wave spectrum",computeLayout(oceanSpectrumLayout),"oceanSpectrum"),
    compute("Inverse FFT rows",computeLayout(oceanAxisLayout),"oceanRows"),
    compute("Inverse FFT columns",computeLayout(oceanAxisLayout),"oceanColumns"),
    compute("Write ocean slope moments",computeLayout(oceanMomentsLayout),"writeOceanMoments"),
    compute("Filter sky and ocean",computeLayout(filterLayout),"filterOceanTexture"),
    compute("Trace dawn cloud layers",computeLayout(skyLayout),"updateSky"),

  const shadowGeometry={buffer:geometry[0].buffer,count:staticShadowCount};

  }
  const staticBundles=await Promise.all([
    bundle("Pump station main",mainPipe,geometry[0],true),
    bundle("Pump station reflection",reflectionPipe,geometry[0],true),
    bundle("Pump station lamp shadow",flashPipe,shadowGeometry,false),
    bundle("Pump station sun shadow",sunPipe,shadowGeometry,false),
    bundle("Pump station basin reflection",basinReflectionPipe,geometry[0],true),
  ]);
  recordedBundleCount=staticBundles.filter(Boolean).length;
  function drawScene(pass,pipe,index,lit){
    const bundle=staticBundles[index];
    if(useBundles&&bundle)pass.executeBundles([bundle]);
    else geometryDraw(pass,pipe,lit?geometry[0]:shadowGeometry,lit);
    for(const mesh of geometry.slice(1))geometryDraw(pass,pipe,mesh,lit);
  }
  makeTargets=(width,height)=>{
    const reduced=(fraction)=>[Math.max(1,Math.ceil(width*fraction)),Math.max(1,Math.ceil(height*fraction))];
    const reflectionSize=reduced(0.52), fogSize=reduced(0.50);
    const basinReflectionSize=reduced(0.50);
    const textures=[
      makeTexture("Main HDR color",width,height,"rgba16float"),makeTexture("Main depth",width,height,"depth32float"),
      makeTexture("Mirror color",...reflectionSize,"rgba16float"),makeTexture("Mirror depth",...reflectionSize,"depth32float"),
      makeTexture("Light scattering and depth",...fogSize,"rgba16float"),
      makeTexture("Basin reflection color",...basinReflectionSize,"rgba16float"),
      makeTexture("Basin reflection depth",...basinReflectionSize,"depth32float"),
    ];
    const [color,depth,refl,reflDepth,fog,basinRefl,basinDepth]=textures.map(t=>t.createView());
    return {width,height,textures,color,depth,refl,reflDepth,fog,basinRefl,basinDepth,
      depthGroup:bg("Main depth input",depthLayout,[[0,depth]]),
      displayGroup:bg("Frame inputs",displayLayout,[[0,depth],[1,color],[2,refl],[3,fog],[4,rippleView],[5,linearSampler],
        [6,oceanView],[7,skyView],[8,waveSampler],[9,skySampler],[10,basinRefl],
        [11,{buffer:basinTree}],[12,{buffer:basinFaces}],[13,arrayView(signs)]]),
    };
  };
  if(timestamps){
    const query=device.createQuerySet({type:"timestamp",count:2});
    const resolve=device.createBuffer({size:16,usage:GPUBufferUsage.QUERY_RESOLVE|GPUBufferUsage.COPY_SRC});
    const read=device.createBuffer({size:16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    gpuTimestamp={query,resolve,read,busy:false};
  }
  let oceanReady=false;
  function runCompute(encoder,timing) {
    const pass=encoder.beginComputePass({label:"Mist, water and sky",
      ...(timing?{timestampWrites:{querySet:timing.query,beginningOfPassWriteIndex:0}}:{})});
    pass.setBindGroup(0,frameGroup);
    pass.setBindGroup(1,emptyGroup);
    pass.setBindGroup(2,emptyGroup);
    const dispatch=(pipeline,group,x,y=1,z=1)=>{
      pass.setPipeline(pipeline);
      pass.setBindGroup(3,group);
      pass.dispatchWorkgroups(x,y,z);
    };
    const filter=mips=>{
      for(const mip of mips)dispatch(filterPipe,mip.group,mip.width,mip.height,mip.layers);
    };
    dispatch(driftPipe,driftGroup,Math.ceil(particleCount/64));
    dispatch(waterPipe,waterGroup,Math.ceil(waterSize[0]/8),Math.ceil(waterSize[1]/8));
    if(!oceanReady){
      dispatch(skyPipe,skyGroup,skySize[0]/8,skySize[1]/8);
      filter(skyMips);
    }
    if(!oceanReady || state.gate>0){
      const bands=oceanBands.length;
      dispatch(spectrumPipe,spectrumGroup,oceanSize/8,oceanSize/8,bands);
      dispatch(rowsPipe,rowsGroup,oceanSize,bands);
      dispatch(columnsPipe,columnsGroup,oceanSize,bands);
      dispatch(momentsPipe,momentsGroup,oceanSize/8,oceanSize/8,bands);

    }

  }
  const depthAttachment = view=>({view,depthClearValue:1,depthLoadOp:"clear",depthStoreOp:"store"});
  const clear = (view,a=0)=>({view,clearValue:[0,0,0,a],loadOp:"clear",storeOp:"store"});
  let fixturesReady=false, lastSun=-1, lastFlash=true, lastUsedBundles=null;
  drawFrame=(sample=false,basinVisible=false)=>{
    const encoder=device.createCommandEncoder({label:"Tidegate frame"});
    const timing=sample&&gpuTimestamp&&!gpuTimestamp.busy?gpuTimestamp:null;
    runCompute(encoder,timing);
    if(!fixturesReady){
      for(const [index,view] of fixtureViews.entries()){
        const pass=encoder.beginRenderPass({label:"Cached fixture shadow",colorAttachments:[],depthStencilAttachment:depthAttachment(view)});
        pass.setPipeline(fixedPipe);pass.setBindGroup(0,emptyGroup);pass.setBindGroup(1,fixtureDepthGroup);
        pass.setVertexBuffer(0,shadowGeometry.buffer);pass.draw(shadowGeometry.count,1,0,index);pass.end();
      }
      fixturesReady=true;
    }
    if(state.lamp || lastFlash!==state.lamp){
      const pass=encoder.beginRenderPass({label:"Flashlight shadow",colorAttachments:[],depthStencilAttachment:depthAttachment(flashView)});
      if(state.lamp)drawScene(pass,flashPipe,2,false);
      pass.end();lastFlash=state.lamp;
    }
    if(lastSun!==state.gate||lastUsedBundles!==useBundles){
      const pass=encoder.beginRenderPass({label:"Sun shadow",colorAttachments:[],depthStencilAttachment:depthAttachment(sunView)});
      drawScene(pass,sunPipe,3,false);pass.end();lastSun=state.gate;lastUsedBundles=useBundles;
    }
    let pass=encoder.beginRenderPass({label:"Wet floor mirror view",colorAttachments:[clear(targets.refl)],depthStencilAttachment:depthAttachment(targets.reflDepth)});
    drawScene(pass,reflectionPipe,1,true);pass.end();
    if(basinVisible){
      pass=encoder.beginRenderPass({label:"Service basin mirror view",colorAttachments:[clear(targets.basinRefl)],
        depthStencilAttachment:{...depthAttachment(targets.basinDepth),depthStoreOp:"discard"}});
      drawScene(pass,basinReflectionPipe,4,true);pass.end();
    }
    pass=encoder.beginRenderPass({label:"Station HDR",colorAttachments:[clear(targets.color)],depthStencilAttachment:depthAttachment(targets.depth)});
    drawScene(pass,mainPipe,0,true);
    pass.setPipeline(particlePipe);
    pass.setBindGroup(0,frameGroup);pass.setBindGroup(1,shadowGroup);pass.setBindGroup(2,emptyGroup);pass.setBindGroup(3,dustGroup);
    pass.draw(6,particleCount);pass.end();
    pass=encoder.beginRenderPass({label:"Volumetric light",colorAttachments:[clear(targets.fog)]});
    pass.setPipeline(fogPipe);pass.setBindGroup(0,frameGroup);pass.setBindGroup(1,shadowGroup);pass.setBindGroup(2,targets.depthGroup);
    pass.draw(3);pass.end();
    pass=encoder.beginRenderPass({label:"Display",colorAttachments:[clear(context.getCurrentTexture().createView(),1)],
      ...(timing?{timestampWrites:{querySet:timing.query,endOfPassWriteIndex:1}}:{})});
    pass.setPipeline(displayPipe);pass.setBindGroup(0,frameGroup);pass.setBindGroup(1,emptyGroup);pass.setBindGroup(2,targets.displayGroup);pass.draw(3);pass.end();
    if(timing){
      encoder.resolveQuerySet(timing.query,0,2,timing.resolve,0);
      encoder.copyBufferToBuffer(timing.resolve,0,timing.read,0,16);
    }
    device.queue.submit([encoder.finish()]);frameSubmits=1;
    queuedFrames++;
    device.queue.onSubmittedWorkDone().then(()=>queuedFrames--,()=>queuedFrames--);
    if(timing){
      timing.busy=true;
      timing.read.mapAsync(GPUMapMode.READ).then(()=>{
        const t=new BigUint64Array(timing.read.getMappedRange());
        gpuMs=Number(t[1]-t[0])/1e6;timing.read.unmap();
      }).catch(()=>{}).finally(()=>timing.busy=false);
    }
  };
  resize();
}
const frameValues=new Float32Array(132+pumpBubbleCount*4);
function packPumpBubbles() {
  const clock=state.pumpTime-state.pumpStarted;
  const end=state.pumpStopped-state.pumpStarted;
  const rate=24;
  const [x,y,z]=basin.vent;
  let count=0;
  if(state.pumpOn||end>0){
    const last=Math.floor(Math.min(clock,state.pumpOn?clock:end)*rate);
    const first=Math.max(0,Math.ceil((clock-1.12)*rate));
    let seed=0;
    const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
    for(let i=last;i>=first;i--){
      seed=(Math.imul(i+31,1597334677))>>>0;
      const spawn=(i+0.50*random())/rate;
      const age=(clock-spawn)/(0.62+random()*0.48);
      if((!state.pumpOn&&spawn>end)||age<0||age>=1)continue;
      const angle=TAU*random()+age*7.7;
      const spread=(0.018+0.113*age)*Math.sqrt(random());
      const radius=(0.010+0.015*random()**1.25)*(0.86+age*0.23);
      const rise=age*(0.82+0.18*age);
      const offset=132+count*4;
      frameValues[offset]=x+0.12*age+Math.cos(angle)*spread;
      frameValues[offset+1]=(y+0.006)*(1-rise)-radius*rise*0.42;
      frameValues[offset+2]=z+Math.sin(angle)*spread;
      frameValues[offset+3]=radius;
      count++;
    }
  }
  const swell=smooth((clock-0.56)/0.56);
  frameValues[128]=clock;
  frameValues[129]=swell*(state.pumpOn?1:end>0?1-smooth((clock-end-0.60)/0.66):0);
  frameValues[130]=count;
}
function basinInView(matrix) {
  const [x,z]=basin.center, [w,d]=basin.half;
  let outside=31;
  for(const dx of [-w,w])for(const dz of [-d,d]){
    const px=x+dx, py=basin.level, pz=z+dz;
    const clipX=matrix[0]*px+matrix[4]*py+matrix[8]*pz+matrix[12];
    const clipY=matrix[1]*px+matrix[5]*py+matrix[9]*pz+matrix[13];
    const clipZ=matrix[2]*px+matrix[6]*py+matrix[10]*pz+matrix[14];
    const clipW=matrix[3]*px+matrix[7]*py+matrix[11]*pz+matrix[15];
    outside&=(clipX<-clipW?1:0)|(clipX>clipW?2:0)|(clipY<-clipW?4:0)|(clipY>clipW?8:0)|(clipZ<0?16:0);
  }
  return outside===0;
}
function frameParameters() {
  const t=state.elapsed;
  const title=state.mode==="title";
  const eye=title?[0.80+Math.sin(t*0.19)*0.32,1.38,1.8]:[state.x,state.y,state.z];
  const yaw=title?-0.11+0.042*Math.sin(t*0.25):state.yaw;
  const pitch=title?-0.045:state.pitch;
  const forward=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
  const right=[Math.cos(yaw),0,Math.sin(yaw)],up=cross(right,forward);
  const aspect=targets.width/targets.height,tan=Math.tan(fov/2);
  const projection=perspective(fov,aspect,0.06,92);
  const reflectedForward=[forward[0],-forward[1],forward[2]];
  const reflectedUp=[-up[0],up[1],-up[2]];
  const reflectedView=height=>matrixProduct(projection,look([eye[0],2*height-eye[1],eye[2]],reflectedForward,reflectedUp));
  const lamp=add(add(eye,mul(right,0.31)),add(mul(up,-0.18),mul(forward,0.18)));
  const aim=unit(add(forward,add(mul(right,-0.022),mul(up,0.031))));
  const sunCenter=[0,1,-16],sunEye=add(sunCenter,mul(sun,30));
  const normal=rotate(mirrorNormal,state.angle);
  const bounce=unit(sub(incoming,mul(normal,2*dot(incoming,normal))));
  const distanceToGate=bounce[2]<-0.01?(-18.23-mirror[2])/bounce[2]:10.0;
  const distanceToSide=(bounce[0]>0?5.95-mirror[0]:-5.95-mirror[0])/(Math.abs(bounce[0])<0.001?0.001:bounce[0]);
  const range=clamp(Math.min(distanceToGate,distanceToSide>0?distanceToSide:18),1,18);
  const view=matrixProduct(projection,look(eye,forward));
  frameValues.set(view,0);
  frameValues.set(reflectedView(0),16);
  frameValues.set(matrixProduct(perspective(1.02,1,0.035,32),look(lamp,aim)),32);
  frameValues.set(matrixProduct(ortho(23,18,0.3,68),look(sunEye,mul(sun,-1))),48);

  if(basinVisible)frameValues.set(reflectedView(basin.level),64);

    ...eye,t,...forward,0,...right,tan*aspect,...up,tan,
    ...lamp,Number(state.lamp),...aim,0,state.gate,smooth(state.gate*1.15),Number(state.align||state.relay),0,
    ...mirror,state.angle,...sensor,state.relay?1:state.charge,...bounce,range,
    ...state.foot,0,state.step,0,state.rippleAge,0,
  ],80);
  frameValues[131]=Number(state.pumpOn);
  if(basinVisible)packPumpBubbles();
  device.queue.writeBuffer(frameBuffer,0,frameValues);
  return basinVisible;
}
function fail(err) {
  if(fatal)return;
  fatal=true;ready=false;
  stationAudio.clear();
  console.error(err);
  releaseFrame();
  el("title").hidden=false;el("hud").hidden=true;el("pause").hidden=true;
  el("start").hidden=true;
  el("error").hidden=false;el("error").textContent=err.message||String(err);
}
function loop(now) {
  if(fatal)return;
  try{
    const id=requestAnimationFrame(loop);
    releaseFrame=()=>cancelAnimationFrame(id);
    if(document.hidden||queuedFrames>=2||!resize())return;
    const dt=lastTime?Math.min(0.08,(now-lastTime)/1000):0;
    lastTime=now;
    update(dt);updateHud();
    const begin=performance.now(), sample=statsVisible&&now-lastStats>390;
    drawFrame(sample,frameParameters());
    encodeMs=encodeMs*0.90+(performance.now()-begin)*0.10;
    if(!ready){
      ready=true;el("start").disabled=false;el("start").firstElementChild.textContent="进入泵站";
    }
    if(sample){
      lastStats=now;
      el("stats").textContent=[
        "WebGPU  "+Math.round(fps)+" FPS  "+targets.width+"×"+targets.height+"  "+Math.round(renderScales[renderScaleIndex]*100)+"%",
        "CPU 编码与提交 "+encodeMs.toFixed(2)+" ms",
        "GPU 帧 "+(gpuMs===null?"—":gpuMs.toFixed(2)+" ms"),
        "队列提交 "+frameSubmits+" 次 / 帧",
        "B · 静态绘制包 "+(useBundles&&recordedBundleCount?"可重放 "+recordedBundleCount+" / 5":"直接编码"),
      ].join("\n");
    }
    recordRenderedFrame(now);
  }catch(err){fail(err);}
}
setup().then(()=>{const id=requestAnimationFrame(loop);releaseFrame=()=>cancelAnimationFrame(id);}).catch(fail);

</script>
